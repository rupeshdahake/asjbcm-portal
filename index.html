<style>
:root{
  --bg:#f2f6fc; --bg2:#e9f0fa; --card:#ffffff; --ink:#2b3a55; --ink2:#5b6b85; --muted:#8a97ad;
  --line:#e0e9f6; --brand:#2e6fe8; --brand2:#6ea3f5; --brandsoft:#eaf2fe;
  --teal:#2fb7a5; --rose:#e5618f; --amber:#f0a63a; --green:#31b573; --red:#e35d5d; --violet:#8b6fe8;
  --shadow:0 6px 24px rgba(90,110,160,.10); --shadow2:0 12px 40px rgba(90,110,160,.16);
  --r:16px; --r2:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans','Noto Sans Devanagari',Roboto,Arial,sans-serif;
  background:linear-gradient(165deg,#f2f7fe 0%,#e9f1fc 45%,#eaf0fd 100%);color:var(--ink);min-height:100vh;
  background-attachment:fixed;font-size:15.5px;line-height:1.55}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c3d0e6;border-radius:8px;border:2px solid #eef2f9}
::-webkit-scrollbar-track{background:#eef2f9}
a{color:var(--brand);text-decoration:none}
h1,h2,h3,h4{line-height:1.25;color:var(--ink)}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--ink)}
:focus-visible{outline:3px solid #bcd0ff;outline-offset:1px;border-radius:6px}

/* ---------- Header ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);box-shadow:0 2px 18px rgba(90,110,160,.07)}
.topbar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 22px}
.logo-badge{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffffff,#eef3fc);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;
  box-shadow:0 4px 14px rgba(90,110,160,.16)}
.logo-badge img{width:44px;height:44px;object-fit:contain}
.brand-txt{flex:1 1 200px;min-width:180px}
@media (max-width:1150px){.brand-sub{display:none}.brand-name{font-size:12.5px}}
.user-chip,.lang-btn,.icon-btn,.xp-chip{flex:none}
.brand-name{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:14px;letter-spacing:.3px;color:#22345c;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--ink2);letter-spacing:.6px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;max-width:46vw;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 13px;border-radius:999px;color:var(--ink2);font-weight:600;font-size:13.5px;transition:.18s;cursor:pointer;white-space:nowrap;flex:none}
.nav a:hover{background:var(--brandsoft);color:var(--brand)}
.nav a.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(46,111,232,.34)}
.user-chip{display:flex;align-items:center;gap:9px;background:var(--brandsoft);border:1px solid var(--line);
  padding:5px 12px 5px 6px;border-radius:999px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--violet));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.user-chip .un{font-size:13px;font-weight:700;color:var(--ink)}
.user-chip .ur{font-size:10.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
.lang-btn,.icon-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;
  font-weight:700;color:var(--ink2);cursor:pointer;transition:.18s}
.lang-btn:hover,.icon-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brandsoft)}

/* ---------- Layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:26px 22px 70px}
.hero{background:linear-gradient(120deg,#e3edff 0%,#e8e7fc 55%,#e0f4fb 100%);border:1px solid var(--line);
  border-radius:22px;padding:30px 34px;margin-bottom:26px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,#c9d9ff55,transparent 70%)}
.hero:after{content:"";position:absolute;left:32%;bottom:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,#d5f4ec55,transparent 70%)}
.hero h1{font-size:26px;margin-bottom:8px;color:#22345c}
.hero p{color:var(--ink2);max-width:760px;font-size:15px}
.hero .hi-line{font-size:13.5px;color:var(--muted);margin-top:4px}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px;flex-wrap:wrap}
.sect-h h2{font-size:21px}
.sect-h .crumb{font-size:13px;color:var(--muted);font-weight:600}
.crumb b{color:var(--brand);cursor:pointer}
.crumb b:hover{text-decoration:underline}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-weight:700;
  border-radius:12px;padding:11px 20px;font-size:14.5px;transition:.18s;text-decoration:none}
.btn-p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 5px 16px rgba(46,111,232,.32)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(46,111,232,.42)}
.btn-t{background:linear-gradient(135deg,var(--teal),#57d0c0);color:#fff;box-shadow:0 5px 16px rgba(47,183,165,.28)}
.btn-t:hover{transform:translateY(-2px)}
.btn-g{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.btn-g:hover{border-color:var(--brand);color:var(--brand);background:var(--brandsoft)}
.btn-d{background:#fff;color:var(--red);border:1.5px solid #f3c9c9}
.btn-d:hover{background:#fdf1f1;border-color:var(--red)}
.btn-s{padding:7px 14px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-block{width:100%}

/* ---------- Forms ---------- */
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px;letter-spacing:.3px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;background:#fbfcfe;transition:.18s}
.inp:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px #e6edfd}
textarea.inp{min-height:90px;resize:vertical;line-height:1.5}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.form-row{display:flex;gap:14px;flex-wrap:wrap}
.form-row>.field{flex:1;min-width:180px}

/* ---------- Auth / first-run ---------- */
.auth-wrap{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:30px 16px}
.auth-card{width:100%;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow2);padding:34px 34px 30px;position:relative;overflow:hidden}
.auth-card:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--brand),var(--violet),var(--teal))}
.auth-logo{text-align:center;margin-bottom:6px}
.auth-logo img{width:84px;height:84px;object-fit:contain}
.auth-h{font-size:20px;text-align:center;margin-bottom:4px}
.auth-sub{font-size:13px;color:var(--ink2);text-align:center;margin-bottom:22px}
.steps{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.step-dot{width:34px;height:6px;border-radius:6px;background:var(--line)}
.step-dot.on{background:linear-gradient(90deg,var(--brand),var(--brand2))}
.alert{border-radius:12px;padding:12px 15px;font-size:13.5px;margin-bottom:14px;border:1px solid}
.alert-err{background:#fdf1f1;border-color:#f3c9c9;color:#b23a3a}
.alert-ok{background:#eefaf3;border-color:#c4e8d2;color:#1f7a4d}
.alert-info{background:var(--brandsoft);border-color:#d4e0fb;color:#3a55a8}
</style>

<style>
/* ---------- Subject cards (soft) ---------- */
.subj-card{border-radius:20px;padding:24px;color:#fff;cursor:pointer;position:relative;overflow:hidden;
  transition:.22s;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.35)}
.subj-card:hover{transform:translateY(-4px);box-shadow:var(--shadow2)}
.subj-card .ic{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;
  align-items:center;justify-content:center;font-size:28px;margin-bottom:14px;backdrop-filter:blur(4px)}
.subj-card h3{color:#fff;font-size:18.5px;margin-bottom:5px}
.subj-card .src{font-size:12px;opacity:.92;font-style:italic}
.subj-card .meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);padding:4px 11px;border-radius:999px;
  font-size:11.5px;font-weight:700;color:#fff;backdrop-filter:blur(3px)}
.subj-card:after{content:"";position:absolute;right:-40px;bottom:-40px;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.12)}

/* ---------- Colorful chapter cards ---------- */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.ch-card{border-radius:18px;padding:20px;color:#fff;cursor:pointer;position:relative;overflow:hidden;transition:.2s;
  min-height:158px;display:flex;flex-direction:column;box-shadow:0 6px 18px rgba(60,70,120,.18)}
.ch-card:hover{transform:translateY(-5px) scale(1.015);box-shadow:0 14px 30px rgba(60,70,120,.28)}
.ch-card:before{content:"";position:absolute;top:-34px;right:-34px;width:110px;height:110px;border-radius:50%;
  background:rgba(255,255,255,.16)}
.ch-card .num{position:absolute;right:14px;top:12px;font-size:34px;font-weight:800;opacity:.28;font-family:Georgia,serif}
.ch-card .ic{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.24);display:flex;align-items:center;
  justify-content:center;font-size:22px;margin-bottom:10px}
.ch-card h4{color:#fff;font-size:15.5px;line-height:1.3;margin-bottom:2px;text-shadow:0 1px 2px rgba(0,0,0,.12)}
.ch-card .hname{font-size:11.5px;opacity:.9}
.ch-card .tags{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:12px}
.ch-card .tag{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700}
.ch-card .shine{position:absolute;top:0;left:-70%;width:45%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);transition:.55s}
.ch-card:hover .shine{left:130%}

/* ---------- Chapter tabs ---------- */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);
  font-weight:700;font-size:13.5px;cursor:pointer;transition:.16s}
.tab:hover{border-color:var(--brand);color:var(--brand)}
.tab.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(74,111,220,.3)}
.notes-body{font-size:15px;color:#3a4a68}
.notes-body h4{margin:16px 0 7px;color:#2b3a55;font-size:16px}
.notes-body ul{margin:6px 0 12px 20px}
.notes-body li{margin-bottom:5px}
.notes-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.8px}
.notes-body th{background:var(--brandsoft);color:#2b3a55;text-align:left}
.notes-body th,.notes-body td{border:1px solid var(--line);padding:8px 11px}
.tip-list{counter-reset:tip}
.tip-list li{list-style:none;position:relative;padding:12px 14px 12px 52px;background:#fbfcfe;border:1px solid var(--line);
  border-radius:12px;margin-bottom:10px}
.tip-list li:before{counter-increment:tip;content:counter(tip);position:absolute;left:13px;top:12px;width:26px;height:26px;
  border-radius:50%;background:linear-gradient(135deg,var(--teal),#57d0c0);color:#fff;font-weight:800;font-size:13px;
  display:flex;align-items:center;justify-content:center}
.lang-tag{font-size:10.5px;font-weight:800;letter-spacing:.6px;padding:2px 8px;border-radius:6px;vertical-align:middle}
.tag-en{background:#e7f0fe;color:#3a63c0}
.tag-hi{background:#fdeee7;color:#c05a2e}

/* ---------- Question / exam ---------- */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.q-num{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.4px}
.q-text{font-size:16.5px;font-weight:600;color:#26344e;margin:8px 0 16px;line-height:1.6}
.q-svg{background:#fbfcff;border:1px solid var(--line);border-radius:14px;padding:10px;margin:4px 0 16px;text-align:center}
.q-svg svg{max-width:100%;height:auto}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.7px solid var(--line);border-radius:13px;padding:13px 16px;
  margin-bottom:10px;cursor:pointer;transition:.15s;background:#fff;font-size:15px}
.opt:hover{border-color:var(--brand2);background:#f8faff}
.opt .k{width:27px;height:27px;border-radius:8px;background:var(--brandsoft);color:var(--brand);font-weight:800;
  display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.opt.sel{border-color:var(--brand);background:#f1f6ff;box-shadow:0 0 0 3px #e3ecfd}
.opt.ok{border-color:var(--green);background:#effaf3}
.opt.bad{border-color:var(--red);background:#fdf2f2}
.opt .k.ok{background:var(--green);color:#fff}
.opt .k.bad{background:var(--red);color:#fff}
.fb{border-radius:12px;padding:13px 16px;margin-top:12px;font-size:14px;border:1px solid}
.fb-ok{background:#effaf3;border-color:#c4e8d2}
.fb-bad{background:#fdf2f2;border-color:#f3c9c9}
.fb .fb-t{font-weight:800;margin-bottom:4px}
.exam-layout{display:grid;grid-template-columns:1fr 270px;gap:20px;align-items:start}
.pal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);
  position:sticky;top:90px}
.pal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}
.pq{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-weight:700;
  font-size:12.5px;cursor:pointer;transition:.12s;display:flex;align-items:center;justify-content:center}
.pq:hover{border-color:var(--brand)}
.pq.cur{outline:3px solid #bcd0ff}
.pq.ans{background:#31b573;border-color:#31b573;color:#fff}
.pq.mark{background:#8b6fe8;border-color:#8b6fe8;color:#fff}
.pq.seen{background:#dfe8f7;border-color:#dfe8f7}
.pal-legend{font-size:11px;color:var(--ink2);display:grid;gap:5px}
.pal-legend span{display:flex;align-items:center;gap:7px}
.dotk{width:12px;height:12px;border-radius:4px;flex:none;border:1px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:9px 16px;font-size:15px;color:var(--ink)}
.timer.warn{border-color:var(--red);color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{background:#fdf2f2}}
.exam-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.exam-title{font-size:17px;font-weight:800}
.mark-star{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:12.5px;
  font-weight:700;color:var(--violet);cursor:pointer}
.mark-star.on{background:#f3effd;border-color:var(--violet)}

/* ---------- Result ---------- */
.score-ring{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:conic-gradient(var(--brand) calc(var(--pct)*1%), #e8eefb 0);position:relative}
.score-ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.score-ring .rv{position:relative;font-size:26px;font-weight:800;color:var(--ink)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat{background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:11.5px;color:var(--ink2);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.v.g{color:var(--green)} .v.r{color:var(--red)} .v.b{color:var(--brand)} .v.o{color:var(--amber)}
.rev-item{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.rev-h{padding:11px 16px;background:#fbfcfe;display:flex;justify-content:space-between;gap:10px;align-items:center;
  cursor:pointer;font-size:13.5px;font-weight:700}
.rev-b{padding:6px 18px 16px;display:none;border-top:1px solid var(--line)}
.rev-item.open .rev-b{display:block}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.b-ok{background:#e5f7ec;color:#1f7a4d} .b-bad{background:#fdeaea;color:#b23a3a}
.b-skip{background:#f1f3f8;color:#69748c} .b-info{background:#e7f0fe;color:#3a63c0}

/* ---------- Tables / admin ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13.8px;min-width:640px}
.tbl th{background:#f5f8fd;text-align:left;padding:11px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid #eef2f8;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fafcff}
.tbl .act{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:700;
  color:var(--ink2);cursor:pointer;transition:.14s}
.mini:hover{border-color:var(--brand);color:var(--brand)}
.mini.dz:hover{border-color:var(--red);color:var(--red)}
.mini.gn:hover{border-color:var(--green);color:var(--green)}
.status{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.st-on{background:#e5f7ec;color:#1f7a4d} .st-off{background:#fdeaea;color:#b23a3a}
.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.log-a{font-weight:800;font-size:11.5px;padding:3px 9px;border-radius:6px;background:#eef2f9;color:#4a5a78;white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters .inp{width:auto;min-width:170px;padding:9px 12px}
.kbd{background:#f1f4fa;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-family:Consolas,monospace}

/* ---------- Leaderboard ---------- */
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #eef2f8}
.lb-row:last-child{border-bottom:none}
.lb-rank{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;
  background:#eef2f9;color:var(--ink2);flex:none}
.lb-rank.r1{background:linear-gradient(135deg,#ffd76e,#f0a63a);color:#7a4c00}
.lb-rank.r2{background:linear-gradient(135deg,#e8edf5,#c3cede);color:#4a5568}
.lb-rank.r3{background:linear-gradient(135deg,#f0b08e,#d97b4f);color:#6b3200}
.lb-name{flex:1;font-weight:700}
.lb-sub{font-size:12px;color:var(--muted)}
.lb-score{font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}

/* ---------- Certificate ---------- */
.cert-page{padding-bottom:30px}
.cert{background:#fff;border-radius:6px;max-width:960px;margin:0 auto;padding:44px 52px;position:relative;
  border:3px solid #2c4a8a;box-shadow:var(--shadow2)}
.cert:before{content:"";position:absolute;inset:9px;border:1.5px solid #c9a44a;pointer-events:none}
.cert-head{display:flex;align-items:center;gap:20px;border-bottom:2px solid #2c4a8a;padding-bottom:16px}
.cert-head img{width:84px;height:84px;object-fit:contain}
.cert-head .cn{font-family:Georgia,serif;font-size:17.5px;font-weight:700;color:#22345c;line-height:1.35}
.cert-head .ct{font-size:11px;letter-spacing:2.5px;color:#8a6d1f;text-transform:uppercase;margin-top:3px}
.cert-title{text-align:center;font-family:Georgia,serif;font-size:34px;color:#2c4a8a;letter-spacing:5px;margin:26px 0 4px;font-weight:700}
.cert-sub{text-align:center;color:#8a6d1f;font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-bottom:22px}
.cert-name{text-align:center;font-family:Georgia,serif;font-size:31px;color:#1e2c4f;font-weight:700;
  border-bottom:2px solid #c9a44a;display:table;margin:6px auto 8px;padding:0 34px 6px}
.cert-line{text-align:center;color:#4a5a78;font-size:14.5px;max-width:620px;margin:0 auto 20px}
.cert-stats{display:flex;justify-content:center;gap:34px;margin:18px 0 24px;flex-wrap:wrap}
.cert-stat{text-align:center}
.cert-stat .v{font-size:23px;font-weight:800;color:#2c4a8a;font-family:Georgia,serif}
.cert-stat .l{font-size:10.5px;letter-spacing:1.5px;color:#8a97ad;text-transform:uppercase}
.cert-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-top:26px}
.cert-sign{text-align:center;min-width:170px}
.cert-sign .ln{border-top:1.5px solid #2b3a55;margin-bottom:5px;padding-top:5px;font-weight:700;font-size:12.5px}
.cert-sign .ls{font-size:10.5px;color:var(--muted)}
.cert-qr{text-align:center}
.cert-qr .cid{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.5px}
.cert-seal{position:absolute;right:56px;top:120px;width:88px;height:88px;border-radius:50%;border:2px dashed #c9a44a;
  display:flex;align-items:center;justify-content:center;text-align:center;color:#a3822a;font-size:9.5px;font-weight:800;
  letter-spacing:1px;transform:rotate(-12deg);background:#fffdf5;line-height:1.4}
.cert-actions{max-width:960px;margin:16px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- Modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(35,45,70,.45);backdrop-filter:blur(3px);z-index:100;display:none;
  align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:28px;
  box-shadow:0 24px 70px rgba(30,40,70,.35);animation:up .22s}
@keyframes up{from{transform:translateY(18px);opacity:0}}
.modal h3{margin-bottom:14px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);background:#26344e;color:#fff;
  padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:120;transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.empty{text-align:center;color:var(--muted);padding:44px 20px}
.empty .e-ic{font-size:44px;margin-bottom:10px;opacity:.6}

/* ---------- Print ---------- */
@media print{
  body *{visibility:hidden}
  .cert-page, .cert-page *{visibility:visible}
  .cert-page{display:block!important;position:absolute;left:0;top:0;width:100%}
  .cert{box-shadow:none;margin:0;border-radius:0;max-width:100%}
  .cert-actions,.topbar,#toast{display:none!important}
  @page{size:A4 landscape;margin:8mm}
}
/* ---------- Responsive ---------- */
@media (max-width:980px){
  .exam-layout{grid-template-columns:1fr}
  .pal{position:static}
  .pal-grid{grid-template-columns:repeat(10,1fr)}
  .daily-banner,.daily-hero{padding:16px 18px}
}
@media (max-width:760px){
  .topbar-in{flex-wrap:wrap}
  .brand-name{white-space:normal;font-size:13px;line-height:1.35}
  .nav{order:3;width:100%;overflow-x:auto}
  .hero{padding:22px}
  .hero h1{font-size:20px}
  .wrap{padding:18px 14px 60px}
  .cert{padding:26px 20px}
  .cert-title{font-size:24px}
  .cert-name{font-size:22px}
  .cert-seal{display:none}
  .ch-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .xp-chip{display:none}
}

/* ---------- Modern learning components ---------- */
.xp-chip{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#eaf2fe,#f4f0fe);border:1px solid #d4e2fa;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink2);white-space:nowrap}
.xp-chip b{color:var(--brand)}
.xp-chip span{font-size:10.5px;opacity:.8}
.xp-chip.flame{background:#fff7ec;border-color:#ffe0b3}
.xp-chip.flame b{color:#e8821d}
.goal-chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.goal-chip{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:700;box-shadow:0 3px 10px rgba(46,111,232,.3)}
.goal-chip.alt{background:#fff;color:var(--ink2);border:1px solid var(--line);box-shadow:none}
.daily-banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:18px;padding:18px 22px;margin-bottom:20px;
  background:linear-gradient(115deg,#2e6fe8 0%,#7b3fe4 60%,#b844d8 100%);color:#fff;box-shadow:0 10px 28px rgba(46,111,232,.35);position:relative;overflow:hidden}
.daily-banner:before{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.daily-banner.done{background:linear-gradient(115deg,#0f9d76 0%,#27b784 100%);box-shadow:0 10px 28px rgba(31,160,110,.32)}
.daily-banner .db-ic{font-size:38px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.daily-banner .db-txt{flex:1;min-width:200px}
.daily-banner h3{color:#fff;font-size:17px;margin-bottom:2px}
.daily-banner p{font-size:13px;opacity:.94;margin:0}
.btn-w{background:#fff;color:var(--brand);box-shadow:0 4px 14px rgba(255,255,255,.35)}
.btn-w:hover{transform:translateY(-2px)}
.continue-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:#fff;
  border:1.5px dashed #b9cdf2;border-radius:16px;padding:14px 20px;margin-bottom:20px;cursor:pointer;transition:.18s}
.continue-card:hover{border-color:var(--brand);background:#f8fbff;transform:translateY(-2px)}
.continue-card .cc-p{background:var(--brandsoft);color:var(--brand);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;margin-left:8px}
.subj-card .sbar,.ch-card .chbar{height:7px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:14px;overflow:hidden}
.subj-card .sbar>div,.ch-card .chbar>div{height:100%;border-radius:99px;background:#fff;transition:width .5s;box-shadow:0 0 8px rgba(255,255,255,.7)}
.subj-card .slbl{font-size:11px;margin-top:5px;opacity:.92;font-weight:700}
.subj-card.tgt{outline:3px solid #ffd76e;outline-offset:2px}
.tgt-badge{position:absolute;top:14px;right:14px;background:#ffd76e;color:#7a4c00;font-size:10.5px;font-weight:800;border-radius:999px;padding:4px 11px;box-shadow:0 3px 8px rgba(0,0,0,.18);z-index:2}
/* registration chips */
.reg-goal{background:#f7faff;border:1px solid var(--line);border-radius:14px;padding:14px 16px 4px;margin-bottom:16px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chipsel{cursor:pointer}
.chipsel input{position:absolute;opacity:0;pointer-events:none}
.chipsel span{display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink2);transition:.15s;user-select:none}
.chipsel input:checked+span{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(46,111,232,.3)}
.chipsel:hover span{border-color:var(--brand)}
/* daily hero / week / xp */
.daily-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-radius:20px;padding:26px 28px;margin-bottom:20px;
  background:linear-gradient(115deg,#2e6fe8,#7b3fe4);color:#fff;box-shadow:0 12px 30px rgba(46,111,232,.35)}
.daily-hero .dh-ic{font-size:52px}
.daily-hero h2{color:#fff;font-size:28px;margin-bottom:2px}
.daily-hero p{opacity:.95;font-size:14px}
.dweek{display:flex;gap:12px;flex-wrap:wrap}
.dwd{text-align:center}
.dwc{width:44px;height:44px;border-radius:14px;background:#f2f6fd;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.dwc.on{background:linear-gradient(135deg,#0f9d76,#27b784);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(31,160,110,.35)}
.dwd.today .dwc{outline:3px solid #ffd76e;outline-offset:2px}
.dwl{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:4px;text-transform:uppercase}
.xp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.xp-item{background:#f7faff;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.xp-item b{color:var(--green)}
.lv-path{display:flex;gap:8px;flex-wrap:wrap}
.lv-node{border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;background:#f2f6fd;color:var(--muted);border:1px solid var(--line)}
.lv-node.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
/* flashcards */
.fc-scene{perspective:1200px;cursor:pointer}
.fc-inner{position:relative;width:100%;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px}
.fc-front{background:linear-gradient(135deg,#2e6fe8,#6ea3f5);color:#fff;box-shadow:0 12px 30px rgba(46,111,232,.35)}
.fc-back{background:#fff;border:2px solid #cfe0fb;transform:rotateY(180deg);box-shadow:var(--shadow)}
.fc-q{font-size:18px;font-weight:700;line-height:1.5}
.fc-hint{margin-top:14px;font-size:11.5px;opacity:.85}
.fc-a{font-size:18px;font-weight:800;color:#1f7a4d}
.fc-e{font-size:13.5px;color:var(--ink2);margin-top:10px}
/* pins & activity */
.pin{border:none;background:none;font-size:15px;cursor:pointer;opacity:.45;transition:.15s}
.pin.pin-on,.btn.pin-on,.mini.pin-on{opacity:1;filter:drop-shadow(0 0 4px #ffb84d);background:#fff7ec}
.btn.pin-on{border-color:#ffd76e!important}
.act-row{display:flex;align-items:center;gap:14px;padding:11px 6px;border-bottom:1px solid #eef2f8}
.act-row:last-child{border-bottom:none}
.act-ic{width:36px;height:36px;border-radius:12px;background:var(--brandsoft);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.act-b{flex:1;min-width:0}

<script>
/* ===== ENGLISH — rule-based grammar course ===== */
(function(){
function C(id,s,t,th,icon,nE,nH,gE,gH){CHP.push({id:id,s:s,t:t,th:th,icon:icon,notes:{en:nE,hi:nH},guide:{en:gE,hi:gH}})}
function Q(id,c,q,qh,o,oh,a,e,eh,svg){QB.push({id:id,s:(SUBJECTS.find(x=>c.startsWith(x.id))||{id:c.slice(0,3)}).id,c:c,q:q,qh:qh,o:o,oh:oh,a:a,e:e,eh:eh,svg:svg||""})}

/* ---------- 1. VERB & MODALS ---------- */
C("eng1","eng","Verb & Modals","क्रिया एवं मोडल्स","⚡",
"<b>Main Verb (M.V.)</b> shows the action or state: <i>I <b>need</b> you.</i> <b>Helping Verb (H.V.)</b> supports the main verb: be (is/am/are/was/were), do, have — and the <b>Modals</b>: can, could, may, might, shall, should, will, would, must, ought to, used to, dare, need.<br><br><b>Golden rules to remember:</b><ul><li>A modal is always followed by the <b>bare infinitive</b> (V1 without 'to'): <i>He <b>can swim</b></i>.</li><li><b>Can</b> = ability or theoretical possibility — <i>Everyone can make a mistake</i>. <b>Could</b> = past ability or remote possibility — <i>There could be a bomb under your seat</i>.</li><li><b>May</b> = permission/formal wish (<i>May God bless you!</i>); <b>Might</b> = faint possibility.</li><li><b>Must</b> = compulsion; <b>should/ought to</b> = duty and advice.</li><li><b>Used to</b> shows a past habit: <i>I used to swim daily</i>.</li><li><b>Dare/Need</b> — as modals they take V1 with 'not': <i>He dare not enter</i>, <i>You need not come</i>. As main verbs they take 'to': <i>He does not dare to enter</i>.</li><li>'<b>Can be able to</b>' is superfluous (double expression) — always wrong.</li></ul>",
"<b>मुख्य क्रिया</b> कार्य दिखाती है, <b>सहायक क्रिया</b> उसका समर्थन करती है।<ul><li>मोडल के बाद हमेशा V1 (बिना 'to') आता है।</li><li>Can = योग्यता; Could = भूतकालिक योग्यता/विनम्र अनुरोध।</li><li>May = अनुमति/आशीर्वाद; Might = संभावना।</li><li>Must = बाध्यता; Should/Ought to = कर्तव्य।</li><li>Used to = भूतकाल की आदत।</li><li>Dare not / Need not + V1; परंतु does not dare to + V1।</li><li>'Can be able to' कभी न लिखें — यह अनावश्यक दोहराव है।</li></ul>",
["Memorise the modal + V1 pattern; 90% of modal errors break this rule.","Never pair a modal with 'to' — 'can to go' is always wrong.","Watch for superfluous pairs: can be able, must to, should to.","'Need not + V1' but 'does not need to + V1' — know both forms.","In wish/blessing sentences choose 'May' at the start."],
["मोडल + V1 नियम याद रखें; 90% त्रुटियाँ इसी से होती हैं।","मोडल के साथ 'to' कभी न जोड़ें।","'Can be able to' जैसे दोहराव कभी न करें।","Need not + V1, परंतु does not need to + V1।","आशीर्वाद वाक्यों में 'May' का प्रयोग करें।"]);

Q("eng1a","eng1","Choose the correct sentence:","सही वाक्य चुनें:",
["I cannot be able to come tomorrow.","I cannot come tomorrow.","I can not able to come tomorrow.","I could not be able to come tomorrow."],
["I cannot be able to come tomorrow.","I cannot come tomorrow.","I can not able to come tomorrow.","I could not be able to come tomorrow."],
1,"'Can' and 'be able to' express the same ability, so using both together is superfluous. Correct form: <b>I cannot come tomorrow</b> or <b>I will not be able to come tomorrow</b>.",
"'Can' और 'be able to' एक ही योग्यता बताते हैं, अतः दोनों एक साथ अनावश्यक हैं। सही रूप: <b>I cannot come tomorrow</b>।");
Q("eng1b","eng1","When I was young, I ___ climb trees easily.","जब मैं युवा था, मैं आसानी से पेड़ पर ___ चढ़ सकता था।",
["can","may","could","must"],["can","मेरे लिए संभव है","could","must"],2,
"Past ability is expressed by <b>could</b> (the past form of 'can'). 'Can' refers to present ability, so it cannot describe a childhood habit.",
"भूतकाल की योग्यता <b>could</b> से दिखाई जाती है (can का भूत रूप)। 'Can' वर्तमान योग्यता बताता है।");
Q("eng1c","eng1","You ___ not smoke here; it is strictly prohibited.","आप यहाँ धूम्रपान ___ नहीं कर सकते; यह पूर्णतः निषिद्ध है।",
["need","must","could","might"],["सकते हैं","नहीं कर सकते — निषेध","सकते थे","शायद"],1,
"<b>Must not</b> expresses prohibition (something is strictly forbidden). 'Need not' only means absence of necessity — the act is optional, not forbidden.",
"<b>Must not</b> निषेध दर्शाता है। 'Need not' केवल आवश्यकता का अभाव दिखाता है, निषेध नहीं।");
Q("eng1d","eng1","He dare not ___ me a liar.","वह मुझे झूठा ___ नहीं।",
["to call","calling","call","called"],["कहने के लिए","कह रहा","कह","कहा"],2,
"When <b>dare</b> is a modal (followed by 'not'), it takes the bare infinitive: <i>dare not call</i>. 'To call' would be used only in the main-verb form: <i>does not dare to call</i>.",
"जब <b>dare</b> मोडल हो (बाद में 'not' हो), तो उसके बाद V1 आता है: <i>dare not call</i>।");
Q("eng1e","eng1","___ God bless you with success!","___ ईश्वर आपको सफलता दे!",
["Can","May","Must","Should"],["चाहिए","प्रार्थना — May","अवश्य","चाहिए था"],1,
"Formal wishes and blessings begin with <b>May</b> + subject + V1: <i>May God bless you!</i> 'Can' expresses ability, not a blessing.",
"औपचारिक कामना/आशीर्वाद <b>May</b> से शुरू होता है: <i>May God bless you!</i>");
Q("eng1f","eng1","We ___ respect our elders.","हमें बड़ों का सम्मान ___ करना चाहिए।",
["ought","ought to","must to","should to"],["ought","ought to","must to","should to"],1,
"<b>Ought to</b> expresses moral duty and always takes 'to'. 'Must to' and 'should to' are wrong because must/should already take the bare infinitive.",
"<b>Ought to</b> नैतिक कर्तव्य दिखाता है और उसके साथ 'to' आता है। 'Must to'/'Should to' गलत हैं।");
Q("eng1g","eng1","How ___ you speak to me like this?","तुम मेरे साथ ऐसा ___ बोलते हो?",
["dare","dared to","daring","dares"],["हिम्मत","हिम्मत की","हिम्मत रखते हुए","हिम्मत रखता"],0,
"In indignation questions, <b>dare</b> acts as a modal and takes V1 directly: <i>How dare you speak...?</i> No 'to' and no '-s' is added.",
"क्रोध/आश्चर्य वाले प्रश्नों में <b>dare</b> मोडल है और सीधे V1 लेता है: <i>How dare you speak...?</i>");

/* ---------- 2. TENSE ---------- */
C("eng2","eng","Tense","काल (टेंस)","⏳",
"English has <b>12 tenses</b> (3 times × 4 aspects). Exam favourites:<ul><li><b>Present Perfect Continuous</b> (has/have been + V-ing) is used with '<b>since</b>' (point of time) and '<b>for</b>' (period): <i>He has been ill <b>since</b> Monday, <b>for</b> three days</i>.</li><li><b>Past Perfect</b> (had + V3) shows the earlier of two past actions: <i>The train <b>had left</b> before I reached</i>.</li><li><b>Simple Past</b> is used with definite past words — yesterday, last week, ago, in 1947 — never with present perfect (<i>He went yesterday</i>, not 'has gone yesterday').</li><li><b>Universal truths</b> stay in simple present: <i>The earth revolves round the sun</i>.</li><li><b>Future Perfect</b> (will have + V3) — by + future time: <i>By 2030 he will have completed the project</i>.</li><li>Two simultaneous past actions → <b>Past Continuous</b> for the longer one: <i>I was reading when he came</i>.</li></ul>",
"अंग्रेज़ी में <b>12 काल</b> होते हैं। परीक्षा-उपयोगी नियम:<ul><li>Since (बिंदु) / For (अवधि) के साथ Present Perfect Continuous।</li><li>दो भूतकालिक क्रियाओं में पहली Past Perfect (had + V3) में।</li><li>Yesterday/last week/ago के साथ Simple Past, Present Perfect नहीं।</li><li>सनातन सत्य Simple Present में रहता है।</li><li>'By + भविष्य समय' के साथ Future Perfect।</li></ul>",
["Anchor the sentence on its time-word first — since/for/yesterday decide the tense.","Universal truths never take past or perfect forms.","Before 'ago/yesterday/last', present perfect is always wrong.","In two-past-action sentences, the earlier action takes 'had + V3'.","Practise 2–3 sentences of each tense daily — write them from memory."],
["समय-सूचक शब्द पहले देखें — since/for/yesterday काल तय करते हैं।","सनातन सत्य कभी भूतकाल में नहीं।","Ago/yesterday के साथ Present Perfect गलत।","दो भूत क्रियाओं में पहली क्रिया had + V3 लेती है।","प्रतिदिन प्रत्येक काल के 2–3 वाक्य अभ्यास करें।"]);

Q("eng2a","eng2","He ___ here since 2015.","वह 2015 से यहाँ ___ है।",
["is living","has been living","lives","was living"],["रह रहा है (वर्तमान)","रहता आ रहा है (2015 से निरंतर)","रहता है","रहा था"],1,
"With '<b>since</b>' + point of time, an action continuing till now takes the <b>Present Perfect Continuous</b>: has/have been + V-ing.",
"'<b>Since</b>' + समय-बिंदु के साथ निरंतर चलने वाली क्रिया <b>Present Perfect Continuous</b> में आती है।");
Q("eng2b","eng2","The train ___ before we reached the station.","हमारे स्टेशन पहुँचने से पहले गाड़ी ___।",
["left","has left","had left","was leaving"],["छूटी","छूट चुकी है","छूट चुकी थी","छूट रही थी"],2,
"Two past actions — the one that happened <b>first</b> goes into the <b>Past Perfect</b> (had left); the later one stays in simple past (reached).",
"दो भूतकालिक क्रियाओं में जो <b>पहले</b> घटित हुई, वह <b>Past Perfect</b> में जाती है।");
Q("eng2c","eng2","I ___ him yesterday.","मैंने उसे कल ___।",
["have met","met","had met","meet"],["मिला हूँ","मिला","मिला था","मिलता हूँ"],1,
"'<b>Yesterday</b>' is a definite past time, so the simple past (<b>met</b>) is used. Present perfect never pairs with yesterday/ago/last week.",
"'<b>Yesterday</b>' निश्चित भूतकाल है, अतः Simple Past (<b>met</b>) प्रयोग होगा। Present Perfect के साथ yesterday नहीं आता।");
Q("eng2d","eng2","Water ___ at 100°C.","पानी 100°C पर ___ है।",
["boiled","boils","is boiling","has boiled"],["उबला","उबलता है","उबल रहा है","उबल चुका है"],1,
"A <b>universal/general truth</b> is always expressed in the <b>simple present</b>, regardless of when it is spoken.",
"<b>सनातन/सामान्य सत्य</b> हमेशा <b>Simple Present</b> में होता है।");
Q("eng2e","eng2","She ___ TV when the phone rang.","जब फ़ोन बजा, वह टीवी देख ___ थी।",
["watched","was watching","had watched","has watched"],["देख रही थी (सामान्य)","देख रही थी (चालू क्रिया)","देख चुकी थी","देख चुकी है"],1,
"The longer, ongoing background action takes the <b>Past Continuous</b>; the short interrupting action takes the simple past.",
"लंबी चालू पृष्ठभूमि क्रिया <b>Past Continuous</b> में; छोटी बाधा क्रिया Simple Past में।");
Q("eng2f","eng2","By next March, we ___ here for five years.","अगले मार्च तक हम पाँच वर्ष से यहाँ ___ होंगे।",
["will live","will be living","will have been living","are living"],["रहेंगे","रह रहे होंगे","रहते आ रहे होंगे","रह रहे हैं"],2,
"'<b>By + future time</b>' + duration (<i>for five years</i>) demands the <b>Future Perfect Continuous</b>: will have been + V-ing.",
"'<b>By + भविष्य समय</b>' + अवधि के साथ <b>Future Perfect Continuous</b> आता है: will have been + V-ing।");
Q("eng2g","eng2","Find the error: <i>He has gone to Delhi / last week / to attend a seminar.</i>","त्रुटि पहचानें: <i>He has gone to Delhi / last week / to attend a seminar.</i>",
["He has gone to Delhi","last week","to attend a seminar","No error"],["He has gone to Delhi","last week","to attend a seminar","कोई त्रुटि नहीं"],0,
"Present perfect (<i>has gone</i>) cannot be used with the definite past time '<i>last week</i>'. Correct: <b>He went to Delhi last week…</b>",
"Present perfect के साथ '<i>last week</i>' नहीं चल सकता। सही: <b>He went to Delhi last week…</b>");

/* ---------- 3. PASSIVE VOICE ---------- */
C("eng3","eng","Passive Voice","कर्मवाच्य (पैसिव वॉइस)","🔄",
"Voice change rules:<ul><li>Object of active → Subject of passive; verb becomes <b>be + V3</b>; subject of active enters 'by + object'.</li><li>Tense of 'be': is/am/are (present), was/were (past), is being/are being (present continuous), has been/have been (present perfect), will be (future).</li><li><b>Modals:</b> <i>must obey → must be obeyed</i> (modal + be + V3).</li><li><b>Imperatives:</b> <i>Open the door → Let the door be opened</i>. Advice: <i>You are advised to…</i></li><li><b>Interrogative with Who:</b> <i>Who taught you? → By whom were you taught?</i></li><li>Pronouns change form: I→me→by me, he→him, they→them.</li><li>If the doer is unknown/unimportant (<i>someone, people</i>), the 'by-phrase' is usually dropped: <i>My purse has been stolen</i>.</li></ul>",
"वाच्य परिवर्तन:<ul><li>कर्म → कर्ता बनता है; क्रिया <b>be + V3</b> हो जाती है; कर्ता 'by' के बाद आता है।</li><li>मोडल के साथ: modal + be + V3।</li><li>आदेशवाचक: Let + कर्म + be + V3।</li><li>Who प्रश्न: By whom + सहायक क्रिया + कर्ता + V3?</li><li>अज्ञात कर्ता (someone) हो तो 'by-phrase' छोड़ दें।</li></ul>",
["Convert mechanically: Object → Subject, be + V3, by + doer.","Match the tense of 'be' with the original sentence — most errors are tense errors.","'Let' handles all imperatives; 'You are requested/advised to' handles polite orders.","In 'who' questions, 'By whom' opens the passive.","Drop by + someone/people — never write 'by someone' if avoidable."],
["क्रम से बदलें: कर्म → कर्ता, be + V3, by + कर्ता।","'be' का काल मूल वाक्य से मिलाएँ।","आदेशवाचक में 'Let' का प्रयोग करें।","Who-प्रश्न 'By whom' से शुरू होते हैं।","by someone/people टालें।"]);

Q("eng3a","eng3","Choose the correct passive: <i>She writes a letter.</i>","सही कर्मवाच्य चुनें: <i>She writes a letter.</i>",
["A letter is written by her.","A letter was written by her.","A letter is being written by her.","A letter has been written by her."],
["A letter is written by her.","A letter was written by her.","A letter is being written by her.","A letter has been written by her."],

C("eng4","eng","Narration (Direct–Indirect)","वाक्य-विन्यास (डायरेक्ट–इनडायरेक्ट)","💬",
"Rules for changing Direct speech into Indirect:<ul><li><b>Reporting verb changes:</b> say → say/tell, say to → ask, say to + order → order/tell, request → request/requested.</li><li><b>Commas and inverted commas</b> disappear; 'that' joins a statement, 'if/whether' joins a yes-no question.</li><li><b>Tense backshift:</b> present → past (am → was, writes → wrote, has → had); past → past perfect; will/shall → would/should; can → could; may → might; must → had to.</li><li><b>No backshift</b> for universal truths: <i>He said that the earth revolves round the sun</i>.</li><li><b>Pronouns</b> change by the SON rule (Subject–Object–No change): first person follows the reporter, second person follows the listener, third person unchanged.</li><li><b>Time words:</b> now → then, today → that day, tomorrow → the next day, yesterday → the previous day, ago → before, here → there, this → that.</li><li><b>Exclamations:</b> Alas! → exclaimed with sorrow; Hurrah! → exclaimed with joy; Bravo! → applauded.</li><li><b>Orders:</b> <i>Do not go</i> → forbade + object + to + V1 (negative infinitive is not repeated).</li></ul>",
"प्रत्यक्ष → अप्रत्यक्ष नियम:<ul><li>say to → ask; आदेश → order/forbid; विनय → request।</li><li>कथन को 'that', हाँ-ना प्रश्न को 'if/whether' से जोड़ें।</li><li>काल पश्चगमन: present → past; will → would; can → could।</li><li>सनातन सत्य में काल नहीं बदलता।</li><li>सर्वनाम: पहला पुरुष वक्ता के अनुसार, दूसरा श्रोता के अनुसार।</li><li>समय-शब्द: tomorrow → the next day, yesterday → the previous day।</li><li>Alas! → exclaimed with sorrow; Hurrah! → exclaimed with joy।</li></ul>",
["First fix the reporting verb — it decides the entire structure.","Backshift only one step: past perfect is never 'shifted again'.","Universal truths and habitual facts refuse backshift — examiners love this trap.","Change ALL time/place words; one forgotten 'tomorrow' spoils the answer.","In negative orders use 'forbade … to + V1', never 'not to' with forbade."],
["पहले reporting verb ठीक करें — यह पूरी संरचना तय करता है।","काल केवल एक कदम पीछे जाता है।","सनातन सत्य में काल नहीं बदलता — यह मुख्य जाल है।","सभी समय-शब्द बदलना न भूलें।","forbade के साथ 'not to' न लिखें।"]);

Q("eng4a","eng4","Indirect speech: <i>He said, \"I am happy.\"</i>","अप्रत्यक्ष कथन: <i>He said, \"I am happy.\"</i>",

["He said that he is happy.","He said that he was happy.","He said that I am happy.","He said that he had been happy."],

Q("eng4b","eng4","Indirect speech: <i>She said to me, \"Do you like coffee?\"</i>","अप्रत्यक्ष कथन: <i>She said to me, \"Do you like coffee?\"</i>",
["She asked me that did I like coffee.","She asked me if I liked coffee.","She told me do you like coffee.","She asked did I like coffee."],
["She asked me that did I like coffee.","She asked me if I liked coffee.","She told me do you like coffee.","She asked did I like coffee."],
1,"Yes-no question → <b>asked + if/whether</b> + statement order (subject before verb, no auxiliary 'did'). 'Do you like' → 'I liked'.",
"हाँ-ना प्रश्न → <b>asked + if/whether</b> + कथन क्रम। 'Do you like' → 'I liked'।");
Q("eng4c","eng4","Indirect speech: <i>The teacher said, \"The earth revolves round the sun.\"</i>","अप्रत्यक्ष कथन: <i>The teacher said, \"The earth revolves round the sun.\"</i>",
["The teacher said that the earth revolved round the sun.","The teacher said that the earth revolves round the sun.","The teacher said that the earth had revolved round the sun.","The teacher said the earth was revolving round the sun."],

1,"A <b>universal truth</b> keeps its present tense in indirect speech — no backshift. This is the classic exception.",

Q("eng4d","eng4","Indirect speech: <i>He said, \"Alas! I am ruined.\"</i>","अप्रत्यक्ष कथन: <i>He said, \"Alas! I am ruined.\"</i>",
["He said alas he is ruined.","He exclaimed with sorrow that he was ruined.","He cried that he had been ruined.","He exclaimed with joy that he was ruined."],
["He said alas he is ruined.","He exclaimed with sorrow that he was ruined.","He cried that he had been ruined.","He exclaimed with joy that he was ruined."],

Q("eng4e","eng4","Indirect speech: <i>Mother said to me, \"Do not go out in the rain.\"</i>","अप्रत्यक्ष कथन: <i>Mother said to me, \"Do not go out in the rain.\"</i>",

"निषेधात्मक आदेश → <b>forbade + कर्ता + to + V1</b> — 'not' का भाव forbade में ही है।");
Q("eng4f","eng4","Indirect speech: <i>He said, \"I shall come tomorrow.\"</i>","अप्रत्यक्ष कथन: <i>He said, \"I shall come tomorrow.\"</i>",
["He said that he will come tomorrow.","He said that he would come the next day.","He said that he would come tomorrow.","He said he shall come the next day."],

Q("eng4g","eng4","Indirect speech: <i>She said, \"Hurrah! We won the match.\"</i>","अप्रत्यक्ष कथन: <i>She said, \"Hurrah! We won the match.\"</i>",

/* ---------- 5. SUBJECT-VERB AGREEMENT ---------- */
C("eng5","eng","Subject–Verb Agreement","कर्ता–क्रिया मेल","⚖️",
"Core SVA rules tested in SSC/UPSC:<ul><li><b>Each / Every / Either / Neither / One of</b> + plural noun → <b>singular verb</b>: <i>Each of the boys <b>was</b> given a prize</i>.</li><li><b>The number of</b> → singular; <b>A number of</b> → plural: <i>The number of students <b>is</b> large; A number of students <b>are</b> absent</i>.</li><li>Uncountables — news, advice, information, furniture, scenery, machinery, hair — take <b>singular</b> verbs.</li><li>Verb agrees with the <b>real subject</b>, not the nearby noun: <i>The quality of the mangoes <b>was</b> good</i>.</li><li><b>Either…or / Neither…nor:</b> verb agrees with the <b>nearer subject</b> (proximity): <i>Either he or I <b>am</b> mistaken</i>.</li><li>Two subjects joined by 'and' → plural, except one idea (<i>Bread and butter is my breakfast</i>).</li><li>Pair nouns — scissors, trousers, spectacles — plural; but 'a pair of scissors is'.</li></ul>",
"प्रमुख नियम:<ul><li>Each/Every/Either/Neither/One of + बहुवचन संज्ञा → <b>एकवचन क्रिया</b>।</li><li>The number of → एकवचन; A number of → बहुवचन।</li><li>News, advice, information, furniture → एकवचन।</li><li>क्रिया वास्तविक कर्ता से मेल खाती है (निकटतम संज्ञा से नहीं)।</li><li>Either…or / Neither…nor में निकटतम कर्ता के अनुसार क्रिया।</li></ul>",
["Cross out prepositional phrases — match the verb with the head noun only.","Memorise the uncountable list: news, advice, information, furniture, luggage, machinery.","'One of the + plural + singular verb' appears in almost every paper.","Proximity rule saves you in either-or questions.","Pair nouns are plural unless 'a pair of' opens the sentence."],
["of-वाक्यांश हटाकर मुख्य कर्ता देखें।","अगणनीय संज्ञाओं की सूची याद रखें।","'One of the + बहुवचन + एकवचन क्रिया' लगभग हर पेपर में होता है।","Either-or में निकटतम कर्ता नियम याद रखें।","scissors जैसी संज्ञाएँ बहुवचन हैं, 'a pair of' आने पर एकवचन।"]);

Q("eng5c","eng5","One of my friends ___ gone to America.","मेरा एक मित्र अमेरिका ___ गया है।",

Q("eng5d","eng5","The quality of the mangoes ___ good.","आमों की गुणवत्ता अच्छी ___।",

C("eng6","eng","Noun & Number","संज्ञा एवं वचन","📦",
"<b>Countable</b> nouns have plurals (book→books); <b>uncountables</b> (water, sugar, honesty) have no plural and take singular verbs. Exam-critical lists:<ul><li><b>Always plural:</b> scissors, trousers, spectacles, jeans, alms, outskirts, premises, thanks, wealth? no — wealth is uncountable. Also: cattle, police, people, gentry, poultry (plural verbs, no -s).</li><li><b>Look plural but singular:</b> news, mathematics, physics, economics, politics, innings, summons.</li><li><b>Same in both numbers:</b> sheep, deer, fish, series, species, aircraft.</li><li><b>Irregular plurals:</b> child→children, man→men, tooth→teeth, mouse→mice, ox→oxen.</li><li><b>Latin/Greek:</b> criterion→criteria, phenomenon→phenomena, datum→data, crisis→crises, analysis→analyses.</li><li><b>Always uncountable:</b> furniture, luggage, baggage, machinery, scenery, poetry, jewellery, information, advice, hair, work (काम).</li></ul>",
"<b>गणनीय</b> संज्ञाओं के बहुवचन बनते हैं; <b>अगणनीय</b> (पानी, ईमानदारी) के नहीं।<ul><li>सदैव बहुवचन: scissors, trousers, spectacles, cattle, police, people।</li><li>रूप बहुवचन पर अर्थ एकवचन: news, mathematics, physics, innings।</li><li>दोनों में समान: sheep, deer, fish, series, species।</li><li>अनियमित: child→children, mouse→mice, criterion→criteria।</li><li>सदैव अगणनीय: furniture, luggage, information, advice, hair।</li></ul>",
["Treat the 'always plural' and 'always uncountable' lists as fixed capital for MCQs.","'Cattle/police/people + plural verb' — no -s, yet plural meaning.","'Innings/summons/news' look plural, take singular verbs.","Never write 'informations/advices/furnitures' — a favourite wrong-option trap.","Compound plurals: passers-by, sons-in-law, lookers-on."],
["'सदैव बहुवचन' व 'अगणनीय' सूचियाँ कंठस्थ करें।","cattle/police/people के साथ बहुवचन क्रिया।","news/innings एकवचन हैं।","informations/advices जैसे रूप कभी न लिखें।","compound बहुवचन: passers-by, sons-in-law।"]);

Q("eng6g","eng6","Choose the correct sentence:","सही वाक्य चुनें:",

/* ---------- 7. PRONOUN ---------- */
C("eng7","eng","Pronoun","सर्वनाम","👤",
"High-yield pronoun rules:<ul><li><b>Case after than/as:</b> use the subject form when a verb is implied — <i>She is taller than <b>I</b> (am)</i>.</li><li><b>It is I who</b> + am (verb agrees with the following pronoun).</li><li><b>One…one's</b> (not his/her): <i>One should do one's duty</i>. In American English his is accepted, but SSC prefers one's.</li><li><b>Each other</b> = two entities; <b>one another</b> = more than two.</li><li><b>Who</b> = subject case; <b>whom</b> = object case: <i>Who do you think did it? / Whom do you want to meet?</i></li><li><b>Order of pronouns</b> (politeness): 231 → You, he and I. In confessions/admits of guilt: I, you and he.</li><li><b>Reflexives:</b> himself, themselves — never 'hisself/theirselves'; enjoy oneself, avail oneself of, absent oneself.</li><li>'Let' takes object case: <i>Let you and <b>me</b> do it</i>. Prepositions also take object case: between you and <b>me</b>.</li></ul>",
"मुख्य नियम:<ul><li>than/as के बाद अंतर्निहित क्रिया हो तो कर्ता-रूप: taller than I (am)।</li><li>One…one's: One should do one's duty।</li><li>Each other = दो के बीच; one another = अनेक के बीच।</li><li>Who = कर्ता; whom = कर्म।</li><li>विनम्रता क्रम: You, he and I।</li><li>Let / पूर्वसर्ग के बाद कर्म-रूप: Let you and me; between you and me।</li></ul>",
["Expand the hidden verb after than/as to decide the case.","'Between you and me' — the preposition demands object case.","One…one's is a two-mark favourite; never 'one…his'.","Memorise the reflexive collocations: avail oneself of, enjoy oneself.","Reciprocal pronouns: each other (2), one another (3+)."],
["than/as के बाद छिपी क्रिया सोचकर रूप चुनें।","'Between you and me' — पूर्वसर्ग के बाद कर्म-रूप।","One…one's जोड़ी याद रखें।","Reflexive collocations कंठस्थ करें।","each other (दो), one another (अनेक)।"]);

Q("eng7a","eng7","She is taller than ___.","वह ___ से लंबी है।",

Q("eng7c","eng7","One should do ___ duty honestly.","प्रत्येक को अपना कर्तव्य ईमानदारी से ___ करना चाहिए।",

"<b>One</b> के बाद <b>one's</b> आता है: <i>One should do one's duty</i>।");
Q("eng7d","eng7","The two sisters love ___ .","दोनों बहनें ___ प्यार करती हैं।",

"<b>Each other</b> दो व्यक्तियों के लिए; <b>one another</b> दो से अधिक के लिए।");
Q("eng7e","eng7","___ do you want to meet?","आप ___ से मिलना चाहते हैं?",

"'meet' की कर्म भूमिका है — कर्म-रूप <b>Whom</b>। जाँच: उत्तर 'him' (कर्म-रूप) आता है।");

/* ---------- 8. ADJECTIVE & ADVERB ---------- */
C("eng8","eng","Adjective & Adverb","विशेषण एवं क्रिया-विशेषण","🎨",
"Degrees of comparison:<ul><li><b>Comparative + than any other</b> = superlative meaning: <i>Mumbai is bigger than any other city in India</i>. Without 'other' the class is broken — a classic trap.</li><li><b>Latin comparatives</b> take 'to', not 'than': superior, inferior, senior, junior, prior, preferable, anterior, posterior — <i>He is senior <b>to</b> me</i>.</li><li><b>Double comparatives</b> are wrong: more better, more wiser.</li><li><b>The + comparative, the + comparative:</b> <i>The higher you go, the cooler it gets</i>.</li><li>Adjective vs adverb: after sense verbs (look, seem, taste, feel) use an <b>adjective</b>: <i>She looks beautiful</i>. Action verbs take adverbs: <i>She sings beautifully</i>.</li><li><b>Hardly/scarcely</b> = almost no (negative sense) — <i>hardly ever</i>; they are not the adverbs of 'hard'.</li><li>Order of adjectives: quality → size → age → shape → colour → origin → material → purpose.</li></ul>",
"तुलना के नियम:<ul><li>Comparative + than any other = superlative अर्थ।</li><li>Latin तुलनात्मक शब्द (senior, superior, junior, preferable) के साथ 'to' आता है, 'than' नहीं।</li><li>double comparative (more better) गलत।</li><li>The + comparative…, the + comparative…</li><li>look/seem/taste के बाद विशेषण; क्रिया की विशेषता में क्रिया-विशेषण।</li><li>Hardly = लगभग नहीं (negative)।</li></ul>",
["Superlative ↔ comparative conversions appear every year — master the 'any other' trick.","'Senior to' not 'senior than' — memorise the Latin list.","Sense verbs take adjectives: tastes sweet, looks beautiful.","Hardly/scarcely carry their own negation; never add 'not' after them.","Learn the adjective order chain for rearrangement questions."],
["Superlative ↔ comparative रूपांतरण हर वर्ष पूछा जाता है।","'Senior to' — Latin सूची याद रखें।","look/taste के बाद विशेषण आता है।","Hardly के बाद 'not' न लगाएँ।","विशेषण क्रम-श्रृंखला याद करें।"]);

Q("eng8a","eng8","Mumbai is ___ city in India.","मुंबई भारत का ___ शहर है।",
["bigger than any","the biggest","biggest","more big than any"],["(comparative)","the biggest (superlative)","(गलत रूप)","(गलत रूप)"],1,
"A superlative needs 'the': <i>Mumbai is <b>the biggest</b> city in India</i>. Without 'the', a comparative with 'than any other city' would be needed.",
"Superlative के पहले 'the' आता है: <i>Mumbai is <b>the biggest</b> city in India</i>।");
Q("eng8b","eng8","He is senior ___ me by three years.","वह मुझसे तीन वर्ष ___ बड़ा है।",
["than","to","from","over"],["than","to","from","over"],1,
"Latin comparatives — senior, junior, superior, inferior, prior, preferable — are followed by <b>to</b>, never 'than'.",
"Latin तुलनात्मक शब्दों (senior, junior, superior…) के बाद <b>to</b> आता है, 'than' नहीं।");
Q("eng8c","eng8","Choose the correct sentence:","सही वाक्य चुनें:",
["This car is more faster than that.","This car is faster than that.","This car is more fast than that.","This car is most faster than that."],
["This car is more faster than that.","This car is faster than that.","This car is more fast than that.","This car is most faster than that."],
1,"<b>Double comparative</b> ('more faster') is always wrong — either 'faster' or 'more fast'? No: the comparative of fast is 'faster' alone.",
"<b>Double comparative</b> (more faster) गलत है — 'faster' अकेला ही तुलनात्मक रूप है।");
Q("eng8d","eng8","The higher you climb, ___ it gets.","जितना ऊँचा चढ़ोगे, ___ मिलेगा।",
["the cooler","cooler","more cooler","coolest"],["the cooler","cooler","more cooler","coolest"],0,
"Parallel comparative: <b>The + comparative, the + comparative</b> — <i>The higher you climb, the cooler it gets</i>.",
"समानांतर तुलना: <b>The + comparative…, the + comparative…</b>");
Q("eng8e","eng8","The soup tastes ___ .","सूप ___ है।",
["deliciously","delicious","deliciousness","more deliciously"],["(क्रिया-विशेषण)","delicious (विशेषण)","(संज्ञा)","(क्रिया-विशेषण)"],1,
"After the sense verb <b>taste</b>, an <b>adjective</b> describes the subject: <i>The soup tastes delicious</i>.",
"<b>taste</b> जैसी sense verbs के बाद <b>विशेषण</b> आता है: <i>tastes delicious</i>।");
Q("eng8f","eng8","He ___ ever misses his classes.","वह अपनी कक्षाएँ ___ नहीं छोड़ता।",
["hard","hardly","harder","hardship"],["(विशेषण: कठोर)","hardly (लगभग कभी नहीं)","(comparative)","(संज्ञा)"],1,
"<b>Hardly</b> = almost never (negative adverb). 'Hard' is the adverb of effort: <i>He works hard</i>. The two are not interchangeable.",
"<b>Hardly</b> = लगभग कभी नहीं। 'Hard' = मेहनत से। दोनों का अर्थ भिन्न है।");
Q("eng8g","eng8","Choose the correctly ordered phrase:","सही क्रम वाला वाक्यांश:",
["a leather big brown bag","a big brown leather bag","a brown leather big bag","a leather brown big bag"],
["a leather big brown bag","a big brown leather bag","a brown leather big bag","a leather brown big bag"],1,
"Adjective order: size → colour → material (origin) → noun: <b>a big brown leather bag</b>.",
"विशेषण क्रम: आकार → रंग → material → संज्ञा: <b>a big brown leather bag</b>।");

/* ---------- 9. ARTICLE ---------- */
C("eng9","eng","Articles (a, an, the)","आर्टिकल (a, an, the)","🔤",
"<b>A/An</b> — indefinite, used with singular countable nouns mentioned for the first time. Choose <b>a/an by sound</b>, not spelling: an hour, an honest man, an MBA; a university, a European, a one-rupee note.<br><b>The</b> — definite, used:<ul><li>for things already mentioned or uniquely known: <i>the sun, the moon, the sky</i></li><li>before superlatives: <i>the best, the tallest</i></li><li>before holy books, rivers, seas, mountain ranges, island groups: <i>the Ganga, the Himalayas, the Sahara</i></li><li>before names of countries with united/republic: <i>the USA, the UK, the Republic of India</i></li><li>before ordinal numbers and 'same, whole, only': <i>the first, the whole class</i></li><li>before musical instruments: <i>He plays the flute</i></li></ul><b>Zero article:</b> before proper nouns, meals (have lunch), games (play cricket), languages, abstract nouns used generally, school/college/hospital when used for their primary purpose (<i>go to school</i> = to study).",
"<b>A/An</b> — अनिश्चयवाचक; ध्वनि से चुनें: an hour, a university।<br><b>The</b> — निश्चयवाचक:<ul><li>अनूठी वस्तुएँ: the sun, the moon</li><li>superlative से पहले: the best</li><li>नदी, पर्वतमाला, पवित्र ग्रंथ: the Ganga, the Himalayas</li><li>the USA, the UK</li><li>ordinal numbers: the first</li><li>वाद्ययंत्र: He plays the flute</li></ul><b>Zero article:</b> भोजन (have lunch), खेल (play cricket), भाषाएँ, विद्यालय का मूल उद्देश्य (go to school)।",
["An before vowel SOUNDS: hour, honest, heir, MBA, X-ray exam.","The + superlative is non-negotiable.","Rivers/ranges/oceans take 'the'; single peaks (Mount Everest) and cities don't.","'Go to school/hospital' (purpose) — no article; 'go to the school' (visit) — article.","Meals, games, languages: zero article."],
["स्वर-ध्वनि से पहले an: hour, honest, MBA।","Superlative से पहले 'the' अनिवार्य।","नदी/पर्वतमाला के साथ the; एकल चोटी/शहर के बिना।","मूल उद्देश्य पर जाना: go to school (बिना the)।","भोजन/खेल/भाषा के साथ कोई article नहीं।"]);

Q("eng9a","eng9","He is ___ honest officer.","वह ___ ईमानदार अधिकारी है।",
["a","an","the","no article"],["a","an","the","कोई नहीं"],1,
"<b>An</b> is used before vowel <b>sounds</b>: 'honest' begins with the vowel sound /ɒ/ because 'h' is silent.",
"स्वर-<b>ध्वनि</b> से पहले 'an': 'honest' में h मौन है।");
Q("eng9b","eng9","She has ___ MBA from a reputed institute.","उसके पास प्रतिष्ठित संस्थान से ___ MBA है।",
["a","an","the","no article"],["a","an","the","कोई नहीं"],1,
"'MBA' is pronounced /em-bei-ei/ — begins with a vowel sound, so <b>an MBA</b>.",
"'MBA' का उच्चारण /em-/ से होता है — स्वर ध्वनि, अतः <b>an MBA</b>।");
Q("eng9c","eng9","___ Ganga is considered a holy river.","___ गंगा को पवित्र नदी माना जाता है।",
["A","An","The","No article"],["A","An","The","कोई नहीं"],2,
"Names of rivers always take <b>the</b>: the Ganga, the Yamuna, the Nile.",
"नदियों के नाम के साथ सदैव <b>the</b>: the Ganga, the Nile।");
Q("eng9d","eng9","Mount Everest is ___ highest peak in the world.","माउंट एवरेस्ट विश्व की ___ सबसे ऊँची चोटी है।",
["a","an","the","no article"],["a","an","the","कोई नहीं"],2,
"Superlatives always take <b>the</b>: <i>the highest peak</i>.",
"Superlative के साथ सदैव <b>the</b>: <i>the highest peak</i>।");
Q("eng9e","eng9","We had ___ lunch at a roadside dhaba.","हमने सड़क किनारे ढाबे पर ___ भोजन किया।",
["a","an","the","no article"],["a","an","the","कोई नहीं"],3,
"Names of <b>meals</b> take no article when used in the general sense: have breakfast/lunch/dinner.",
"भोजन के सामान्य उल्लेख में कोई article नहीं: have lunch/dinner।");
Q("eng9f","eng9","He plays ___ flute very well.","वह ___ बाँसुरी बहुत अच्छी बजाता है।",
["a","an","the","no article"],["a","an","the","कोई नहीं"],2,
"Musical instruments take <b>the</b> after 'play': play the flute, play the guitar.",
"वाद्ययंत्र 'play' के बाद <b>the</b> लेते हैं: play the flute।");
Q("eng9g","eng9","He goes to ___ school every day to study.","वह पढ़ने के लिए प्रतिदिन ___ स्कूल जाता है।",
["a","the","no article needed","an"],["a","the","कोई article नहीं","an"],2,
"When school/college/hospital is used for its <b>primary purpose</b>, no article is used: <i>go to school</i> = to study. 'Go to the school' would mean merely visiting the building.",
"मूल उद्देश्य (पढ़ना) के लिए जाना → <b>go to school</b> (बिना article)। 'the school' का अर्थ केवल भवन देखना।");

/* ---------- 10. PREPOSITION ---------- */
C("eng10","eng","Preposition","पूर्वसर्ग","🔗",
"<b>Time:</b> at (precise — at 5 pm, at dawn), on (days/dates — on Monday, on 15 Aug), in (months, years, centuries — in July, in 2026).<br><b>Place:</b> at (point), in (enclosed space/large area), on (surface).<br><b>Between</b> = two; <b>among</b> = more than two.<br><b>In vs Into:</b> in = static position; into = movement from outside to inside.<br>Fixed prepositions (exam favourites): abide <b>by</b>, accused <b>of</b>, afraid <b>of</b>, angry <b>with</b> (person) / <b>at</b> (thing), apologize <b>for</b>, approve <b>of</b>, ashamed <b>of</b>, aware <b>of</b>, beg <b>for</b>, believe <b>in</b>, boast <b>of</b>, comment <b>on</b>, complain <b>of/against</b>, congratulate <b>on</b>, consist <b>of</b>, die <b>of</b> (disease) / <b>from</b> (cause), different <b>from</b>, famous <b>for</b>, fond <b>of</b>, grateful <b>to</b>, jealous <b>of</b>, married <b>to</b>, prefer <b>to</b>, proud <b>of</b>, rejoice <b>at</b>, superior <b>to</b>, sympathise <b>with</b>, tired <b>of</b>, wait <b>for</b>.</br>",
"<b>समय:</b> at (सटीक समय), on (दिन/तारीख), in (माह/वर्ष)।<br><b>स्थान:</b> at (बिंदु), in (बंद स्थान), on (सतह)। Between = दो; among = अनेक। In = स्थिर; into = गति।</br>सुनिश्चित पूर्वसर्ग: abide by, accused of, angry with (व्यक्ति)/at (वस्तु), die of (रोग), different from, famous for, married to, prefer to, proud of, sympathise with, wait for।",
["Learn prepositions as fixed pairs with their words — never translate from Hindi.","at → time-point; on → day; in → period. Drill 10 examples each.","between/among and since/for are the two classic traps.","'Die of cancer' vs 'die from overwork' — disease vs cause.","Angry with a person, angry at a thing."],
["पूर्वसर्ग को शब्द के साथ जोड़कर याद करें।","at/on/in के समय-नियम दोहराएँ।","between-among व since-for प्रमुख जाल हैं।","die of (रोग), die from (कारण)।","व्यक्ति से angry with, वस्तु से angry at।"]);

Q("eng10a","eng10","We will meet ___ Monday morning.","हम ___ सोमवार सुबह मिलेंगे।",
["in","at","on","by"],["in","at","on","by"],2,
"Days and dates take <b>on</b>: on Monday, on 15 August 1947.",
"दिन/तारीख के साथ <b>on</b>: on Monday।");
Q("eng10b","eng10","The cat jumped ___ the well.","बिल्ली कुएँ में ___ छलाँग लगाती है।",

C("eng11","eng","One Word Substitution","अनेकार्थी — एक शब्द","🎯",

C("eng12","eng","Idioms & Phrases","मुहावरे एवं वाक्यांश","🗣️",
"Idioms appear in every SSC paper. The best technique: read the idiom literally, reject the literal meaning, choose the figurative one. Frequent ones:<ul><li><b>A blessing in disguise</b> — an apparent misfortune that turns out good.</li><li><b>Beat about the bush</b> — to talk without coming to the point.</li><li><b>Bite the dust</b> — to be defeated/fail.</li><li><b>A bolt from the blue</b> — a sudden and unexpected shock.</li><li><b>Burn the midnight oil</b> — to study/work late into the night.</li><li><b>Cry over spilt milk</b> — to repent over what cannot be undone.</li><li><b>Hit the nail on the head</b> — to say exactly the right thing.</li><li><b>Let the cat out of the bag</b> — to reveal a secret.</li><li><b>Once in a blue moon</b> — very rarely.</li><li><b>Turn a deaf ear</b> — to ignore deliberately.</li><li><b>At daggers drawn</b> — open hostility.</li><li><b>Smell a rat</b> — suspect something wrong.</li></ul>",
"हर पेपर में मुहावरे आते हैं। तकनीक: शाब्दिक अर्थ को तुरंत हटाएँ, लाक्षणिक अर्थ चुनें। प्रमुख:<ul><li>A blessing in disguise — छल से भरा वरदान।</li><li>Beat about the bush — इधर-उधर की बातें करना।</li><li>Bite the dust — पराजित होना।</li><li>A bolt from the blue — अचानक आघात।</li><li>Burn the midnight oil — देर रात तक काम करना।</li><li>Cry over spilt milk — जो बीत गई उस पर रोना।</li><li>Let the cat out of the bag — रहस्य खोल देना।</li><li>Once in a blue moon — बहुत कम।</li><li>Turn a deaf ear — अनसुना करना।</li><li>Smell a rat — शक करना।</li></ul>",
["Collect 10 idioms daily in a notebook with one example sentence each.","In the exam, eliminate literal meanings first — they are always wrong options.","Group idioms by images: animals (cat, rat, horse), body (ear, nail), nature (blue moon, dust).","Watch doubled idioms: 'turn a deaf ear TO' needs its preposition.","Practise from the book's idiom exercises chapter-wise."],
["प्रतिदिन 10 मुहावरे उदाहरण सहित लिखें।","परीक्षा में शाब्दिक अर्थ पहले हटाएँ।","मुहावरों को चित्र/श्रेणी से जोड़कर याद करें।","पुस्तक के अध्याय-क्रम अभ्यास दोहराएँ।"]);

C("eng13","eng","Synonyms, Antonyms & Spelling","पर्यायवाची, विलोम एवं वर्तनी","🔤",
"<b>Synonyms</b> (similar meaning) and <b>antonyms</b> (opposite) build your vocabulary score. High-yield pairs:<ul><li>Abundant ↔ Scarce; Bold ↔ Timid; Cautious ↔ Reckless; Deep ↔ Shallow; Expand ↔ Contract; Flexible ↔ Rigid; Generous ↔ Miserly; Guilty ↔ Innocent; Honest ↔ Deceitful; Include ↔ Exclude.</li><li>Magnificent = splendid; Transparent = clear; Fragile = delicate; Obsolete = outdated; Stern = strict; Vigilant = watchful; Adamant = stubborn; Candid = frank.</li></ul><b>Spelling strategy:</b> memorise the double-letter traps and foreign endings:<ul><li>-ary vs -ery: secretary, dictionary, stationery (pens) vs cemetery, bakery.</li><li>-ible vs -able: possible, incredible, visible vs comfortable, considerable, preferable.</li><li>Common traps: accommodate (cc, mm), necessary (cc? no — one c, two s), occurrence, embarrass, commission, committee,parallel (two l? no — one), jealous? Learn by writing 5 times each.</li><li>Words often confused: principal (head) vs principle (rule); stationary (still) vs stationery (items); affect (verb) vs effect (noun); loose vs lose; quiet vs quite.</li></ul>",
"<b>Synonyms</b> (समानार्थी) व <b>Antonyms</b> (विलोम):<ul><li>Abundant ↔ Scarce; Bold ↔ Timid; Expand ↔ Contract; Rigid ↔ Flexible; Guilty ↔ Innocent।</li><li>Magnificent = शानदार; Obsolete = पुराना; Vigilant = सतर्क; Adamant = ज़िद्दी; Candid = सीधा-सच्चा।</li></ul><b>वर्तनी:</b> secretary/stationery (ary), cemetery (ery); possible/visible (ible); comfortable (able); accommodate में cc+mm; principal (प्रधानाचार्य) vs principle (सिद्धांत); stationary (स्थिर) vs stationery (लेखन सामग्री)।",
["Learn 10 word-pairs daily — write synonym + antonym + one sentence.","For spelling, sound the word slowly and count the double letters.","Principal/principle, stationary/stationery — pair them mentally forever.","'candy has one c, ice cream has two' — a fun memory hook for 'necessary' (one c, two s).","In synonyms, check the part of speech of the options too."],
["प्रतिदिन 10 शब्द-जोड़े: synonym + antonym + वाक्य।","वर्तनी में दोहरे अक्षर गिनकर लिखें।","principal/principle व stationary/stationery की जोड़ियाँ याद रखें।","necessary में एक c, दो s — याद रखें।","synonym में options का part of speech भी जाँचें।"]);
