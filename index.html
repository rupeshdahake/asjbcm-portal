<script>
/* ===== QUANTITATIVE APTITUDE — chapter-wise ===== */
(function(){
function C(id,s,t,th,icon,nE,nH,gE,gH){CHP.push({id:id,s:s,t:t,th:th,icon:icon,notes:{en:nE,hi:nH},guide:{en:gE,hi:gH}})}
function Q(id,c,q,qh,o,oh,a,e,eh,svg){QB.push({id:id,s:(SUBJECTS.find(x=>c.startsWith(x.id))||{id:c.slice(0,3)}).id,c:c,q:q,qh:qh,o:o,oh:oh,a:a,e:e,eh:eh,svg:svg||""})}

/* ---------- 1. NUMBER SYSTEM ---------- */
C("mat1","mat","Number System","संख्या पद्धति","🔢",
"Key ideas to master:<ul><li><b>Divisibility:</b> by 2 (even), 3 (digit sum ÷3), 4 (last 2 digits ÷4), 5 (0/5), 8 (last 3), 9 (digit sum ÷9), 11 (alternate digit difference 0/11).</li><li><b>Prime test:</b> to check N is prime, divide by every prime ≤ √N.</li><li><b>Unit digit cycles:</b> 2→(2,4,8,6), 3→(3,9,7,1), 7→(7,9,3,1), 8→(8,4,2,6), 4,9→(period 2), 5,6,0→(fixed).</li><li><b>(a+b)(a−b)=a²−b²</b>; (a+b)² = a²+2ab+b²; a³+b³=(a+b)(a²−ab+b²).</li><li>Division algorithm: Dividend = Divisor × Quotient + Remainder. When the divisor is a multiple of a smaller divisor, work with remainders modulo the smaller one.</li><li>Sum of first n naturals = n(n+1)/2; of squares = n(n+1)(2n+1)/6.</li></ul>",
"मुख्य बिंदु:<ul><li>विभाज्यता नियम: 3 व 9 हेतु अंकों का योग; 11 हेतु वैकल्पिक अंकों का अंतर।</li><li>अभाज्य जाँच: √N तक के अभाज्यों से भाग दें।</li><li>इकाई अंक चक्र: 7→(7,9,3,1); 2→(2,4,8,6)।</li><li>a³+b³=(a+b)(a²−ab+b²); (a+b)(a−b)=a²−b²।</li><li>भाज्य = भाजक × भागफल + शेषफल।</li><li>प्रथम n संख्याओं का योग = n(n+1)/2।</li></ul>",
["Learn unit-digit cycles by heart — a guaranteed one-mark question.","For prime tests, only √N is needed; going further wastes time.","Digit-sum rule of 9 solves 'find the missing digit' questions instantly.","Write the division equation first in remainder problems.","Keep the identity sheet (a±b)², a³±b³ on your tips."],
["इकाई अंक चक्र कंठस्थ करें — यह निश्चित प्रश्न है।","अभाज्य जाँच में केवल √N तक भाग दें।","अंक-योग नियम से 'missing digit' प्रश्न तुरंत हल होता है।","शेषफल प्रश्नों में पहले भाग-समीकरण लिखें।","सर्वसमिका सूत्र याद रखें।"]);

Q("mat1a","mat1","The unit digit of 7¹⁰⁵ is:","7¹⁰⁵ का इकाई अंक है:",
["3","7","9","1"],["3","7","9","1"],1,
"Powers of 7 end in the cycle (7, 9, 3, 1) of period 4. 105 ÷ 4 leaves remainder 1, so the unit digit is the 1st member = <b>7</b>.",
"7 की घातों का चक्र (7,9,3,1) है। 105÷4 शेष 1, अतः इकाई अंक <b>7</b>।");
Q("mat1b","mat1","The least number by which 72 must be multiplied to make it a perfect square:","72 को किस न्यूनतम संख्या से गुणा करने पर पूर्ण वर्ग बनेगा?",
["2","3","6","8"],["2","3","6","8"],0,
"72 = 2³ × 3². For a perfect square every prime needs an even power; 2 appears 3 times, so multiply by <b>2</b> (72×2 = 144 = 12²).",
"72 = 2³×3²। पूर्ण वर्ग हेतु 2 की घात सम करनी है — 2 से गुणा करें (144 = 12²)।");
Q("mat1c","mat1","The largest 4-digit number exactly divisible by 88 is:","88 से पूर्णतः विभाज्य सबसे बड़ी चार-अंकीय संख्या:",
["9900","9944","9999","9922"],["9900","9944","9999","9922"],1,
"9999 ÷ 88 gives remainder 55. Required number = 9999 − 55 = <b>9944</b>.",
"9999 को 88 से भाग देने पर शेष 55। अभीष्ट = 9999 − 55 = <b>9944</b>।");
Q("mat1d","mat1","A number divided by 342 gives remainder 47. If the same number is divided by 19, the remainder will be:","एक संख्या को 342 से भाग देने पर शेष 47 आता है। उसी संख्या को 19 से भाग देने पर शेष:",
["5","7","9","11"],["5","7","9","11"],2,
"342 = 19 × 18, so N = 342k + 47 is divisible by 19 leaving only the remainder of 47 ÷ 19 = 2 remainder <b>9</b>.",
"342 = 19×18, अतः N = 342k + 47; केवल 47 ÷ 19 का शेष शेष रहेगा = <b>9</b>।");
Q("mat1e","mat1","How many numbers between 100 and 300 are divisible by 9?","100 और 300 के बीच 9 से विभाज्य कितनी संख्याएँ हैं?",
["21","22","23","24"],["21","22","23","24"],1,
"First = 108, last = 297. Count = (297 − 108)/9 + 1 = 21 + 1 = <b>22</b>.",
"प्रथम = 108, अंतिम = 297। संख्या = (297−108)/9 + 1 = <b>22</b>।");
Q("mat1f","mat1","What least value must be assigned to * so that 451*603 is divisible by 9?","451*603 को 9 से विभाज्य बनाने हेतु * का न्यूनतम मान:",
["3","5","8","0"],["3","5","8","0"],2,
"Digit sum = 4+5+1+*+6+0+3 = 19 + *. For divisibility by 9: 19 + * = 27 → * = <b>8</b>.",
"अंक-योग = 19 + *। 9 से विभाज्यता हेतु 19 + * = 27 → * = <b>8</b>।");
Q("mat1g","mat1","Sum of the first 20 natural numbers is:","प्रथम 20 प्राकृत संख्याओं का योग:",
["200","210","220","190"],["200","210","220","190"],1,
"Sum = n(n+1)/2 = 20 × 21/2 = <b>210</b>.",
"योग = n(n+1)/2 = 20×21/2 = <b>210</b>।");

/* ---------- 2. HCF & LCM ---------- */
C("mat2","mat","H.C.F. and L.C.M.","म.स. एवं ल.स.","⚖️",
"<ul><li><b>HCF</b> of two numbers = product of common prime factors with the <b>lowest</b> powers.</li><li><b>LCM</b> = every prime with the <b>highest</b> power present.</li><li>Golden link: <b>HCF × LCM = Product of the two numbers</b> (valid for two numbers only).</li><li>Both numbers are multiples of their HCF: if ratio is a:b and HCF is h, numbers are ha and hb; LCM = hab.</li><li>Greatest number dividing X and Y leaving remainders r₁ and r₂ = HCF of (X−r₁) and (Y−r₂).</li><li>Least number which when divided by a, b, c leaves remainder r = LCM(a,b,c) + r.</li><li>Greatest n-digit number divisible by N = largest n-digit number − remainder on division.</li></ul>",
"<ul><li>म.स. = सार्व अभाज्य गुणनखंड (न्यूनतम घात)।</li><li>ल.स. = सभी अभाज्य गुणनखंड (अधिकतम घात)।</li><li>म.स. × ल.स. = संख्याओं का गुणनफल (दो संख्याओं हेतु)।</li><li>अनुपात a:b व म.स. h हो तो संख्याएँ ha, hb; ल.स. = hab।</li><li>शेष r₁, r₂ छोड़कर भाजक = HCF(X−r₁, Y−r₂)।</li><li>भाग देने पर समान शेष r → ल.स. + r।</li></ul>",
["Verify every answer with HCF × LCM = product — it catches 90% slips.","Remainder problems: subtract remainders first, then take HCF/LCM.","Ratio + HCF questions take 5 seconds if you write ha, hb immediately.","For 'leaves remainder r in each case', the answer is LCM + r (or −r if 'same remainder each time' is specified separately).","Prime-factorise on paper; mental powers cause errors."],
["म.स.×ल.स. = गुणनफल से उत्तर जाँचें।","शेषफल प्रश्न: पहले शेष घटाएँ, फिर HCF/LCM।","अनुपात + HCF में तुरंत ha, hb लिखें।","'हर बार समान शेष' → ल.स. + r।","कागज़ पर अभाज्य गुणनखंड लिखें।"]);

Q("mat2a","mat2","The H.C.F. of 96 and 404 is:","96 और 404 का म.स.प.:",
["4","8","12","16"],["4","8","12","16"],0,
"96 = 2⁵ × 3; 404 = 2² × 101. Common factor with lowest power = 2² = <b>4</b>.",
"96 = 2⁵×3; 404 = 2²×101। सार्व गुणनखंड 2² = <b>4</b>।");
Q("mat2b","mat2","The L.C.M. of 12, 15 and 20 is:","12, 15 और 20 का ल.स.प.:",
["60","120","180","240"],["60","120","180","240"],0,
"12 = 2²×3, 15 = 3×5, 20 = 2²×5 → LCM = 2² × 3 × 5 = <b>60</b>.",
"12 = 2²×3, 15 = 3×5, 20 = 2²×5 → ल.स. = 2²×3×5 = <b>60</b>।");
Q("mat2c","mat2","Two numbers are in ratio 3:4 and their H.C.F. is 4. Their L.C.M. is:","दो संख्याएँ 3:4 के अनुपात में हैं और उनका म.स.प. 4 है। ल.स.प.:",
["24","48","96","12"],["24","48","96","12"],1,
"Numbers = 3×4 = 12 and 4×4 = 16. LCM = 3 × 4 × 4 = <b>48</b> (or: product 192 ÷ HCF 4 = 48).",
"संख्याएँ 12 व 16। ल.स. = 3×4×4 = <b>48</b>।");
Q("mat2d","mat2","The least number divisible by 12, 18, 24 and 36 is:","12, 18, 24 और 36 से विभाज्य न्यूनतम संख्या:",
["72","108","144","36"],["72","108","144","36"],0,
"LCM: 12=2²·3, 18=2·3², 24=2³·3, 36=2²·3² → take 2³ and 3² → <b>72</b>.",
"ल.स.: 2³ व 3² लें → <b>72</b>।");
Q("mat2e","mat2","The H.C.F. of two numbers is 13 and their product is 2366. Their L.C.M. is:","दो संख्याओं का म.स.प. 13 है तथा गुणनफल 2366। ल.स.प.:",
["182","236","196","202"],["182","236","196","202"],0,
"HCF × LCM = product → LCM = 2366 ÷ 13 = <b>182</b>.",
"म.स. × ल.स. = गुणनफल → ल.स. = 2366 ÷ 13 = <b>182</b>।");
Q("mat2f","mat2","The greatest number which divides 85 and 72 leaving remainders 1 and 2 respectively:","वह बड़ी संख्या जो 85 और 72 को क्रमशः 1 और 2 शेष छोड़कर विभाजित करे:",
["14","12","7","21"],["14","12","7","21"],0,
"Required = HCF(85−1, 72−2) = HCF(84, 70) = <b>14</b>.",
"अभीष्ट = HCF(84, 70) = <b>14</b>।");

/* ---------- 3. SIMPLIFICATION & ROOTS ---------- */
C("mat3","mat","Simplification & Square/Cube Roots","सरलीकरण एवं वर्ग/घनमूल","➗",
"<ul><li>Follow <b>BODMAS</b>: Brackets → Of → Division → Multiplication → Addition → Subtraction. In SSC, 'of' is resolved before ÷ and ×.</li><li><b>Algebraic shortcuts:</b> a² + 2ab + b² = (a+b)²; a² − 2ab + b² = (a−b)²; a³ + b³ over a² − ab + b² = a + b; a³ − b³ over a² + ab + b² = a − b.</li><li><b>Square roots by pairing:</b> pair digits from the right; a perfect square of 2n digits has n pairs.</li><li>√1444 = 38, √1764 = 42, √2025 = 45, √2116 = 46, √4624 = 68 — memorise common squares to 40².</li><li>Cubes to memorise: 11³=1331, 12³=1728, 13³=2197, 14³=2744, 15³=3375, 16³=4096, 20³=8000, 56³=175616.</li><li>Vinculum/near-square tricks: √101 ≈ 10 + 1/20.</li></ul>",
"<ul><li>BODMAS क्रम: कोष्ठक → 'of' → भाग → गुणा → जोड़ → घटाव।</li><li>a²+2ab+b²=(a+b)²; a³+b³ ÷ (a²−ab+b²) = a+b।</li><li>वर्गमूल: दाएँ से अंक जोड़े बनाएँ।</li><li>√1444=38, √1764=42, √2025=45 याद रखें।</li><li>घन: 12³=1728, 15³=3375, 56³=175616।</li></ul>",
["Solve 'of' before division — the single most common BODMAS trap.","Recognise (a+b)² patterns inside long decimals to finish in 5 seconds.","Memorise squares till 40 and cubes till 20 — roots become instant.","In a³+b³ ÷ (a²−ab+b²), the numerator's structure is the hint.","Double-check sign changes when removing brackets."],
["'of' को भाग से पहले हल करें — यही BODMAS जाल है।","दशमलव में (a+b)² पैटर्न पहचानें।","40 तक वर्ग व 20 तक घन याद करें।","a³+b³ की संरचना संकेत है।","कोष्ठक हटते समय चिह्न जाँचें।"]);

Q("mat3a","mat3","The value of 8 ÷ 2 of 4 + 3² is:","8 ÷ 2 of 4 + 3² का मान:",
["19","10","7","13"],["19","10","7","13"],1,
"'Of' first: 2 of 4 = 8. Then 8 ÷ 8 = 1. Then 1 + 9 = <b>10</b>.",
"पहले 'of': 2 of 4 = 8; फिर 8÷8 = 1; अंत में 1+9 = <b>10</b>।");
Q("mat3b","mat3","√1764 + √1225 = ?","√1764 + √1225 = ?",
["77","67","87","79"],["77","67","87","79"],0,
"√1764 = 42 and √1225 = 35 → 42 + 35 = <b>77</b>.",
"√1764 = 42 और √1225 = 35 → 42+35 = <b>77</b>।");
Q("mat3c","mat3","(7.5 × 7.5 + 37.5 + 2.5 × 2.5) equals:","(7.5 × 7.5 + 37.5 + 2.5 × 2.5) बराबर है:",
["100","125","110","87.5"],["100","125","110","87.5"],0,
"Note 37.5 = 2 × 7.5 × 2.5. So expression = 7.5² + 2(7.5)(2.5) + 2.5² = (7.5 + 2.5)² = <b>100</b>.",
"37.5 = 2×7.5×2.5, अतः व्यंजक = (7.5+2.5)² = <b>100</b>।");
Q("mat3d","mat3","The cube root of 175616 is:","175616 का घनमूल:",
["46","56","66","36"],["46","56","66","36"],1,
"56³ = 175616 → cube root = <b>56</b>. (Unit digit 6 in both confirms the pair 6↔6.)",
"56³ = 175616 → घनमूल = <b>56</b>।");
Q("mat3e","mat3","The value of 1 / (2 + 1 / (1 + 1/2)) is:","1 / (2 + 1 / (1 + 1/2)) का मान:",
["3/8","8/3","5/8","3/5"],["3/8","8/3","5/8","3/5"],0,
"Inner: 1 + ½ = 3/2 → 1 ÷ (3/2) = 2/3. Next: 2 + 2/3 = 8/3. Finally 1 ÷ (8/3) = <b>3/8</b>.",
"भीतर से हल करें: 1+½=3/2 → 1÷(3/2)=2/3; 2+⅔=8/3; 1÷(8/3)=<b>3/8</b>।");
Q("mat3f","mat3","(0.63³ + 0.37³) / (0.63² − 0.63×0.37 + 0.37²) = ?","(0.63³ + 0.37³) / (0.63² − 0.63×0.37 + 0.37²) = ?",
["1","1.26","0.26","2"],["1","1.26","0.26","2"],0,
"a³+b³ = (a+b)(a² − ab + b²). The denominator is exactly (a² − ab + b²), so the value = a + b = 0.63 + 0.37 = <b>1</b>.",
"a³+b³=(a+b)(a²−ab+b²)। हर वही है, अतः मान = 0.63+0.37 = <b>1</b>।");

/* ---------- 4. AVERAGE ---------- */
C("mat4","mat","Average","औसत","📊",
"<ul><li><b>Average = Sum of observations ÷ Number of observations.</b></li><li>Sum = Average × n — the master key for every question.</li><li><b>Replacement:</b> if the average rises by d after replacing one of n items, new item = old item + n·d.</li><li><b>Inclusion:</b> if the average rises by d when one item is added, new item = old average + (n+1)·d.</li><li>Averages of groups: weighted average = (n₁·a₁ + n₂·a₂) ÷ (n₁ + n₂).</li><li>Average of first n naturals = (n+1)/2; of first n even numbers = n+1; of first n odd numbers = n.</li><li>Cricket problem (famous): new average after the 17th innings — build the equation 16x + 87 = 17(x+3).</li></ul>",
"<ul><li>औसत = योग ÷ संख्या; योग = औसत × n।</li><li>प्रतिस्थापन: औसत d बढ़े तो नया मान = पुराना + n·d।</li><li>जोड़ने पर: नया मान = पुराना औसत + (n+1)·d।</li><li>भारित औसत = (n₁a₁+n₂a₂)/(n₁+n₂)।</li><li>प्रथम n सम संख्याओं का औसत = n+1; विषम का = n।</li></ul>",
["Convert every average question into a Sum equation first.","Replacement rule saves 2 minutes per question — memorise n·d.","Weighted average is needed whenever two group sizes differ.","In innings questions, define x as the OLD average before scoring.","Check options for half-values — average of consecutive naturals ends in .5."],
["हर प्रश्न को योग-समीकरण में बदलें।","प्रतिस्थापन नियम n·d कंठस्थ करें।","दो समूहों में भारित औसत लगाएँ।","क्रिकेट प्रश्नों में x = पुराना औसत लें।","विकल्पों में .5 वाले मान ध्यान से देखें।"]);

Q("mat4a","mat4","The average of first 10 natural numbers is:","प्रथम 10 प्राकृत संख्याओं का औसत:",
["5","5.5","6","4.5"],["5","5.5","6","4.5"],1,
"Average = (n+1)/2 = 11/2 = <b>5.5</b>.",
"औसत = (n+1)/2 = <b>5.5</b>।");
Q("mat4b","mat4","The average of 11 results is 50. If the average of the first six is 49 and that of the last six is 52, the sixth result is:","11 परिणामों का औसत 50 है। प्रथम छह का औसत 49 तथा अंतिम छह का 52 है। छठा परिणाम:",
["56","46","51","55"],["56","46","51","55"],0,
"6×49 + 6×52 − 11×50 = 294 + 312 − 550 = <b>56</b> (the sixth result is counted in both groups, so it emerges from the excess).",
"6×49 + 6×52 − 11×50 = <b>56</b> (छठा परिणाम दोनों समूहों में सम्मिलित है)।");
Q("mat4c","mat4","A batsman makes a score of 87 runs in the 17th innings and thus increases his average by 3. His average after the 17th innings:","एक बल्लेबाज़ 17वीं पारी में 87 रन बनाकर अपना औसत 3 बढ़ा देता है। 17वीं पारी के बाद औसत:",
["39","87","36","42"],["39","87","36","42"],0,
"Let old average = x: 16x + 87 = 17(x + 3) → 16x + 87 = 17x + 51 → x = 36. New average = 36 + 3 = <b>39</b>.",
"पुराना औसत x: 16x+87 = 17(x+3) → x = 36। नया औसत = <b>39</b>।");
Q("mat4d","mat4","The average of 2, 7, 6 and x is 5 and the average of 18, 1, 6, x and y is 10. The value of y is:","2, 7, 6 और x का औसत 5 है तथा 18, 1, 6, x, y का औसत 10 है। y का मान:",
["20","30","10","25"],["20","30","10","25"],0,
"From the first: 15 + x = 20 → x = 5. Substituting: 18+1+6+5+y = 50 → y = <b>20</b>.",
"पहले से x = 5; रखने पर 30 + y = 50 → y = <b>20</b>।");
Q("mat4e","mat4","The average weight of 8 persons increases by 2.5 kg when a new person comes in place of one weighing 65 kg. The weight of the new person is:","65 किग्रा वज़न वाले व्यक्ति के स्थान पर नया व्यक्ति आने पर 8 व्यक्तियों का औसत वज़न 2.5 किग्रा बढ़ जाता है। नए व्यक्ति का वज़न:",
["85 kg","82.5 kg","87.5 kg","80 kg"],["85 किग्रा","82.5 किग्रा","87.5 किग्रा","80 किग्रा"],0,
"New weight = 65 + 8 × 2.5 = 65 + 20 = <b>85 kg</b>.",
"नया वज़न = 65 + 8×2.5 = <b>85 किग्रा</b>।");
Q("mat4f","mat4","The average of the first 50 even natural numbers is:","प्रथम 50 सम प्राकृत संख्याओं का औसत:",
["51","50","52","25"],["51","50","52","25"],0,
"Numbers are 2, 4, …, 100. Average = n + 1 = <b>51</b> (or 2550 ÷ 50 = 51).",
"संख्याएँ 2, 4, …, 100। औसत = n+1 = <b>51</b>।");
})();
</script>

<script>
(function(){
function C(id,s,t,th,icon,nE,nH,gE,gH){CHP.push({id:id,s:s,t:t,th:th,icon:icon,notes:{en:nE,hi:nH},guide:{en:gE,hi:gH}})}
function Q(id,c,q,qh,o,oh,a,e,eh,svg){QB.push({id:id,s:(SUBJECTS.find(x=>c.startsWith(x.id))||{id:c.slice(0,3)}).id,c:c,q:q,qh:qh,o:o,oh:oh,a:a,e:e,eh:eh,svg:svg||""})}

/* ---------- 5. PERCENTAGE ---------- */
C("mat5","mat","Percentage","प्रतिशत","％",
"<ul><li>x% of N = N × x/100. Learn fraction equivalents: 12½%=⅛, 16⅔%=⅙, 20%=⅕, 25%=¼, 33⅓%=⅓, 37½%=⅜, 40%=⅖, 62½%=⅝, 75%=¾, 87½%=⅞.</li><li><b>Successive changes:</b> net factor = (1 ± a/100)(1 ± b/100). +20% then −20% = 1.2 × 0.8 = 0.96 → net −4%.</li><li><b>If A is r% more than B, B is [r/(100+r)]×100 % less than A.</b> 25% more → 20% less.</li><li>Price rise & consumption: to keep expenditure constant, cut consumption by [r/(100+r)]×100 %.</li><li>Population growth: P(1 + r/100)ⁿ.</li><li>Exam pass-fail: Pass marks from two students — build the equation 0.33T + 40 = 0.41T − 24.</li></ul>",
"<ul><li>x% of N = N × x/100; भिन्न-समतुल्य याद रखें: 25%=¼, 33⅓%=⅓, 75%=¾।</li><li>क्रमिक परिवर्तन: (1±a/100)(1±b/100); +20% फिर −20% → शुद्ध −4%।</li><li>A, B से r% अधिक हो तो B, A से r/(100+r)×100% कम।</li><li>जनसंख्या: P(1+r/100)ⁿ।</li><li>उत्तीर्णांक प्रश्न: समीकरण बनाएँ।</li></ul>",
["Fractions beat decimals: 16⅔% of 240 = 40, instantly.","Successive change questions always need factors, never simple addition.","'More than ↔ less than' conversions use 100±r denominators — practise 5 examples.","In pass/fail equations, let T = total marks and equate pass marks.","Population/depreciation is compound — use (1±r/100)ⁿ."],
["भिन्न-समतुल्य से हिसाब तुरंत होता है।","क्रमिक परिवर्तन में गुणक लगाएँ, जोड़ नहीं।","'अधिक ↔ कम' रूपांतरण का अभ्यास करें।","उत्तीर्णांक समीकरण में T = कुल अंक लें।","जनसंख्या/मूल्यह्रास चक्रवृद्धि है — (1±r/100)ⁿ।"]);

Q("mat5a","mat5","45% of 640 = ?","640 का 45% = ?",
["288","280","296","272"],["288","280","296","272"],0,
"640 × 45/100 = 640 × 0.45 = <b>288</b>.",
"640 × 45/100 = <b>288</b>।");
Q("mat5b","mat5","If 20% of a number is 90, the number is:","यदि किसी संख्या का 20% = 90 है, तो संख्या:",
["450","400","500","480"],["450","400","500","480"],0,
"0.20 × N = 90 → N = 90 × 5 = <b>450</b>.",
"0.20N = 90 → N = <b>450</b>।");
Q("mat5c","mat5","A salary is increased by 20% and then decreased by 20%. The net change is:","वेतन में पहले 20% वृद्धि फिर 20% कमी होती है। शुद्ध परिवर्तन:",
["No change","4% decrease","4% increase","2% decrease"],["कोई परिवर्तन नहीं","4% कमी","4% वृद्धि","2% कमी"],1,
"1.20 × 0.80 = 0.96 → salary becomes 96% → <b>4% decrease</b>. Equal % up and down always nets a loss.",
"1.20 × 0.80 = 0.96 → <b>4% कमी</b>। समान % वृद्धि-कमी में सदैव हानि।");
Q("mat5d","mat5","A student scores 33% and fails by 40 marks; another scores 41% and gets 24 marks more than the pass marks. Maximum marks:","एक विद्यार्थी 33% पाकर 40 अंकों से अनुत्तीर्ण; दूसरा 41% पाकर उत्तीर्णांक से 24 अधिक पाता है। अधिकतम अंक:",
["800","750","850","900"],["800","750","850","900"],0,
"0.33T + 40 = 0.41T − 24 → 0.08T = 64 → T = <b>800</b>. (Pass marks = 304.)",
"0.33T + 40 = 0.41T − 24 → T = <b>800</b>।");
Q("mat5e","mat5","A's salary is 25% more than B's. B's salary is less than A's by:","A का वेतन B से 25% अधिक है। B का वेतन A से कम है:",
["20%","25%","18%","22%"],["20%","25%","18%","22%"],0,
"B = 100, A = 125. Less % = 25/125 × 100 = <b>20%</b>.",
"B = 100, A = 125। कमी = 25/125 × 100 = <b>20%</b>।");
Q("mat5f","mat5","In an examination 35% failed in one subject, 42% failed in another and 15% failed in both. The percentage that passed in both:","परीक्षा में 35% एक विषय में, 42% दूसरे में और 15% दोनों में अनुत्तीर्ण रहे। दोनों में उत्तीर्ण प्रतिशत:",
["38%","30%","40%","42%"],["38%","30%","40%","42%"],0,
"Failed in at least one = 35 + 42 − 15 = 62. Passed in both = 100 − 62 = <b>38%</b>.",
"कम-से-कम एक में फेल = 62। दोनों में पास = <b>38%</b>।");

/* ---------- 6. PROFIT & LOSS ---------- */
C("mat6","mat","Profit and Loss","लाभ और हानि","💰",
"<ul><li><b>Profit = SP − CP; Profit % = (Profit ÷ CP) × 100.</b> Percentages are always on CP unless stated.</li><li>SP = CP × (100 ± x)/100; CP = SP × 100/(100 ± x).</li><li><b>CP of m articles = SP of n articles</b> → profit % = (m − n)/n × 100 (m > n).</li><li>Discount is on Marked Price: SP = MP × (100 − d)/100; successive discounts multiply: 20% + 10% → 0.8 × 0.9 = 0.72 → 28% single.</li><li>False weight / dishonest dealer: gain % = (error ÷ (true value − error)) × 100.</li><li>If goods pass through two sellers at same profit %, overall factor = (1 + x/100)².</li></ul>",
"<ul><li>लाभ% = (लाभ ÷ क्रयमूल्य) × 100 — हमेशा क्रयमूल्य पर।</li><li>विक्रयमूल्य = क्रय × (100±x)/100।</li><li>m वस्तुओं का CP = n का SP → लाभ% = (m−n)/n × 100।</li><li>क्रमिक बट्टा गुणक में: 20% व 10% → 28%।</li><li>असली बाट: लाभ% = त्रुटि/(सही − त्रुटि) × 100।</li></ul>",
["Anchor every question on CP; convert to 100 units if unknown.","Discount chain: multiply factors — never add percentages.","CP=m=SP=n questions are one-line formula questions.","Read 'gains the selling price of…' carefully — the base differs.","Marked price, discount, and profit can coexist — draw the CP→MP→SP chain."],
["हर प्रश्न क्रयमूल्य पर टिकाएँ; अज्ञात हो तो 100 मानें।","बट्टा श्रृंखला में गुणक लगाएँ।","CP=m=SP=n सूत्र-प्रश्न हैं।","'विक्रयमूल्य के बराबर लाभ' पढ़ते समय सावधानी।","CP→MP→SP श्रृंखला बनाकर हल करें।"]);

Q("mat6a","mat6","An article costing ₹450 is sold for ₹495. The profit per cent is:","₹450 की वस्तु ₹495 में बेची गई। लाभ प्रतिशत:",
["10%","12%","9%","11%"],["10%","12%","9%","11%"],0,
"Profit = 45 on 450 → 45/450 × 100 = <b>10%</b>.",
"लाभ 45/450 × 100 = <b>10%</b>।");
Q("mat6b","mat6","A shopkeeper sells an article at 12½% loss for ₹1050. Its cost price is:","एक दुकानदार 12½% हानि पर वस्तु ₹1050 में बेचता है। क्रयमूल्य:",
["₹1200","₹1180","₹1250","₹1125"],["₹1200","₹1180","₹1250","₹1125"],0,
"SP = CP × (100 − 12.5)/100 = CP × 0.875 → CP = 1050 ÷ 0.875 = <b>₹1200</b>.",
"CP = 1050 ÷ 0.875 = <b>₹1200</b>।");
Q("mat6c","mat6","By selling 33 metres of cloth, a trader gains the selling price of 11 metres. The gain per cent is:","33 मीटर कपड़ा बेचकर व्यापारी 11 मीटर के विक्रयमूल्य के बराबर लाभ पाता है। लाभ %:",
["50%","45%","33⅓%","60%"],["50%","45%","33⅓%","60%"],0,
"CP of 33 m = SP of 33 m − SP of 11 m = SP of 22 m. Gain% = 11/22 × 100 = <b>50%</b>.",
"33 मी. का CP = 22 मी. का SP। लाभ% = 11/22 × 100 = <b>50%</b>।");
Q("mat6d","mat6","A man buys 12 pens for ₹10 and sells 10 pens for ₹12. His gain per cent is:","एक व्यक्ति ₹10 में 12 पेन खरीदकर 10 पेन ₹12 में बेचता है। लाभ %:",
["44%","40%","22%","50%"],["44%","40%","22%","50%"],0,
"CP per pen = 10/12 = 5/6; SP per pen = 12/10 = 6/5. Gain% = (6/5 − 5/6) ÷ (5/6) × 100 = (11/30) × (6/5) × 100 = <b>44%</b>.",
"CP = 5/6, SP = 6/5 प्रति पेन। लाभ% = <b>44%</b>।");
Q("mat6e","mat6","If the cost price of 15 articles equals the selling price of 12 articles, the gain per cent is:","यदि 15 वस्तुओं का क्रयमूल्य 12 वस्तुओं के विक्रयमूल्य के बराबर है, तो लाभ %:",
["25%","20%","30%","15%"],["25%","20%","30%","15%"],0,
"Gain% = (15 − 12)/12 × 100 = <b>25%</b>.",
"लाभ% = (15−12)/12 × 100 = <b>25%</b>।");
Q("mat6f","mat6","Successive discounts of 20% and 10% are equivalent to a single discount of:","20% और 10% के क्रमिक बट्टे एक बट्टे के बराबर हैं:",
["28%","30%","25%","26%"],["28%","30%","25%","26%"],0,
"Net factor = 0.80 × 0.90 = 0.72 → single discount = 100 − 72 = <b>28%</b>.",
"गुणक = 0.80 × 0.90 = 0.72 → बट्टा = <b>28%</b>।");

/* ---------- 7. RATIO & PROPORTION ---------- */
C("mat7","mat","Ratio and Proportion","अनुपात और समानुपात","⚖️",
"<ul><li>Ratio a:b has no units; multiply/divide both terms by the same number without change (a:b = 2a:2b).</li><li><b>Divide N in ratio a:b:c</b> → shares = aN/(a+b+c), etc.</li><li>Linking ratios: a:b = 3:4 and b:c = 8:9 → equalise b (4→8): a:b:c = 6:8:9.</li><li><b>Proportion:</b> a:b :: c:d means ad = bc. Fourth proportional to a,b,c = bc/a; third proportional to a,b = b²/a; mean proportional to a,b = √(ab).</li><li>Componendo-dividendo: if a/b = c/d then (a+b)/(a−b) = (c+d)/(c−d).</li><li>Incomes/expenditures: express in ratio form with HCF factor k, then use the condition.</li></ul>",
"<ul><li>अनुपात a:b में दोनों पदों को समान संख्या से गुणा/भाग करने से अनुपात नहीं बदलता।</li><li>N को a:b:c में बाँटें → aN/(a+b+c)।</li><li>अनुपात जोड़ने हेतु साझा पद बराबर करें।</li><li>समानुपात: ad = bc; चतुर्थानुपातिक = bc/a; मध्यानुपातिक = √(ab)।</li><li>componendo-dividendo नियम।</li></ul>",
["Equalise the common term before combining two ratios — write both in k-form.","Memorise the three 'proportional' definitions; options test definitions directly.","Total-share questions: always divide by the sum of ratio parts.","ad = bc is the fastest check for proportion options.","In income questions, let the incomes be 5k and 4k, not 5 and 4."],
["दो अनुपात जोड़ने से पहले साझा पद बराबर करें।","चतुर्थ/तृतीय/मध्यानुपातिक की परिभाषाएँ याद रखें।","अंश बाँटने में हर = अनुपातों का योग।","विकल्प जाँचने के लिए ad = bc लगाएँ।","आय प्रश्नों में 5k, 4k रूप लें।"]);

Q("mat7a","mat7","₹1200 is divided among A, B and C in the ratio 2:3:5. The largest share is:","₹1200 को A, B, C में 2:3:5 अनुपात में बाँटा गया। सबसे बड़ा भाग:",
["₹600","₹400","₹200","₹500"],["₹600","₹400","₹200","₹500"],0,
"Sum of parts = 10. Largest share = 5/10 × 1200 = <b>₹600</b>.",
"योग = 10। सबसे बड़ा भाग = 5/10 × 1200 = <b>₹600</b>।");
Q("mat7b","mat7","If a:b = 3:4 and b:c = 8:9, then a:c = ?","यदि a:b = 3:4 और b:c = 8:9, तो a:c = ?",
["2:3","3:2","1:2","3:4"],["2:3","3:2","1:2","3:4"],0,
"Equalise b: a:b = 6:8, b:c = 8:9 → a:b:c = 6:8:9 → a:c = <b>2:3</b>.",
"b बराबर करें: a:b:c = 6:8:9 → a:c = <b>2:3</b>।");
Q("mat7c","mat7","In a college, the ratio of boys to girls is 8:5 and the total students are 260. The number of girls is:","किसी कॉलेज में लड़कों और लड़कियों का अनुपात 8:5 है और कुल विद्यार्थी 260 हैं। लड़कियों की संख्या:",
["100","160","120","150"],["100","160","120","150"],0,
"Girls = 5/13 × 260 = <b>100</b>.",
"लड़कियाँ = 5/13 × 260 = <b>100</b>।");
Q("mat7d","mat7","The fourth proportional to 4, 9, 12 is:","4, 9, 12 की चतुर्थानुपातिक संख्या:",
["27","24","28","32"],["27","24","28","32"],0,
"4 : 9 :: 12 : x → 4x = 108 → x = <b>27</b>.",
"4x = 9×12 = 108 → x = <b>27</b>।");
Q("mat7e","mat7","The mean proportional between 4 and 25 is:","4 और 25 की मध्यानुपातिक संख्या:",
["10","14.5","20","12"],["10","14.5","20","12"],0,
"Mean proportional = √(4 × 25) = √100 = <b>10</b>.",
"मध्यानुपातिक = √(4×25) = <b>10</b>।");
Q("mat7f","mat7","If x:y = 5:6, then (2x + y) : (3x + y) = ?","यदि x:y = 5:6, तो (2x+y):(3x+y) = ?",
["16:21","15:21","16:19","10:21"],["16:21","15:21","16:19","10:21"],0,
"Let x = 5k, y = 6k: (10k + 6k):(15k + 6k) = 16k:21k = <b>16:21</b>.",
"x = 5k, y = 6k लें: 16k:21k = <b>16:21</b>।");

/* ---------- 8. TIME & WORK ---------- */
C("mat8","mat","Time and Work","समय और कार्य","⏱️",
"<ul><li>If A finishes a job in n days, A's one-day work = 1/n. Total work is usually taken as 1 or the LCM of days.</li><li><b>Together:</b> 1/T = 1/a + 1/b. For a and b days, T = ab/(a+b).</li><li><b>Efficiency</b> ∝ 1/time. If A is twice as efficient, A's time = half.</li><li><b>MDH formula:</b> M₁D₁H₁/W₁ = M₂D₂H₂/W₂ for men-days-hours chains.</li><li>Pipes: inlet +, outlet −; net rate = 1/fill − 1/empty; time = reciprocal.</li><li>Leaving mid-way: write work done = (days worked)/total days and balance the remainder.</li><li>Wages divide in the ratio of work done (efficiency × days).</li></ul>",
"<ul><li>A, n दिनों में पूरा करे तो एक दिन का कार्य = 1/n।</li><li>साथ में: T = ab/(a+b)।</li><li>दक्षता ∝ 1/समय।</li><li>M₁D₁H₁/W₁ = M₂D₂H₂/W₂।</li><li>पाइप: भरने वाला (+), खाली करने वाला (−); शुद्ध दर का व्युत्क्रम = समय।</li><li>मज़दूरी कार्य के अनुपात में बँटती है।</li></ul>",
["Take total work as LCM of the given days — fractions disappear.","'Twice as good' means half the time; convert efficiency first.","For MDH chains, equate the product M×D×H to work units.","Pipe questions: a draining pipe is negative work — mind the sign.","Wages ∝ efficiency × days worked, not days alone."],
["कुल कार्य = दिए दिनों का ल.स. लें।","'दोगुना दक्ष' = आधा समय।","MDH में गुणनफल बराबर रखें।","निकासी पाइप ऋणात्मक कार्य है।","मज़दूरी ∝ दक्षता × दिन।"]);

Q("mat8a","mat8","A can finish a work in 10 days and B in 15 days. Working together, they will finish it in:","A किसी कार्य को 10 दिनों में और B 15 दिनों में पूरा करता है। दोनों मिलकर कितने दिनों में?",
["6 days","5 days","12.5 days","8 days"],["6 दिन","5 दिन","12.5 दिन","8 दिन"],0,
"1/10 + 1/15 = (3+2)/30 = 5/30 = 1/6 → <b>6 days</b>. Shortcut: 10×15/25 = 6.",
"1/10 + 1/15 = 1/6 → <b>6 दिन</b>। सूत्र: ab/(a+b) = 150/25।");
Q("mat8b","mat8","A and B together finish a work in 8 days; A alone takes 12 days. B alone will take:","A और B मिलकर 8 दिनों में पूरा करते हैं; A अकेले 12 दिनों में। B अकेले:",

Q("mat8c","mat8","A is twice as good a workman as B and together they finish a piece in 14 days. A alone will finish it in:","A, B से दोगुना दक्ष है और दोनों मिलकर 14 दिनों में पूरा करते हैं। A अकेले:",
["21 days","14 days","28 days","20 days"],["21 दिन","14 दिन","28 दिन","20 दिन"],0,

Q("mat8d","mat8","12 men complete a work in 16 days. 8 men will complete it in:","12 आदमी किसी कार्य को 16 दिनों में पूरा करते हैं। 8 आदमी:",
["24 days","20 days","22 days","26 days"],["24 दिन","20 दिन","22 दिन","26 दिन"],0,
"Total work = 12 × 16 = 192 man-days → 192 ÷ 8 = <b>24 days</b>.",
"कुल कार्य = 192 आदमी-दिन → 192 ÷ 8 = <b>24 दिन</b>।");
Q("mat8e","mat8","A pipe fills a tank in 6 hours and another empties it in 8 hours. If both are opened together, the tank fills in:","एक पाइप 6 घंटे में टंकी भरता है, दूसरा 8 घंटे में खाली करता है। दोनों खुलने पर टंकी भरेगी:",

Q("mat8f","mat8","A can do ⅓ of a work in 5 days and B can do ⅖ of it in 10 days. Working together they finish it in:","A किसी कार्य का ⅓ भाग 5 दिनों में और B का ⅖ भाग 10 दिनों में करता है। मिलकर:",

"A पूरा = 15 दिन; B = 25 दिन। मिलकर = 75/8 = <b>9⅜ दिन</b>।");

/* ---------- 9. TIME, SPEED & DISTANCE ---------- */
C("mat9","mat","Time, Speed & Distance (Trains & Boats)","समय, गति और दूरी (रेलगाड़ी व नाव)","🚄",
"<ul><li><b>Distance = Speed × Time.</b> Convert: x km/h = x × 5/18 m/s; y m/s = y × 18/5 km/h.</li><li><b>Crossing a pole/man:</b> distance = train's own length. <b>Crossing a platform/bridge:</b> distance = train + platform.</li><li>Relative speed: opposite directions → add; same direction → subtract. Two trains crossing each other: distance = sum of lengths.</li><li><b>Boats:</b> downstream speed = u + v; upstream = u − v (u = boat in still water, v = stream). Then u = (d + s)/2, v = (d − s)/2 where d, s are down/up speeds.</li><li>Walking at a fraction of usual speed: usual time × (1 − fraction) = extra time.</li><li>Average speed for equal distances = 2ab/(a+b) harmonic mean.</li></ul>",
"<ul><li>दूरी = गति × समय; x किमी/घंटा = x×5/18 मी/से।</li><li>खंभा पार: दूरी = गाड़ी की लंबाई; प्लेटफ़ॉर्म: दोनों का योग।</li><li>विपरीत दिशा → गतियों का योग; समान दिशा → अंतर।</li><li>नाव: धारा-सहित = u+v; धारा-विरुद्ध = u−v; u=(धारा-सहित+विरुद्ध)/2।</li><li>समान दूरी की औसत गति = 2ab/(a+b)।</li></ul>",
["Never mix units — convert km/h to m/s the moment a metre appears.","Train questions: decide the DISTANCE first (own length or + platform).","Boat questions: find u and v from the two given speeds in one step.","Fraction-of-speed lateness: usual time = delay ÷ (1 − fraction).","Average speed over equal halves is the harmonic mean, not the arithmetic mean."],
["इकाई तुरंत बदलें (किमी/घंटा → मी/से)।","रेलगाड़ी में पहले दूरी तय करें (लंबाई या + प्लेटफ़ॉर्म)।","नाव प्रश्नों में u, v एक चरण में निकालें।","देरी ÷ (1 − भिन्न) = सामान्य समय।","समान दूरी पर औसत गति = 2ab/(a+b)।"]);

Q("mat9a","mat9","A speed of 72 km/h expressed in m/s is:","72 किमी/घंटा को मी/से में व्यक्त करें:",
["20 m/s","18 m/s","24 m/s","22 m/s"],["20 मी/से","18 मी/से","24 मी/से","22 मी/से"],0,
"72 × 5/18 = <b>20 m/s</b>.",
"72 × 5/18 = <b>20 मी/से</b>।");
Q("mat9b","mat9","A train 150 m long running at 54 km/h crosses a pole in:","54 किमी/घंटा की गति से चल रही 150 मीटर लंबी गाड़ी खंभे को कितने समय में पार करेगी?",
["10 s","12 s","15 s","9 s"],["10 से","12 से","15 से","9 से"],0,
"Speed = 54 × 5/18 = 15 m/s. Time = 150 ÷ 15 = <b>10 s</b>.",
"गति = 15 मी/से। समय = 150 ÷ 15 = <b>10 से</b>।");
Q("mat9c","mat9","A train 240 m long passes a pole in 24 seconds and a platform in 50 seconds. The length of the platform is:","240 मीटर लंबी गाड़ी खंभे को 24 सेकंड और किसी प्लेटफ़ॉर्म को 50 सेकंड में पार करती है। प्लेटफ़ॉर्म की लंबाई:",
["260 m","240 m","280 m","300 m"],["260 मी","240 मी","280 मी","300 मी"],0,
"Speed = 240/24 = 10 m/s. Platform: 240 + p = 10 × 50 = 500 → p = <b>260 m</b>.",
"गति = 10 मी/से। 240 + p = 500 → p = <b>260 मी</b>।",
""+'<svg viewBox="0 0 300 110" width="300"><rect x="15" y="55" width="150" height="26" rx="6" fill="#4a6fdc"/><circle cx="45" cy="85" r="7" fill="#2b3a55"/><circle cx="135" cy="85" r="7" fill="#2b3a55"/><text x="90" y="47" text-anchor="middle" font-size="10" fill="#2b3a55">Train 240 m</text><rect x="15" y="20" width="290" height="9" fill="#c9d4e8"/><text x="160" y="15" text-anchor="middle" font-size="10" fill="#5b6b85">Platform = p m</text></svg>');
Q("mat9d","mat9","A man rows 24 km downstream in 3 hours and 12 km upstream in 3 hours. The speeds of the boat and the stream are:","एक व्यक्ति धारा के साथ 24 किमी 3 घंटे में तथा धारा के विरुद्ध 12 किमी 3 घंटे में तय करता है। नाव व धारा की गति:",
["6 & 2 km/h","8 & 4 km/h","7 & 1 km/h","5 & 3 km/h"],["6 और 2 किमी/घं","8 और 4 किमी/घं","7 और 1 किमी/घं","5 और 3 किमी/घं"],0,
"Down = 8 km/h, up = 4 km/h. Boat = (8+4)/2 = <b>6</b>, stream = (8−4)/2 = <b>2 km/h</b>.",
"धारा-सहित 8, विरुद्ध 4। नाव = 6, धारा = <b>2 किमी/घंटा</b>।");
Q("mat9e","mat9","A man's speed with the current is 15 km/h and against the current 9 km/h. His speed in still water is:","धारा के साथ गति 15 किमी/घंटा तथा धारा के विरुद्ध 9 किमी/घंटा है। स्थिर जल में गति:",
["12 km/h","10 km/h","13 km/h","11 km/h"],["12 किमी/घं","10 किमी/घं","13 किमी/घं","11 किमी/घं"],0,
"Still water = (15 + 9)/2 = <b>12 km/h</b>.",
"स्थिर जल = (15+9)/2 = <b>12 किमी/घंटा</b>।");
Q("mat9f","mat9","Walking at 5/6 of his usual speed, a man is 10 minutes late. His usual time is:","अपनी सामान्य गति की 5/6 गति से चलने पर एक व्यक्ति 10 मिनट देर से पहुँचता है। सामान्य समय:",
["60 min","50 min","66 min","55 min"],["60 मिनट","50 मिनट","66 मिनट","55 मिनट"],1,
"Slower speed → new time = 6/5 of usual time. Extra time = (6/5 − 1) × T = T/5 = 10 → T = <b>50 minutes</b>.",
"नया समय = 6/5 × सामान्य समय। अतिरिक्त समय = T/5 = 10 → T = <b>50 मिनट</b>।");

/* ---------- 10. SI & CI ---------- */
C("mat10","mat","Simple & Compound Interest","साधारण एवं चक्रवृद्धि ब्याज","🏦",
"<ul><li><b>SI = P × R × T / 100</b>; Amount = P + SI. SI is equal for every year.</li><li><b>CI = P[(1 + R/100)^T − 1]</b>; interest earns interest.</li><li>For 2 years: CI − SI = P(R/100)². For 3 years: difference = P(R/100)²(3 + R/100).</li><li>Doubling at SI: T = 100/R. Money becomes n times in T years at SI: (n−1) = R×T/100.</li><li>CI in fractional rates: 1½ years at 10% → (1.1)(1.05) path.</li><li>Amount at CI doubles in ≈ 72/R years (rule of 72) — quick estimates.</li></ul>",
"<ul><li>साधारण ब्याज = P×R×T/100।</li><li>चक्रवृद्धि = P[(1+R/100)^T − 1]।</li><li>2 वर्ष: CI − SI = P(R/100)²।</li><li>SI पर दोगुना: T = 100/R; n गुना: (n−1) = RT/100।</li></ul>",
["SI questions are linear; CI needs powers — identify the type first.","CI−SI difference formula is the most repeated exam question.","'Becomes n times at SI' → use (n−1)×100 = R×T directly.","Half-year compounding halves the rate and doubles the periods.","For 2-year CI, compute (1.1)² = 1.21 type factors mentally."],
["पहले पहचानें — SI रैखिक, CI घातांकीय।","CI−SI अंतर सूत्र सबसे अधिक पूछा जाता है।","'n गुना' प्रश्न (n−1)×100 = RT से हल।","अर्ध-वार्षिक में दर आधी, अवधि दोगुनी।","2-वर्ष CI हेतु (1.1)² जैसे गुणक मानसिक रूप से निकालें।"]);

Q("mat10a","mat10","Simple interest on ₹5000 at 8% per annum for 3 years is:","₹5000 पर 8% वार्षिक दर से 3 वर्ष का साधारण ब्याज:",
["₹1200","₹1000","₹1250","₹1150"],["₹1200","₹1000","₹1250","₹1150"],0,
"SI = 5000 × 8 × 3/100 = <b>₹1200</b>.",
"SI = 5000×8×3/100 = <b>₹1200</b>।");
Q("mat10b","mat10","A sum of money doubles itself in 8 years at simple interest. The rate per cent is:","साधारण ब्याज पर धन 8 वर्षों में दोगुना हो जाता है। दर:",
["12.5%","10%","15%","8%"],["12.5%","10%","15%","8%"],0,
"SI in 8 years = P (to double). P = P×R×8/100 → R = 100/8 = <b>12.5%</b>.",
"दोगुना होने पर SI = P → R = 100/8 = <b>12.5%</b>।");
Q("mat10c","mat10","The compound interest on ₹10000 at 10% per annum for 2 years is:","₹10000 पर 10% वार्षिक दर से 2 वर्ष का चक्रवृद्धि ब्याज:",
["₹2100","₹2000","₹2200","₹2050"],["₹2100","₹2000","₹2200","₹2050"],0,
"Amount = 10000 × (1.1)² = ₹12100 → CI = 12100 − 10000 = <b>₹2100</b>.",
"मिश्रधन = 10000×1.21 = ₹12100 → CI = <b>₹2100</b>।");
Q("mat10d","mat10","The difference between CI and SI on ₹8000 at 5% for 2 years is:","₹8000 पर 5% दर से 2 वर्ष के CI और SI का अंतर:",
["₹20","₹25","₹30","₹15"],["₹20","₹25","₹30","₹15"],0,
"Difference = P(R/100)² = 8000 × (0.05)² = 8000 × 0.0025 = <b>₹20</b>.",
"अंतर = P(R/100)² = <b>₹20</b>।");
Q("mat10e","mat10","A sum becomes 6 times itself in 15 years at simple interest. The rate of interest is:","साधारण ब्याज पर धन 15 वर्षों में 6 गुना हो जाता है। ब्याज दर:",
["33⅓%","30%","35%","40%"],["33⅓%","30%","35%","40%"],0,
"SI = 5P in 15 years → 5P = P×R×15/100 → R = 500/15 = <b>33⅓%</b>.",
"SI = 5P → R = 500/15 = <b>33⅓%</b>।");
Q("mat10f","mat10","A sum amounts to ₹2420 in 2 years at 10% compound interest. The sum is:","10% चक्रवृद्धि ब्याज पर धन 2 वर्षों में ₹2420 हो जाता है। मूलधन:",
["₹2000","₹2200","₹2400","₹2100"],["₹2000","₹2200","₹2400","₹2100"],0,
"P × 1.21 = 2420 → P = <b>₹2000</b>.",
"P × 1.21 = 2420 → P = <b>₹2000</b>।");

/* ---------- 11. MENSURATION ---------- */
C("mat11","mat","Area, Volume & Surface Areas","क्षेत्रफल, आयतन व पृष्ठ","📐",
"<ul><li>Rectangle area = l×b; perimeter = 2(l+b). Square: a², 4a, diagonal = a√2.</li><li>Triangle area = ½ × base × height; equilateral = (√3/4)a²; Heron: √[s(s−a)(s−b)(s−c)].</li><li>Circle: area = πr², circumference = 2πr. Semicircle/annulus follow by subtraction.</li><li>Right triangle: hypotenuse² = leg² + leg² (Pythagoras 9-12-15, 3-4-5, 5-12-13, 7-24-25 families).</li><li>Cylinder: CSA = 2πrh, TSA = 2πr(h+r), V = πr²h. Cone: V = ⅓πr²h, CSA = πrl. Sphere: V = 4/3 πr³, area = 4πr².</li><li>Cuboid: V = lbh; cube: V = a³. Melting problems conserve volume.</li></ul>",
"<ul><li>आयत: क्षेत्रफल l×b, परिमाप 2(l+b); वर्ग विकर्ण = a√2।</li><li>त्रिभुज: ½×आधार×ऊँचाई; समबाहु = (√3/4)a²।</li><li>वृत्त: πr², 2πr।</li><li>पाइथागोरस परिवार: 3-4-5, 5-12-13, 9-12-15, 7-24-25।</li><li>बेलन: V=πr²h; शंकु: ⅓πr²h; गोला: 4/3 πr³।</li><li>पिघलाने के प्रश्नों में आयतन सुरक्षित रहता है।</li></ul>",
["Memorise the Pythagoras triple families — figure questions solve in seconds.","Perimeter ≠ area: read what the question asks before choosing the formula.","In melting/recasting, equate total volumes first.","π = 22/7 pairs with r = 7, 14, 21; π = 3.14 with decimal radii.","Write dimensions with units; mixing cm and m is a classic trap."],
["पाइथागोरस त्रिक याद रखें — चित्र-प्रश्न तुरंत हल।","परिमाप व क्षेत्रफल में भ्रम न करें।","पिघलाने के प्रश्न: आयतन बराबर रखें।","π = 22/7 के साथ r = 7, 14 वाले प्रश्न आते हैं।","इकाइयाँ (cm/m) ध्यान से लिखें।"]);

Q("mat11a","mat11","The perimeter of a rectangle is 84 m and its length is twice its breadth. Its area is:","एक आयत का परिमाप 84 मीटर है तथा लंबाई चौड़ाई की दोगुनी है। क्षेत्रफल:",
["392 m²","336 m²","448 m²","420 m²"],["392 वर्ग मी","336 वर्ग मी","448 वर्ग मी","420 वर्ग मी"],0,
"2(l + b) = 84, l = 2b → 6b = 84 → b = 14, l = 28. Area = 28 × 14 = <b>392 m²</b>.",
"6b = 84 → b = 14, l = 28। क्षेत्रफल = <b>392 वर्ग मी</b>।");
Q("mat11b","mat11","In the right triangle shown, the hypotenuse is:","दिखाए गए समकोण त्रिभुज में कर्ण है:",

C("mat12","mat","Permutation, Combination & Probability","क्रमचय, संचय एवं प्रायिकता","🎲",
"<ul><li><b>Permutation (order matters):</b> ⁿPᵣ = n!/(n−r)!. <b>Combination (order irrelevant):</b> ⁿCᵣ = n!/[r!(n−r)!].</li><li>Arrangements of n letters with repeats: n!/(p!q!…) — APPLE = 5!/2! = 60.</li><li>Circular arrangements of n objects: (n−1)!.</li><li>Words with vowels together: bundle the vowels as one unit, then arrange.</li><li><b>Probability = favourable ÷ total</b>; always between 0 and 1. P(not A) = 1 − P(A).</li><li>Two dice: 36 outcomes — memorise sums: 7 has 6 ways, 6/8 have 5, 5/9 have 4, 9-sum? 4 ways; 10/11 have 3/2, doubles 6.</li><li>Cards: 52, 4 suits, 13 each; face cards 12; aces 4.</li></ul>",
"<ul><li>ⁿPᵣ = n!/(n−r)! (क्रम महत्वपूर्ण); ⁿCᵣ = n!/[r!(n−r)!] (क्रम अप्रासंगिक)।</li><li>पुनरावृत्ति अक्षर: n!/(p!q!…) — APPLE = 60।</li><li>वृत्ताकार क्रम: (n−1)!।</li><li>प्रायिकता = अनुकूल/कुल; P(घटना नहीं) = 1 − P।</li><li>दो पासे: 36 परिणाम; योग 7 के 6 तरीके।</li></ul>",
["Ask: does order matter? P = yes, C = no — half the mistakes end here.","APPLE-type questions: divide by the factorial of each repeat count.","Draw the 6×6 dice table once; sums become permanent memory.","In committee questions, multiply the C values of men and women choices.","Probability of 'at least one' = 1 − P(none)."],
["पहले तय करें — क्रम मायने रखता है? P या C।","APPLE प्रकार में पुनरावृत्त अक्षरों के factorial से भाग दें।","पासों की 6×6 तालिका एक बार बनाएँ।","समिति प्रश्न: पुरुष व महिला संचयों का गुणन।","'कम-से-कम एक' = 1 − P(कोई नहीं)।"]);

C("mat13","mat","Data Interpretation (Bar Graph & Pie Chart)","डेटा व्याख्या (बार ग्राफ़ व पाई चार्ट)","📈",
"DI tests reading charts fast:<ul><li><b>Bar graph:</b> read heights against the axis; differences, ratios, averages and percentages follow from the values.</li><li><b>Pie chart:</b> the whole circle = 100% = 360°. Value share = (angle/360) × total. Central angle for a share = (value/total) × 360°.</li><li>Percentage of one category over another = (v₁/v₂) × 100.</li><li>Ratio questions reduce both values by their HCF.</li><li>Always compute the TOTAL first for pie charts — most questions need it.</li><li>Check the unit in the axis labels (₹ crore, thousands) before answering.</li></ul>",
"<ul><li>बार ग्राफ़: ऊँचाई से मान पढ़ें; फिर अंतर, अनुपात, औसत निकालें।</li><li>पाई चार्ट: पूरा वृत्त = 100% = 360°। मान = (कोण/360) × कुल।</li><li>कोण = (मान/कुल) × 360°।</li><li>पहले कुल योग निकालें — अधिकांश प्रश्नों में आवश्यक।</li><li>इकाई (₹ करोड़ आदि) अवश्य देखें।</li></ul>",
["Write down all five values in a rough column before attempting questions.","For pie charts, convert angles to values immediately using the given total.","Ratio questions: cancel by HCF — 180:60 is 3:1, don't compute blindly.","Averages need the count — count the bars!","Re-check whether the chart shows 'number' or 'percentage' of students."],
["प्रश्न हल करने से पहले सभी मान कॉपी पर लिखें।","पाई चार्ट में कोण को मान में तुरंत बदलें।","अनुपात HCF से सरल करें।","औसत हेतु सरली (bars) गिनें।","चार्ट 'संख्या' दिखाता है या 'प्रतिशत' — जाँचें।"]);

C("gk4","gk","Sports & Terminology","खेल एवं शब्दावली","🏏",

C("gk6","gk","Rivers of India","भारत की नदियाँ","🏞️",
"Key river facts:<ul><li><b>Ganga</b> — longest (2,525 km); rises from Gangotri glacier (Bhagirathi); Alaknanda joins at Devprayag; empties into Bay of Bengal. Largest basin.</li><li><b>Godavari</b> — longest Peninsular river; called 'Dakshin Ganga'; rises in Trimbakeshwar (Nashik).</li><li><b>Brahmaputra</b> — rises in Tibet as Tsangpo, enters India as Dihang, called Jamuna in Bangladesh.</li><li><b>Narmada & Tapi</b> — west-flowing through rift valleys; make estuaries, not deltas. Narmada flows through Marble Rocks (Bhedaghat).</li><li><b>Krishna</b> — rises at Mahabaleshwar; <b>Kaveri</b> — Talakaveri (Karnataka), 'Ganga of the South' in Tamil culture.</li><li><b>Sorrow rivers:</b> Damodar — 'Sorrow of Bengal'; Kosi — 'Sorrow of Bihar'.</li><li><b>Triveni Sangam</b> — Ganga, Yamuna and mythical Saraswati at Prayagraj.</li><li>Wular lake lies on the Jhelum; Dal lake at Srinagar; Chilika (Odisha) is the largest brackish-water lagoon.</li></ul>",
"मुख्य तथ्य: गंगा — सबसे लंबी (2,525 किमी), गंगोत्री से; गोदावरी — प्रायद्वीप की सबसे लंबी, 'दक्षिण गंगा'; ब्रह्मपुत्र — तिब्बत में सांगपो; नर्मदा व तापी — पश्चिम की ओर बहती हैं, खाड़ी/एस्चुअरी बनाती हैं; कृष्णा — महाबलेश्वर से; कावेरी — तालकावेरी; दामोदर — 'बंगाल का शोक'; कोसी — 'बिहार का शोक'; त्रिवेणी संगम — प्रयागराज; वुलर झील झेलम पर; चिल्का — सबसे बड़ा खारे पानी की लैगून।",
["Group rivers by direction of flow — east-flowing make deltas, west-flowing (Narmada, Tapi) make estuaries.","'Sorrow' nicknames are repeated every year — Damodar, Kosi.","Origin glacier → river → city on bank: chain all three facts together.","Godavari vs Kaveri: Godavari is longer; Kaveri is the Tamil delta queen.","Lagoon questions: Chilika largest brackish, Vembanad longest, Pulicat second."],
["बहाव की दिशा से नदियाँ जोड़ें — पूर्व की ओर डेल्टा, पश्चिम एस्चुअरी।","दामोदर व कोसी के उपनाम हर वर्ष पूछे जाते हैं।","उद्गम → नदी → तट-शहर श्रृंखला याद करें।","गोदावरी लंबी; कावेरी तमिल डेल्टा की प्रमुख।","चिल्का सबसे बड़ा खारा लैगून है।"]);

C("gk9","gk","Museums, Sea Ports & Airports","संग्रहालय, बंदरगाह एवं हवाई अड्डे","🏛️",

C("sci1","sci","Physics: Motion, Force & Energy","भौतिकी: गति, बल और ऊर्जा","🚀",
"<b>Motion:</b> speed = distance/time (m/s); velocity is speed with direction; acceleration = change in velocity/time (m/s²). A speed–time graph's slope gives acceleration and its area gives distance.<br><b>Newton's laws:</b><ul><li>First (inertia): a body stays at rest or uniform motion unless a net external force acts.</li><li>Second: F = ma; unit newton (N) = kg·m/s².</li><li>Third: every action has an equal and opposite reaction (rockets, recoil of a gun).</li></ul><b>Work, energy, power:</b><ul><li>Work = Force × displacement in the direction of force (joule). If force ⊥ displacement, W = 0.</li><li>Kinetic energy = ½mv²; Potential energy = mgh. Energy is conserved — it changes form only.</li><li>Power = work/time (watt).</li><li>Weight = mg; on the Moon g = g/6, so a 60 N object weighs only 10 N there, though mass stays 6 kg.</li></ul>",
"<b>गति:</b> चाल = दूरी/समय; त्वरण = वेग-परिवर्तन/समय; चाल-समय ग्राफ़ की ढाल = त्वरण।<br><b>न्यूटन के नियम:</b> प्रथम — जड़त्व; द्वितीय — F = ma (इकाई न्यूटन); तृतीय — क्रिया-प्रतिक्रिया (रॉकेट)।<br><b>कार्य-ऊर्जा:</b> कार्य = बल × विस्थापन (जूल); बल ⊥ विस्थापन हो तो कार्य शून्य; गतिज ऊर्जा = ½mv²; स्थितिज ऊर्जा = mgh; शक्ति = कार्य/समय (वॉट); चंद्रमा पर g = g/6।",

C("sci2","sci","Physics: Light, Sound & Electricity","भौतिकी: प्रकाश, ध्वनि और विद्युत","💡",
"<b>Light:</b><ul><li>Plane mirror — virtual, laterally inverted image of same size.</li><li>Convex mirror (rear-view) — always virtual, diminished, wider field.</li><li>Concave mirror — converging (torches, headlights).</li><li>In a convex lens a ray parallel to the axis refracts through the principal focus; the eye's lens is convex.</li><li>Speed of light in vacuum c = 3 × 10⁸ m/s.</li></ul><b>Sound:</b> longitudinal mechanical wave; needs a medium — cannot travel in vacuum. Loudness ∝ amplitude²; pitch ∝ frequency. Speed in air ≈ 340 m/s.<br><b>Electricity:</b><ul><li>Current I (ampere), voltage V (volt), resistance R (ohm).</li><li>Ohm's law: V = IR.</li><li>Series: R = R₁+R₂; Parallel: 1/R = 1/R₁ + 1/R₂.</li><li>Power P = VI; electric energy in kWh (1 unit = 1 kWh).</li><li>Safety: fuse melts on excess current; earthing protects from shocks.</li></ul>",
"<b>प्रकाश:</b> समतल दर्पण — आभासी, पार्श्व उलटा; उत्तल दर्पण — वाहनों का पश्च-दृश्य दर्पण; अवतल — अभिसारी (टॉर्च); उत्तल लेंस में अक्ष के समांतर किरण फ़ोकस से गुजरती है; c = 3×10⁸ मी/से।<br><b>ध्वनि:</b> अनुदैर्घ्य तरंग; निर्वात में नहीं चलती; प्रबलता ∝ आयाम²; तारत्व ∝ आवृत्ति; वायु में गति ≈ 340 मी/से।<br><b>विद्युत:</b> ओम का नियम V = IR; श्रेणी R = R₁+R₂; समांतर 1/R = 1/R₁+1/R₂; P = VI; 1 यूनिट = 1 kWh।",
["Rear-view mirror = convex; torch reflector = concave — a permanent pairing.","Ohm's law triangle V/IR solves numeric questions in 5 seconds.","Sound needs matter: vacuum kills sound but not light.","Loudness–amplitude, pitch–frequency: don't cross the pairs.","Series adds R; parallel adds 1/R — total parallel R is always smaller."],
["पश्च-दृश्य दर्पण उत्तल; टॉर्च अवतल — जोड़ी याद रखें।","V = IR त्रिभुज से गणित तुरंत हल।","ध्वनि को माध्यम चाहिए; प्रकाश को नहीं।","प्रबलता–आयाम, तारत्व–आवृत्ति जोड़ी न बदलें।","समांतर में कुल प्रतिरोध सदैव छोटा होता है।"]);

/* ---------- 3. CHEMISTRY: MATTER, ATOMS & REACTIONS ---------- */
C("sci3","sci","Chemistry: Matter, Atoms & Reactions","रसायन: पदार्थ, परमाणु एवं अभिक्रियाएँ","⚗️",
"<b>Matter</b> exists in solid, liquid, gas (and plasma) states; changing temperature/pressure interconverts them (melting, boiling, condensation, sublimation — camphor, naphthalene balls sublime).<br><b>Atoms & molecules:</b><ul><li>Atom = smallest particle of an element; molecule = group of bonded atoms.</li><li>Atomic number Z = protons; mass number A = protons + neutrons.</li><li>Valency: H=1, O=2, N=3, C=4, Na=1, Ca=2, Al=3.</li><li>Symbols: Au gold, Ag silver, Fe iron, Cu copper, Pb lead, Na sodium, K potassium.</li></ul><b>Chemical vs physical change:</b> rusting, burning, curdling = chemical (new substance); melting ice, dissolving salt = physical.<br><b>Laws:</b> conservation of mass (Lavoisier), constant proportions (Proust).<br><b>Common formulas:</b> H₂O water, CO₂ carbon dioxide, NaCl salt, CH₄ methane, O₃ ozone, NH₃ ammonia.",
"<b>पदार्थ</b> — ठोस, द्रव, गैस; कपूर/नैफ़थलीन का ऊर्ध्वपातन।<br><b>परमाणु:</b> परमाणु क्रमांक Z = प्रोटॉन; द्रव्यमान क्रमांक A = प्रोटॉन + न्यूट्रॉन; संयोजकता: H=1, O=2, N=3, C=4।<br><b>प्रतीक:</b> Au सोना, Ag चाँदी, Fe लोहा, Cu तांबा, Na सोडियम।<br><b>रासायनिक बनाम भौतिक परिवर्तन:</b> जंग लगना/दहन = रासायनिक; बर्फ़ पिघलना = भौतिक।<br><b>नियम:</b> द्रव्यमान संरक्षण — लैवोज़िए। सूत्र: H₂O, CO₂, NaCl, CH₄, O₃।",
["Memorise Latin symbols: Na, K, Fe, Cu, Pb, Au, Ag — direct one-mark questions.","Chemical change = new substance forms; physical change = state/shape only.","Z = protons; A = p + n; electrons = Z in a neutral atom.","Sublimation list: camphor, naphthalene, iodine, dry ice.","Conservation of mass by Lavoisier; constant proportions by Proust."],
["लैटिन प्रतीक याद करें: Na, K, Fe, Au, Ag।","रासायनिक परिवर्तन = नया पदार्थ; भौतिक = केवल अवस्था।","Z = प्रोटॉन; A = प्रोटॉन + न्यूट्रॉन।","ऊर्ध्वपातन: कपूर, नैफ़थलीन, आयोडीन।","द्रव्यमान संरक्षण — लैवोज़िए।"]);

/* ---------- 4. CHEMISTRY: ACIDS, BASES, METALS & ALLOYS ---------- */
C("sci4","sci","Chemistry: Acids, Bases, Metals & Alloys","रसायन: अम्ल, क्षार, धातु एवं मिश्रधातु","🧪",
"<b>Acids & bases:</b><ul><li>Acids give H⁺ (HCl, H₂SO₄, HNO₃); bases give OH⁻ (NaOH, KOH); acid + base → salt + water (neutralisation).</li><li>pH scale 0–14: pH 7 neutral, <7 acidic, >7 basic. pH of pure water = 7.</li><li>Indicators: litmus — red in acid, blue in base; phenolphthalein — colourless in acid, pink in base; methyl orange — red in acid, yellow in base.</li></ul><b>Metals:</b><ul><li>Mercury is the only liquid metal; bromine the only liquid non-metal.</li><li>Most abundant metal in the crust: aluminium; most abundant element: oxygen.</li><li>Reactivity series: K > Na > Ca > Mg > Al > Zn > Fe > Pb > H > Cu > Hg > Ag > Au.</li><li>Rust = hydrated iron(III) oxide; prevention by galvanisation (zinc coat).</li><li>Alloys: brass = Cu + Zn; bronze = Cu + Sn; stainless steel = Fe + Cr + Ni; solder = Pb + Sn.</li></ul>",
"<b>अम्ल-क्षार:</b> अम्ल H⁺ देते हैं; क्षार OH⁻; pH 0–14 — 7 उदासीन, 7 से कम अम्लीय, अधिक क्षारीय; शुद्ध जल pH 7। लिटमस अम्ल में लाल, क्षार में नीला; फ़ीनॉल्फ़्थैलीन क्षार में गुलाबी।<br><b>धातुएँ:</b> पारा एकमात्र द्रव धातु; क्रस्ट में सर्वाधिक धातु एल्युमिनियम; जंग = हाइड्रेटेड आयरन ऑक्साइड; गैल्वनीकरण = ज़िंक की परत।<br><b>मिश्रधातु:</b> पीतल = Cu+Zn; काँसा = Cu+Sn; स्टेनलेस स्टील = Fe+Cr+Ni।",
["pH questions: acid < 7 < base; blood 7.4, lemon ~2, soap ~10 — keep three anchors.","Litmus red in ACID; phenolphthalein pink in BASE — the two are often swapped in options.","Mercury (metal) and bromine (non-metal) are the only two liquids at room temperature.","Brass–zinc, bronze–tin: lock the pairs.","Reactivity: potassium most reactive, gold least — 'K Na Ca Mg Al Zn Fe Pb H Cu Hg Ag Au'."],
["pH: अम्ल < 7 < क्षार; रक्त 7.4, नींबू ~2।","लिटमस अम्ल में लाल; फ़ीनॉल्फ़्थैलीन क्षार में गुलाबी।","पारा (धातु) व ब्रोमीन (अधातु) द्रव हैं।","पीतल–ज़िंक, काँसा–टिन जोड़ी।","क्रियाशीलता श्रेणी कंठस्थ करें।"]);

C("rea3","rea","Coding–Decoding","कोडिंग–डिकोडिंग","🔐",
"Types and the universal method:<ul><li><b>Shift coding:</b> each letter moves +n or −n (CAT → DBU is +1). Find the shift from ONE pair, apply to the asked word.</li><li><b>Reverse coding:</b> the word is written backwards (DELHI → IHLED).</li><li><b>Positional coding:</b> A=1…Z=26 or reverse (Z=1); add letter values.</li><li><b>Number coding:</b> letters get digits (PALE = 2134) — build the letter→digit table, read the new word letter by letter.</li><li><b>Substitution:</b> 'sky is called earth' type — always answer with the SUBSTITUTE word, not the real one.</li><li><b>Mixed-letter coding:</b> compare two coded sentences to decode individual words (like 'na pa' logic).</li></ul>",
"प्रकार व विधि:<ul><li>स्थानांतरण: प्रत्येक अक्षर +n/−n (CAT→DBU = +1)।</li><li>उलटना: शब्द पीछे से (DELHI→IHLED)।</li><li>स्थानीय कोड: A=1…Z=26 या उल्टा; अक्षर-मान जोड़ें।</li><li>अंक-कोड: PALE=2134 — अक्षर→अंक तालिका बनाएँ।</li><li>प्रतिस्थापन: 'आकाश को पृथ्वी कहा जाए' — उत्तर में प्रतिस्थापित शब्द लिखें।</li><li>मिश्रित: दो कूट-वाक्यों की तुलना से शब्द-कोड।</li></ul>",
["Decode ONE letter-pair, verify with the rest of the example, then apply.","Write the alphabet strip A–Z with numbers above it once; reuse mentally.","For digit-codes, list every distinct letter with its digit first.","Substitution questions: the answer uses the GIVEN code language.","Check direction: is the example given forward or reverse?"],
["एक अक्षर-जोड़ी डिकोड कर उदाहरण से सत्यापित करें।","A–Z पट्टी बनाकर अंक लिखें।","अंक-कोड में पहले प्रत्येक अक्षर का अंक सूचीबद्ध करें।","प्रतिस्थापन प्रश्नों में दी गई भाषा के अनुसार उत्तर दें।","दिशा जाँचें: उदाहरण आगे या पीछे की ओर?"]);

C("rea4","rea","Blood Relations","रक्त संबंध","👨‍👩‍👧",
"Method:<ul><li>Draw a <b>family tree</b> — males (□), females (○), horizontal line = same generation, vertical = parent-child, double line = marriage.</li><li>Decode from the END of the statement backwards: 'son of my father's sister' → cousin.</li><li>Generations: grandfather–father–you = 3 levels; count levels before answering.</li><li>'Only son / only daughter' collapses siblings — grandfather's only son = father.</li><li>Symbolic relations: A + B = A is father of B; A − B = A is wife of B; read expressions right to left in pairs.</li><li>Gender-unbiased names (Sam, Kavi) — never assume gender without a clue.</li></ul>",
"विधि:<ul><li><b>वंश-वृक्ष</b> बनाएँ — पुरुष (□), महिला (○), क्षैतिज रेखा = समान पीढ़ी, ऊर्ध्वाधर = जनक-संतान।</li><li>कथन का अंतिम भाग पहले हल करें: 'मेरे पिता की बहन का पुत्र' → चचेरा भाई।</li><li>पीढ़ियाँ गिनें — दादा–पिता–आप = 3 स्तर।</li><li>'इकलौता पुत्र' → वही पिता है।</li><li>प्रतीकात्मक: A + B = A, B का पिता; दाएँ से बाएँ जोड़े में पढ़ें।</li><li>लिंग-तटस्थ नामों पर अनुमान न लगाएँ।</li></ul>",
["Always draw the tree — mental trees fail under time pressure.","Work backwards from the last phrase of the sentence.","'Only son of my grandfather' = my father — shortcut saves 2 steps.","In symbol questions, pair from the RIGHT and attach meanings.","Never assume gender from a name; use stated relations only."],

C("rea5","rea","Direction Sense","दिशा ज्ञान","🧭",

["One anchor, then relatives — never place two people at once.","In circles, draw an arrow at each head to track facing.","Stacking: convert every sentence into an inequality sign.","After solving, verify ALL conditions once more.","Comparison chains: write tallest → shortest in one line."],

/* ---------- 7. VENN DIAGRAMS & SYLLOGISM ---------- */
C("rea7","rea","Venn Diagrams & Syllogism","वेन आरेख एवं न्याय-वाक्य","⭕",
"<b>Syllogism method</b> (draw, don't argue):<ul><li>'All A are B' → circle A fully inside B.</li><li>'Some A are B' → overlapping circles; the overlap may or may not exist in every case.</li><li>'No A is B' → two separate circles.</li><li>'Some A are not B' → overlap plus a part of A outside B.</li></ul>A conclusion FOLLOWS only if it is true in <b>every possible diagram</b>.<br><b>Venn counting:</b> two-set problems: |A∪B| = |A| + |B| − |A∩B|. Minimum overlap = |A| + |B| − total; maximum = the smaller set.<br><b>Representability:</b> for three terms, check which pairs can overlap — e.g., Fruit–Mango–Vegetable: mango ⊂ fruit; vegetable separate.",
"<b>न्याय-वाक्य विधि</b> (तर्क नहीं, आरेख बनाएँ):<ul><li>'सभी A, B हैं' → A, के भीतर B।</li><li>'कुछ A, B हैं' → प्रतिच्छेदी वृत्त।</li><li>'कोई A, B नहीं' → अलग वृत्त।</li><li>'कुछ A, B नहीं हैं' → आंशिक ओवरलैप + A का बाहरी भाग।</li></ul>निष्कर्ष तभी निकलेगा जब वह <b>हर संभव आरेख</b> में सत्य हो।<br><b>गणना:</b> |A∪B| = |A| + |B| − |A∩B|; न्यूनतम ओवरलैप = |A|+|B|−कुल; अधिकतम = छोटा समुच्चय।",
["Draw 2–3 possible diagrams; a conclusion valid in one drawing can still be wrong.","'Some' statements NEVER give 'all' conclusions.","Convert statements to set notation — counting beats intuition.","Minimum 'both' questions: add the two groups and subtract the total.","Watch the subject–predicate order in conclusions — reversal changes truth."],
["2–3 संभावित आरेख बनाएँ; एक आरेख में सत्य निष्कर्ष अपर्याप्त है।","'कुछ' से 'सभी' निष्कर्ष कभी नहीं।","कथनों को समुच्चय-संकेतन में बदलें।","न्यूनतम 'दोनों' = दोनों समूहों का योग − कुल।","निष्कर्ष में कर्ता–विधेय का क्रम जाँचें।"]);

Q("rea7d","rea7","Statements: No cats are dogs. All dogs are animals. Conclusion: 'Some animals are not cats'","कथन: कोई बिल्ली कुत्ता नहीं है। सभी कुत्ते जंतु हैं। निष्कर्ष: 'कुछ जंतु बिल्ली नहीं हैं'",

Q("rea7e","rea7","In a class of 60, 35 like tea and 30 like coffee; every student likes at least one. The MINIMUM number who like both:","60 विद्यार्थियों में 35 को चाय और 30 को कॉफ़ी पसंद है; प्रत्येक को कम-से-कम एक पसंद है। दोनों पसंद करने वालों की न्यूनतम संख्या:",

["Follows","Does not follow","Only some follow","Cannot be said"],["निकलता है","नहीं निकलता","केवल कुछ निकलते हैं","नहीं कहा जा सकता"],0,

"शिक्षक ⊂ स्नातक ⊂ नियोजित — सकर्मकता से <b>सभी शिक्षक नियोजित</b>।");

/* ---------- 8. MATHEMATICAL OPERATIONS & RANKING ---------- */
C("rea8","rea","Mathematical Operations & Ranking","गणितीय संक्रियाएँ एवं क्रम","➕",
"<b>Sign-substitution:</b> replace every symbol as instructed, add brackets where needed, then apply BODMAS to the NEW expression:<ul><li>'+' means '×': 8 + 6 becomes 8 × 6.</li><li>Interchange signs: swap FIRST, calculate SECOND — never the reverse.</li><li>If numbers are also swapped, handle the swap before evaluating.</li></ul><b>Inequality chains:</b> A > B > C ⇒ A > C; A ≥ B and B ≥ C ⇒ A ≥ C; mixed signs (≥ with >) cannot be chained fully — the conclusion is limited.<br><b>Ranking:</b> total = (rank from top) + (rank from bottom) − 1. Between two persons: gap = difference of positions − 1. Position from other end = total − position + 1.<br><b>Number tricks:</b> a×b given as f(a,b) — test with the two examples, extract the function, apply to the asked pair.",
"<b>चिह्न-प्रतिस्थापन:</b> निर्देशानुसार सभी चिह्न बदलें, आवश्यकता हो तो कोष्ठक लगाएँ, फिर नए व्यंजक पर BODMAS:<ul><li>'+' का अर्थ '×': 8 + 6 → 8 × 6।</li><li>चिह्न अदला-बदली: पहले बदलें, बाद में हल करें।</li></ul><b>असमता श्रृंखला:</b> A > B > C ⇒ A > C; मिश्रित चिह्न (≥ व >) में पूर्ण श्रृंखला नहीं बनती।<br><b>क्रम:</b> कुल = ऊपर से स्थान + नीचे से स्थान − 1। दूसरे छोर से स्थान = कुल − स्थान + 1।<br><b>अंक-चाल:</b> दो उदाहरणों से फ़ंक्शन निकालकर लागू करें।",
["Rewrite the WHOLE expression with new signs before touching BODMAS.","Ranking: subtract 1 — the counted person sits in both lists.","In inequality questions, try to break each option with a counter-example.","For invented operations, verify your function against BOTH given examples.","Interchange questions: do the swap in one line, then calculate."],
["BODMAS से पहले पूरे व्यंजक में नए चिह्न लिखें।","क्रम में −1 न भूलें — गिना गया व्यक्ति दोनों सूचियों में है।","असमता विकल्पों को प्रति-उदाहरण से तोड़ें।","नवाचार संक्रिया को दोनों उदाहरणों से जाँचें।","अदला-बदली एक पंक्ति में करें, फिर हल करें।"]);

Q("rea8a","rea8","If '+' means '×', '−' means '÷', '×' means '−' and '÷' means '+', then 8 + 6 − 4 × 3 ÷ 2 = ?","यदि '+' का अर्थ '×', '−' का '÷', '×' का '−' और '÷' का '+' है, तो 8 + 6 − 4 × 3 ÷ 2 = ?",

Q("rea8b","rea8","If A > B and B > C, then which is definitely true?","यदि A > B और B > C, तो क्या निश्चित रूप से सत्य है?",

Q("rea8c","rea8","If '−' means '+' and '+' means '−', then 10 − 5 + 3 = ?","यदि '−' का अर्थ '+' और '+' का अर्थ '−' है, तो 10 − 5 + 3 = ?",

Q("rea8d","rea8","If the signs '×' and '+' are interchanged, the value of 4 + 6 × 2 becomes:","यदि '×' और '+' चिह्न आपस में बदले जाएँ, तो 4 + 6 × 2 का मान होगा:",

Q("rea8e","rea8","In a queue of students, Ram is 11th from the front and 27th from the back. Total students in the queue:","विद्यार्थियों की पंक्ति में राम आगे से 11वें और पीछे से 27वें स्थान पर है। कुल विद्यार्थी:",

/* ---------- COM 1. FUNDAMENTALS & HARDWARE ---------- */
C("com1","com","Computer Fundamentals & Hardware","कंप्यूटर आधारभूत एवं हार्डवेयर","🖥️",
"<b>Computer</b> = an electronic device that accepts <b>data</b> (input), <b>processes</b> it, stores it and gives <b>information</b> (output). Working cycle: <b>IPOS</b> — Input → Process → Output → Storage.<ul><li><b>Generations:</b> 1st — Vacuum tubes; 2nd — Transistors; 3rd — Integrated Circuits (IC); 4th — Microprocessors (VLSI); 5th — AI & parallel processing.</li><li><b>Father of the computer:</b> Charles Babbage (Analytical Engine). First programmer: Ada Lovelace.</li><li><b>Hardware</b> = physical parts (CPU, keyboard, monitor). <b>Software</b> = programs that run on it.</li><li><b>Input devices:</b> keyboard, mouse, scanner, OMR, OCR, barcode reader, microphone, joystick.</li><li><b>Output devices:</b> monitor, printer, plotter, speaker, projector.</li><li><b>CPU</b> (brain of computer) has <b>ALU</b> (arithmetic-logic), <b>CU</b> (control unit) and <b>Registers</b> (fastest memory).</li><li><b>Memory hierarchy (fast→slow):</b> Registers → Cache → RAM → Hard disk. RAM is <b>volatile</b> (data lost on power-off); ROM is <b>non-volatile</b>.</li><li><b>Units:</b> 8 bits = 1 Byte; 1024 B = 1 KB; 1024 KB = 1 MB; 1024 MB = 1 GB; 1024 GB = 1 TB.</li></ul>",
"<b>कंप्यूटर</b> = इलेक्ट्रॉनिक यंत्र जो डेटा लेता है, प्रोसेस करता है, संग्रहित करता है और सूचना देता है (IPOS चक्र)।<ul><li>पीढ़ियाँ: निर्वात ट्यूब → ट्रांजिस्टर → IC → माइक्रोप्रोसेसर → AI।</li><li>कंप्यूटर के जनक — चार्ल्स बैबेज; प्रथम प्रोग्रामर — एडा लवलेस।</li><li>इनपुट यंत्र: कीबोर्ड, माउस, स्कैनर; आउटपुट यंत्र: मॉनिटर, प्रिंटर, प्लॉटर।</li><li>CPU = ALU + CU + Registers; सबसे तेज़ मेमोरी Registers, फिर Cache, फिर RAM।</li><li>RAM अस्थिर (volatile), ROM स्थिर। 8 bit = 1 Byte; 1024 गुणा क्रम: KB → MB → GB → TB।</li></ul>",
["Learn the IPOS cycle with one example each — exams word it as 'data processing cycle'.","Memory hierarchy questions are guaranteed marks: Registers > Cache > RAM > Disk.","Memorise input vs output devices in two columns — scanner/plotter pairs are favourite traps.","1 KB = 1024 B (not 1000) — SSC always tests the 1024 factor.","Link each generation with its technology: tube→transistor→IC→microchip→AI."],
["IPOS चक्र एक उदाहरण से याद करें।","मेमोरी क्रम: Registers > Cache > RAM > डिस्क — पक्के अंक।","इनपुट बनाम आउटपुट यंत्र दो कॉलम में याद करें — स्कैनर/प्लॉटर भ्रमित करते हैं।","1 KB = 1024 B — 1024 गुणक ही याद रखें।","प्रत्येक पीढ़ी को उसकी तकनीक से जोड़ें।"]);

Q("com1a","com1","Who is called the 'Father of the Computer'?","'कंप्यूटर का जनक' किसे कहा जाता है?",
["Charles Babbage","Blaise Pascal","John von Neumann","Bill Gates"],["चार्ल्स बैबेज","ब्लेज़ पास्कल","जॉन वॉन न्यूमैन","बिल गेट्स"],0,
"<b>Charles Babbage</b> designed the Analytical Engine (1837), the concept behind modern computers.",
"<b>चार्ल्स बैबेज</b> ने एनालिटिकल इंजन (1837) डिज़ाइन किया, जो आधुनिक कंप्यूटर की अवधारणा है।");
Q("com1b","com1","Which part of the computer is called its 'brain'?","कंप्यूटर के किस भाग को उसका 'मस्तिष्क' कहा जाता है?",
["Hard disk","RAM","CPU","Monitor"],["हार्ड डिस्क","रैम","सीपीयू","मॉनिटर"],2,
"The <b>CPU (Central Processing Unit)</b> does all processing and decision-making, so it is called the brain of the computer.",
"<b>CPU (सेंट्रल प्रोसेसिंग यूनिट)</b> सारी प्रक्रिया व निर्णय करता है, अतः इसे मस्तिष्क कहते हैं।");
Q("com1c","com1","Which of the following is an INPUT device?","इनमें से कौन-सा इनपुट यंत्र है?",
["Plotter","Scanner","Monitor","Speaker"],["प्लॉटर","स्कैनर","मॉनिटर","स्पीकर"],1,
"A <b>scanner</b> sends data INTO the computer. Plotter, monitor and speaker are all output devices.",
"<b>स्कैनर</b> कंप्यूटर में डेटा भेजता है। प्लॉटर, मॉनिटर व स्पीकर आउटपुट यंत्र हैं।");
Q("com1d","com1","RAM is a ___ memory.","रैम एक ___ मेमोरी है।",
["Permanent","Volatile","Non-volatile","Secondary"],["स्थायी","अस्थिर (Volatile)","अवाष्पशील","द्वितीयक"],1,
"<b>RAM (Random Access Memory)</b> is volatile — all its data is erased when the power goes off. ROM is non-volatile.",
"<b>रैम</b> अस्थिर है — बिजली जाते ही डेटा मिट जाता है। ROM अवाष्पशील होती है।");
Q("com1e","com1","1 Byte is equal to:","1 बाइट बराबर है:",
["8 bits","4 bits","16 bits","1024 bits"],["8 बिट","4 बिट","16 बिट","1024 बिट"],0,
"<b>8 bits = 1 Byte</b>; then 1024 B = 1 KB, 1024 KB = 1 MB and so on (the ×1024 chain).",
"<b>8 बिट = 1 बाइट</b>; फिर 1024 B = 1 KB, 1024 KB = 1 MB — ×1024 श्रृंखला याद रखें।");
Q("com1f","com1","Third generation computers used:","तृतीय पीढ़ी के कंप्यूटर में प्रयुक्त हुआ:",
["Vacuum tubes","Transistors","Integrated Circuits","Microprocessors"],["निर्वात ट्यूब","ट्रांजिस्टर","इंटीग्रेटेड सर्किट (IC)","माइक्रोप्रोसेसर"],2,
"Generation order: vacuum tubes (1st) → transistors (2nd) → <b>ICs (3rd)</b> → microprocessors (4th) → AI (5th).",
"क्रम: निर्वात ट्यूब (1) → ट्रांजिस्टर (2) → <b>IC (3)</b> → माइक्रोप्रोसेसर (4) → AI (5)।");
Q("com1g","com1","Which memory is the FASTEST?","सबसे तेज़ मेमोरी कौन-सी है?",
["RAM","Cache","Hard disk","DVD"],["रैम","कैश","हार्ड डिस्क","डीवीडी"],1,
"Speed order: Registers &gt; <b>Cache</b> &gt; RAM &gt; Hard disk &gt; DVD. Cache stores frequently-used data next to the CPU.",
"गति क्रम: Registers &gt; <b>Cache</b> &gt; RAM &gt; हार्ड डिस्क &gt; DVD। कैश CPU के पास बार-बार उपयोगी डेटा रखता है।");
Q("com1h","com1","ALU stands for:","ALU का पूरा नाम है:",
["Applied Logic Unit","Arithmetic Logic Unit","Array Logic Unit","Arithmetic Local Unit"],["एप्लाइड लॉजिक यूनिट","अरिथमेटिक लॉजिक यूनिट","अरे लॉजिक यूनिट","अरिथमेटिक लोकल यूनिट"],1,
"<b>Arithmetic Logic Unit</b> — the part of the CPU that performs calculations (+, −) and comparisons (&gt;, =).",
"<b>अरिथमेटिक लॉजिक यूनिट</b> — CPU का भाग जो गणना व तुलना करता है।");
Q("com1i","com1","Arrange from SMALLEST to LARGEST unit of data:","डेटा इकाइयों को छोटे से बड़े क्रम में सजाएँ:",
["KB, MB, GB, TB","MB, KB, TB, GB","GB, TB, MB, KB","TB, GB, KB, MB"],["KB, MB, GB, TB","MB, KB, TB, GB","GB, TB, MB, KB","TB, GB, KB, MB"],0,
"Each step is ×1024: <b>Kilobyte → Megabyte → Gigabyte → Terabyte</b>.",
"प्रत्येक चरण ×1024: <b>KB → MB → GB → TB</b>।");
Q("com1j","com1","A compiler is a program that converts:","कंपाइलर वह प्रोग्राम है जो बदलता है:",
["High-level language to machine language","Machine language to high-level language","Data to information","RAM to ROM"],["हाई-लेवल भाषा को मशीन भाषा में","मशीन भाषा को हाई-लेवल में","डेटा को सूचना में","रैम को रोम में"],0,
"A <b>compiler</b> translates a whole high-level program (like C) into machine language in one go.",
"<b>कंपाइलर</b> पूरे हाई-लेवल प्रोग्राम (जैसे C) को एक साथ मशीन भाषा में बदलता है।");

/* ---------- COM 2. SOFTWARE & MS OFFICE ---------- */
C("com2","com","Software & MS Office","सॉफ़्टवेयर एवं एमएस ऑफ़िस","📋",
"<b>Software</b> = set of programs. Two types:<ul><li><b>System software:</b> runs the machine — Operating System (Windows, Linux, macOS, Android), drivers, utilities.</li><li><b>Application software:</b> for user tasks — MS Office, browsers, games, Tally.</li></ul><b>MS Office essentials:</b><ul><li><b>MS Word</b> (word processing) — file: .docx; mail merge, spell check (F7).</li><li><b>MS Excel</b> (spreadsheet) — file: .xlsx; worksheet = rows × columns; intersection = <b>cell</b>; formula starts with <b>=</b>; functions: SUM, AVERAGE, MAX, MIN, COUNT.</li><li><b>MS PowerPoint</b> (presentation) — file: .pptx; slide show starts with <b>F5</b>.</li></ul><b>Key shortcuts:</b> Ctrl+C copy · Ctrl+X cut · Ctrl+V paste · Ctrl+Z undo · Ctrl+Y redo · Ctrl+S save · Ctrl+P print · Ctrl+A select all · Ctrl+B bold · Ctrl+F find · Ctrl+Home beginning.<br><b>Keyboard function keys:</b> F1 help · F5 slideshow/refresh · F7 spell check · F12 save as.",
"<b>सॉफ़्टवेयर</b> = प्रोग्रामों का समूह। दो प्रकार:<ul><li><b>सिस्टम सॉफ़्टवेयर:</b> OS — Windows, Linux, Android।</li><li><b>एप्लिकेशन सॉफ़्टवेयर:</b> MS Office, ब्राउज़र, गेम्स।</li></ul><b>MS Office:</b><ul><li><b>Word</b> — .docx; मेल मर्ज; F7 वर्तनी जाँच।</li><li><b>Excel</b> — .xlsx; पंक्ति×स्तंभ का प्रतिच्छेद = <b>सेल</b>; फ़ॉर्मूला '=' से शुरू; SUM, AVERAGE, MAX, MIN।</li><li><b>PowerPoint</b> — .pptx; F5 स्लाइड शो।</li></ul><b>शॉर्टकट:</b> Ctrl+C कॉपी · Ctrl+V पेस्ट · Ctrl+Z अनडू · Ctrl+S सेव · Ctrl+P प्रिंट · Ctrl+B बोल्ड।",
["Extension questions (docx/xlsx/pptx) come in almost every paper — memorise the trio.","Make a chart of 15 Ctrl-shortcuts and revise it daily for one week.","Remember: OS = system software; everything the user opens = application software.","In Excel, '=' before any formula — SSC asks 'formula begins with?' directly.","Pair function keys with actions: F1 help, F5 slideshow, F7 spell-check."],

C("com3","com","Internet, Networking & Cyber Safety","इंटरनेट, नेटवर्किंग व साइबर सुरक्षा","🌐",

C("ca1","ca","Indian Constitution Snapshot","भारतीय संविधान सार-दर्पण","⚖️",
"One-look essentials of the Constitution:<ul><li>Drafted by the <b>Constituent Assembly</b>; <b>Dr. B. R. Ambedkar</b> chaired the Drafting Committee — called the '<b>Father of the Indian Constitution</b>'.</li><li>Adopted <b>26 November 1949</b> (Constitution Day); came into force <b>26 January 1950</b> (Republic Day).</li><li>Longest written constitution in the world; originally 395 Articles, 22 Parts, 8 Schedules (now 12 Schedules).</li><li><b>Preamble</b> — Sovereign, Socialist, Secular, Democratic, Republic (words 'Socialist, Secular, Integrity' added by the <b>42nd Amendment, 1976</b>).</li><li><b>Fundamental Rights — Part III</b> (Articles 12–35): Equality (14–18), Freedom (19–22), Against Exploitation (23–24), Religion (25–28), Culture &amp; Education (29–30), Constitutional remedies (32). <b>Article 21</b> — protection of life &amp; personal liberty; <b>Article 21A</b> — free &amp; compulsory education (6–14 yrs).</li><li><b>Parliament</b> = Lok Sabha + Rajya Sabha + President. Lok Sabha — max 550, 5-year term. Rajya Sabha — permanent body, 1/3 retire every 2 years.</li><li><b>President</b> — head of State &amp; first citizen; elected indirectly. <b>PM</b> — head of Government.</li><li>Money Bill — only in Lok Sabha (Article 110); Emergency — Articles 352, 356, 360.</li></ul>",
"संविधान के एक-दृष्टि तथ्य:<ul><li>संविधान सभा निर्माता; प्रारूप समिति के अध्यक्ष — <b>डॉ. भीमराव अंबेडकर</b> ('संविधान के जनक')।</li><li>अंगीकृत <b>26 नवंबर 1949</b>; लागू <b>26 जनवरी 1950</b>।</li><li>विश्व का सबसे लंबा लिखित संविधान; मूल 395 अनुच्छेद, 22 भाग, 8 अनुसूचियाँ (अब 12)।</li><li>प्रस्तावना — संप्रभु, समाजवादी, पंथनिरपेक्ष, लोकतांत्रिक, गणराज्य ('समाजवादी, पंथनिरपेक्ष, अखंडता' — 42वाँ संशोधन 1976)।</li><li><b>मूल अधिकार — भाग III</b> (अनुच्छेद 12–35); अनु. 21 — जीवन व दैहिक स्वतंत्रता; अनु. 21A — शिक्षा का अधिकार।</li><li><b>संसद</b> = लोकसभा + राज्यसभा + राष्ट्रपति; राज्यसभा स्थायी सदन।</li><li>राष्ट्रपति — राज्याध्यक्ष; प्रधानमंत्री — सरकाराध्यक्ष। धन विधेयक केवल लोकसभा में।</li></ul>",

<script>
/* ================= CORE: utils, DB, auth, header, router ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl2br=s=>esc(s).replace(/\r?\n/g,"<br>");
const fmtDate=t=>new Date(t).toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const fmtMin=m=>{const h=Math.floor(m/60),mm=m%60;return (h?h+"h ":"")+mm+"m"};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uid=p=>(p||"id")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const DB={
  get(k,d){try{const v=localStorage.getItem("asjbc_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("asjbc_"+k,JSON.stringify(v))}catch(e){toast("Storage full / blocked")}},
  push(k,item,max){const a=this.get(k,[]);a.push(item);if(max&&a.length>max)a.splice(0,a.length-max);this.set(k,a)}
};
const SETTINGS_DEF={neg:0.25,cert:60,mockN:25,mockMins:25,allowReg:true,college:{full:COLLEGE_DEFAULT.full,short:COLLEGE_DEFAULT.short}};
const settings=()=>Object.assign({},SETTINGS_DEF,DB.get("settings",{}));
const saveSettings=s=>DB.set("settings",s);

const state={user:null,view:"login",subj:null,chap:null,tab:"notes",lang:DB.get("lang","en"),test:null,adminTab:"overview",result:null,practice:null,lbTab:"all"};
const t=k=>{const d=I18N[state.lang]||I18N.en;return d[k]!==undefined?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k)};

/* ---------- logging ---------- */
function log(action,detail){
  const u=state.user||{};
  DB.push("logs",{ts:Date.now(),u:u.name||"Guest",uid:u.id||null,r:u.role||"-",a:action,d:detail||""},2500);

/* ---------- gamification: XP, levels, streak, progress, revision ---------- */
function addXP(n,why){
  const list=users();const me=list.find(x=>x.id===state.user.id);if(!me)return;
  me.xp=(me.xp||0)+n;DB.set("users",list);state.user=me;
}
const LEVELS=[[0,"Beginner","🌱"],[100,"Learner","📗"],[250,"Achiever","🥉"],[500,"Pro","🥈"],[850,"Master","🥇"],[1300,"Champion","🏆"],[1900,"Legend","👑"]];
function levelOf(xp){let r=LEVELS[0];LEVELS.forEach(l=>{if(xp>=l[0])r=l});return r}
function nextLevelOf(xp){for(const l of LEVELS){if(xp<l[0])return l}return null}
function todayStr(){return new Date().toLocaleDateString("en-CA")}
function touchStreak(){
  const list=users();const me=list.find(x=>x.id===state.user.id);if(!me)return;
  const t=todayStr();if(me.lastDay===t){DB.set("users",list);state.user=me;return}
  const y=new Date(Date.now()-864e5).toLocaleDateString("en-CA");
  me.streak=(me.lastDay===y)?(me.streak||0)+1:1;me.lastDay=t;
  DB.set("users",list);state.user=me;
}
function progKey(){return "prog_"+state.user.id}
function myProg(){return DB.get(progKey(),{})}
function setProg(chid,k,v){const p=myProg();p[chid]=p[chid]||{};p[chid][k]=v;DB.set(progKey(),p)}
function chProg(chid){const p=myProg()[chid]||{};let d=0;if(p.n)d++;if(p.p)d++;if(p.t)d++;return Math.round(d/3*100)}
function lastChapterKey(){return "lastch_"+state.user.id}
function revKey(){return "rev_"+state.user.id}
function myRev(){return DB.get(revKey(),[])}
function inRev(qid){return myRev().includes(qid)}
function toggleRev(qid){
  const r=myRev();const i=r.indexOf(qid);
  if(i>=0){r.splice(i,1);DB.set(revKey(),r);toast(t("unmarked"));return false}
  r.push(qid);DB.set(revKey(),r);toast(t("marked"));return true;
}

/* ---------- password hashing ---------- */
async function hashPass(pw){
  try{
    if(window.crypto&&crypto.subtle&&window.isSecureContext){
      const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("asjbc::"+pw));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  /* fallback FNV-1a x4 */
  let h1=0x811c9dc5,h2=0x01000193,h3=0x93c467e3,h4=0x85ebca6b;
  const s="asjbc::"+pw;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);
    h1=(h1^c);h1=Math.imul(h1,0x01000193)>>>0;
    h2=(h2^((c+i)&255));h2=Math.imul(h2,0x85ebca6b)>>>0;
    h3=Math.imul(h3^c,0x27d4eb2f)>>>0;
    h4=Math.imul(h4^((c<<3)&65535),0x165667b1)>>>0;}
  return "fnv"+h1.toString(16)+h2.toString(16)+h3.toString(16)+h4.toString(16);
}

/* ---------- users & auth ---------- */
const users=()=>DB.get("users",[]);
function findUser(email){return users().find(u=>u.email.toLowerCase()===String(email).toLowerCase())}
async function registerUser(name,email,pass,role,extra){
  const list=users();
  const u={id:uid("u"),name:name.trim(),email:email.trim().toLowerCase(),pass:await hashPass(pass),role:role||"student",status:"active",created:Date.now(),lastLogin:0,xp:0,streak:0,lastDay:"",
    exam:(extra&&extra.exam)||"",targets:(extra&&extra.targets)||[],custom:null};
  if(extra)for(const k in extra){if(k!=="exam"&&k!=="targets")u[k]=extra[k]}
  list.push(u);DB.set("users",list);return u;
}
async function doLogin(email,pass){
  const u=findUser(email);
  if(!u)return {err:"wrong"};
  if(u.status!=="active")return {err:"disabled"};
  if(await hashPass(pass)!==u.pass)return {err:"wrong"};
  const list=users();const me=list.find(x=>x.id===u.id);me.lastLogin=Date.now();DB.set("users",list);
  DB.set("session",u.id);state.user=me;
  log("LOGIN",me.email);
  return {ok:true};
}
function logout(){log("LOGOUT","");DB.set("session",null);state.user=null;go("login");}

/* ---------- question/chapter access (with admin overlays) ---------- */
function allChapters(){
  const tomb=DB.get("tomb_ch",[]),ov=DB.get("ov_ch",{}),add=DB.get("chadd",[]);
  const base=CHP.filter(c=>!tomb.includes(c.id)).map(c=>Object.assign({},c,ov[c.id]||{}));
  return base.concat(add);
}
function chaptersOf(sid){return allChapters().filter(c=>c.s===sid)}
function allQuestions(){
  const tomb=DB.get("tomb_q",[]),ov=DB.get("ov_q",{}),add=DB.get("qadd",[]);
  const base=QB.filter(q=>!tomb.includes(q.id)).map(q=>Object.assign({},q,ov[q.id]||{}));
  return base.concat(add);
}
function questionsOf(chapId){return allQuestions().filter(q=>q.c===chapId)}
function questionsOfSubject(sid){return allQuestions().filter(q=>q.s===sid)}
function chapterById(id){return allChapters().find(c=>c.id===id)}
function questionById(id){return allQuestions().find(q=>q.id===id)}
function chapIndex(sid,chapId){return chaptersOf(sid).findIndex(c=>c.id===chapId)}

/* ---------- modal & toast ---------- */
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2600)}
function openModal(html){$("#modalBox").innerHTML=html;$("#modalBg").classList.add("show")}
function closeModal(){$("#modalBg").classList.remove("show")}
function confirmBox(msg,onYes){openModal(`<h3>${esc(t("delete"))}</h3><p style="color:var(--ink2)">${esc(msg)}</p><div class="modal-foot"><button class="btn btn-g btn-s" onclick="closeModal()">${esc(t("cancel"))}</button><button class="btn btn-d btn-s" id="cfmYes">${esc(t("delete"))}</button></div>`);$("#cfmYes").onclick=()=>{closeModal();onYes()}}
