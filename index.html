function renderShell(active,body){$("#app").innerHTML=headerHTML(active)+`<div class="wrap">${body}</div>`;bindHeader()}
function renderShellFull(active,body){$("#app").innerHTML=headerHTML(active)+body;bindHeader()}
function bindHeader(){
  document.querySelectorAll("[data-go]").forEach(a=>a.onclick=()=>{
    const v=a.dataset.go;
    if(v==="admin"&&!(state.user&&(state.user.role==="admin"||state.user.role==="teacher"))){toast(t("needAdmin"));return}
    if(v==="dashboard"){go("dashboard");return}
    go(v);
  });
  const lb=document.querySelector("[data-lang]");if(lb)lb.onclick=()=>{state.lang=state.lang==="en"?"hi":"en";DB.set("lang",state.lang);go(state.view,true)};
  const lo=document.querySelector("[data-logout]");if(lo)lo.onclick=logout;
  document.querySelectorAll(".crumb [data-cgo]").forEach(b=>b.onclick=()=>go(b.dataset.cgo,b.dataset.arg||null));
}

/* ---------- router ---------- */
function go(view,arg,keep){
  if(state.test&&view!=="exam"&&!keep&&state.view==="exam"){
    if(!confirm("Test in progress. Leaving will abandon the test. Continue?"))return;
    clearInterval(state.test.timer);state.test=null;
  }
  state.view=view;
  if(arg!==undefined&&arg!==null){
    if(view==="subject")state.subj=arg;
    if(view==="chapter"&&state.chap!==arg){state.chap=arg;state.tab="notes"}
  }
  try{
    if(view==="exam"){renderExam();return}
  }catch(e){console.error(e);toast("Render error: "+e.message)}
  const V={firstRun:vFirstRun,login:vLogin,register:vRegister,dashboard:vDashboard,subject:vSubject,subjects:vSubjects,chapter:vChapter,results:vResults,leaderboard:vLeaderboard,certs:vCerts,profile:vProfile,admin:vAdmin,result:vResult,daily:vDaily,revision:vRevision,activity:vActivity};
  const fn=V[view]||vDashboard;
  try{fn()}catch(e){console.error(e);$("#app").innerHTML=headerHTML("")+`<div class="wrap"><div class="alert alert-err">Render error: ${esc(e.message)}</div></div>`}
  window.scrollTo({top:0});
}

    <div id="frErr"></div>
    <div class="field"><label>${esc(t("fullName"))}</label><input class="inp" id="frName" placeholder="e.g. Principal Sharma"></div>
    <div class="field"><label>${esc(t("email"))}</label><input class="inp" id="frEmail" type="email" placeholder="admin@college.edu"></div>
    <div class="field"><label>${esc(t("password"))}</label><input class="inp" id="frPass" type="password" placeholder="Min. 6 characters"></div>
    <div class="field"><label>${esc(t("confirmPassword"))}</label><input class="inp" id="frPass2" type="password"></div>
    <button class="btn btn-p btn-block" id="frBtn">${esc(t("createAdmin"))} →</button>
  </div></div>`);
  $("#frBtn").onclick=async()=>{
    const n=$("#frName").value.trim(),e=$("#frEmail").value.trim(),p=$("#frPass").value,p2=$("#frPass2").value;
    const err=m=>{$("#frErr").innerHTML=`<div class="alert alert-err">${esc(m)}</div>`};
    if(!n||!e||!p)return err(t("fillAll"));
    if(p.length<6)return err("Password must be at least 6 characters.");
    if(p!==p2)return err(t("pwdMismatch"));
    if(findUser(e))return err(t("emailExists"));
    const u=await registerUser(n,e,p,"admin");
    DB.set("session",u.id);state.user=u;
    log("SETUP","Administrator account created: "+u.email);
    toast("Administrator account created ✓");
    go("dashboard");
  };
}

  return EXAMS.map(e=>`<option value="${esc(e[0])}" ${sel===e[0]?"selected":""}>${esc(e[0])}</option>`).join("");
}
function subjectChips(sel){

}

    <div class="field"><label>${esc(t("email"))}</label><input class="inp" id="rgEmail" type="email"></div>

        <p class="hint" style="margin:0 0 6px">${esc(t("chooseExamH"))}</p>
        <select class="inp" id="rgExam"><option value="">— ${esc(t("examTarget"))} —</option>${examOptions("")}</select>
      </div>
      <div class="field"><label>📚 ${esc(t("chooseSubs"))}</label>
        <p class="hint" style="margin:0 0 6px">${esc(t("chooseSubsH"))}</p>
        <div class="chiprow" id="rgSubs">${subjectChips([])}</div>

    </div>
    <button class="btn btn-p btn-block" id="rgBtn">${esc(t("studentReg"))} →</button>
    <p style="text-align:center;margin-top:16px;font-size:13.5px;color:var(--ink2)">${esc(t("haveAccount"))} <a href="#" id="goLogin" style="font-weight:700">${esc(t("login"))}</a></p>`));
  $("#rgBtn").onclick=async()=>{
    const n=$("#rgName").value.trim(),e=$("#rgEmail").value.trim(),p=$("#rgPass").value,p2=$("#rgPass2").value;
    const ex=$("#rgExam").value;
    const tg=[...document.querySelectorAll("#rgSubs input:checked")].map(i=>i.value);
    const err=m=>{$("#rgErr").innerHTML=`<div class="alert alert-err">${esc(m)}</div>`};
    if(!n||!e||!p)return err(t("fillAll"));
    if(p.length<6)return err("Password must be at least 6 characters.");
    if(p!==p2)return err(t("pwdMismatch"));
    if(findUser(e))return err(t("emailExists"));
    if(!ex)return err("Please choose your target exam (🎯).");
    if(!tg.length)return err(t("chooseSubsH"));
    await registerUser(n,e,p,"student",{exam:ex,targets:tg});
    log("REGISTER",e+" · target: "+ex+" · subjects: "+tg.join(", "));
    toast(t("accountCreated"));go("login");
  };
  $("#goLogin").onclick=ev=>{ev.preventDefault();go("login")};
}

<script>
/* ================= STUDENT VIEWS ================= */
function subjProgress(sid){
  const chs=chaptersOf(sid);if(!chs.length)return 0;
  const sum=chs.reduce((a,c)=>a+chProg(c.id),0);return Math.round(sum/chs.length);
}
function userTargets(){return state.user.targets||[]}

function vDashboard(){
  const u=state.user;const s=settings();
  const myResults=DB.get("results",[]).filter(r=>r.uid===u.id);
  const best=myResults.length?Math.max(...myResults.map(r=>r.pct)):null;
  const lv=levelOf(u.xp||0);const nx=nextLevelOf(u.xp||0);
  const targets=userTargets();
  const ordered=[...SUBJECTS].sort((a,b)=>(targets.includes(b.id)?1:0)-(targets.includes(a.id)?1:0));
  const subs=ordered.map(sub=>{
    const chs=chaptersOf(sub.id);const qs=questionsOfSubject(sub.id).length;
    const pr=subjProgress(sub.id);const tgt=targets.includes(sub.id);
    return `<div class="subj-card ${tgt?"tgt":""}" data-sub="${sub.id}" style="background:linear-gradient(135deg,${sub.grad[0]},${sub.grad[1]})">
      ${tgt?`<div class="tgt-badge">${esc(t("targetBadge"))}</div>`:""}
      <div class="ic">${sub.icon}</div><h3>${esc(sub.name)}</h3>
      <div class="src">${esc(sub.src)}</div>
      <div class="meta"><span class="pill">${chs.length} ${esc(t("chapters"))}</span><span class="pill">${qs} ${esc(t("questionCount"))}</span><span class="pill">EN / हिन्दी</span></div>
      <div class="sbar"><div style="width:${pr}%"></div></div><div class="slbl">${esc(t("progress"))} ${pr}%</div>
    </div>`;
  }).join("");
  const lastId=DB.get(lastChapterKey(),null);
  const lastCh=lastId?chapterById(lastId):null;
  const daily=DB.get("daily_"+u.id,null);
  const dailyDoneToday=daily&&daily.date===todayStr();
  renderShell("dashboard",`
    <div class="hero">
      <h1>${esc(t("welcome"))}, ${esc(u.name)} 👋</h1>
      <div class="goal-chips">
        ${u.exam?`<span class="goal-chip">🎯 ${esc(u.exam)}</span>`:""}
        <span class="goal-chip alt">${lv[2]} ${esc(t("level"))} ${esc(lv[1])} · ${u.xp||0} XP${nx?` · ${esc(nx[0]-((u.xp||0)))} XP → ${esc(nx[2])} ${esc(nx[1])}`:""}</span>
        <span class="goal-chip alt">🔥 ${u.streak||0} ${esc(t("streakDays"))}</span>
      </div>
      <p>${SUBJECTS.length} ${esc(t("subjects"))} · ${allChapters().length} ${esc(t("chapters"))} · ${allQuestions().length} ${esc(t("totalQuestions"))} — ${esc(t("madeWith"))}</p>
    </div>
    <div class="daily-banner ${dailyDoneToday?"done":""}">
      <div class="db-ic">🎯</div>
      <div class="db-txt"><h3>${esc(t("dailyTitle"))}</h3>
        <p>${dailyDoneToday?esc(t("dailyDone"))+" ("+daily.correct+"/"+daily.total+")":esc(t("dailyCome"))}</p></div>
      <button class="btn ${dailyDoneToday?"btn-g":"btn-w"}" id="dailyBtn">${dailyDoneToday?"✅ "+esc(t("done")):esc(t("startDaily"))} →</button>
    </div>
    <div class="stat-cards">
      <div class="stat"><div class="v b">${allQuestions().length}</div><div class="l">${esc(t("totalQuestions"))}</div></div>
      <div class="stat"><div class="v g">${myResults.length}</div><div class="l">${esc(t("attempts"))}</div></div>
      <div class="stat"><div class="v o">${best!==null?best+"%":"—"}</div><div class="l">${esc(t("bestScore"))}</div></div>
      <div class="stat"><div class="v">${s.neg>0?("−"+s.neg):"0"}</div><div class="l">${esc(t("negMarkNote"))}</div></div>
    </div>
    ${lastCh?`<div class="continue-card" id="contCard">
      <div class="cc-l">⏭️ <b>${esc(t("continueLearning"))}:</b> ${esc(lastCh.t)} ${esc(lastCh.th?"· "+lastCh.th:"")} <span class="cc-p">${chProg(lastCh.id)}%</span></div>
      <button class="btn btn-p btn-s">${esc(t("start"))} →</button></div>`:""}
    <div class="sect-h"><h2>📚 ${esc(t("subjects"))} — ${esc(t("learn"))}</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-g btn-s" id="revBtn">📌 ${esc(t("revision"))}${myRev().length?" ("+myRev().length+")":""}</button>
        <button class="btn btn-g btn-s" id="actBtn">🕘 ${esc(t("myActivity"))}</button>
        <button class="btn btn-t btn-s" id="grandBtn">🏆 ${esc(t("grandMock"))} (${s.mockN} Q · ${s.mockMins} min)</button>
      </div></div>
    <div class="grid g3">${subs}</div>`);
  document.querySelectorAll("[data-sub]").forEach(c=>c.onclick=()=>go("subject",c.dataset.sub));
  $("#grandBtn").onclick=()=>startMock("all");
  $("#revBtn").onclick=()=>go("revision");
  $("#actBtn").onclick=()=>go("activity");
  $("#dailyBtn").onclick=()=>go("daily");
  const cc=$("#contCard");if(cc)cc.onclick=()=>go("chapter",lastCh.id);
}

function vSubject(){
  const sid=state.subj;const sub=subjById(sid);if(!sub){go("dashboard");return}
  log("VIEW_SUBJECT",sub.name);
  const chs=chaptersOf(sid);
  const cards=chs.map((c,i)=>{
    const g=gradOf(i);const qs=questionsOf(c.id).length;const pr=chProg(c.id);
    return `<div class="ch-card" data-ch="${c.id}" style="background:linear-gradient(135deg,${g[0]},${g[1]})">
      <div class="shine"></div><div class="num">${String(i+1).padStart(2,"0")}</div>
      <div class="ic">${c.icon||"📘"}</div>
      <h4>${esc(c.t)}</h4><div class="hname">${esc(c.th||"")}</div>
      <div class="tags"><span class="tag">📝 ${qs} ${esc(t("questionCount"))}</span><span class="tag">📖 ${esc(t("notesTab"))}</span><span class="tag">🃏 ${esc(t("flashcards"))}</span><span class="tag">💡 ${esc(t("guidance"))}</span></div>
      <div class="chbar"><div style="width:${pr}%"></div></div>
    </div>`;
  }).join("");
  renderShell("dashboard",`
    <div class="sect-h"><div>
      <div class="crumb"><b data-cgo="dashboard">${esc(t("dashboard"))}</b> › ${esc(sub.name)}</div>
      <h2>${sub.icon} ${esc(sub.name)} <span style="font-size:14px;color:var(--muted);font-weight:600">— ${esc(sub.src)}</span></h2></div>
      <button class="btn btn-t btn-s" id="subjMock">⏱️ ${esc(t("mockTest"))} · ${esc(sub.nameH||"")}</button>
    </div>
    <div class="alert alert-info">${esc(sub.desc)}</div>
    <div class="ch-grid" style="margin-top:16px">${cards}</div>`);
  document.querySelectorAll("[data-ch]").forEach(c=>c.onclick=()=>go("chapter",c.dataset.ch));
  $("#subjMock").onclick=()=>startMock(sid);
  bindHeader();
}

function vChapter(){
  const ch=chapterById(state.chap);if(!ch){go("dashboard");return}
  const sub=subjById(ch.s);
  const idx=chapIndex(ch.s,ch.id);
  const qn=questionsOf(ch.id).length;
  const tab=state.tab;
  log("VIEW_CHAPTER",ch.t);
  let body="";
  if(tab==="notes")body=notesBody(ch);
  else if(tab==="cards")body=fcBody(ch);
  else if(tab==="guide")body=guideBody(ch);
  else if(tab==="practice")body=practiceBody(ch);
  else body=testIntro(ch,qn,sub);
  DB.set(lastChapterKey(),ch.id);
  renderShell("dashboard",`
    <div class="sect-h"><div>
      <div class="crumb"><b data-cgo="dashboard">${esc(t("dashboard"))}</b> › <b data-cgo="subject" data-arg="${ch.s}">${esc(sub?sub.name:"")}</b> › ${esc(ch.t)}</div>
      <h2>${ch.icon||"📘"} ${esc(ch.t)} <span style="font-size:14px;color:var(--muted);font-weight:600">${esc(ch.th||"")}</span></h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${idx>0?`<button class="btn btn-g btn-s" id="chPrev">← ${esc(chaptersOf(ch.s)[idx-1].t)}</button>`:""}
        ${idx<chaptersOf(ch.s).length-1?`<button class="btn btn-g btn-s" id="chNext">${esc(chaptersOf(ch.s)[idx+1].t)} →</button>`:""}
      </div></div>
    <div class="tabs">
      <button class="tab ${tab==="notes"?"on":""}" data-tab="notes">📖 ${esc(t("notesTab"))}</button>
      <button class="tab ${tab==="cards"?"on":""}" data-tab="cards">🃏 ${esc(t("flashcards"))}</button>
      <button class="tab ${tab==="guide"?"on":""}" data-tab="guide">💡 ${esc(t("tipsTab"))}</button>
      <button class="tab ${tab==="practice"?"on":""}" data-tab="practice">✍️ ${esc(t("practice"))}</button>
      <button class="tab ${tab==="test"?"on":""}" data-tab="test">⏱️ ${esc(t("chapterTest"))}</button>
    </div>
    <div id="chBody">${body}</div>`);
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;go("chapter",state.chap,true)});
  const p=$("#chPrev"),n=$("#chNext");
  if(p)p.onclick=()=>go("chapter",chaptersOf(ch.s)[idx-1].id,true);
  if(n)n.onclick=()=>go("chapter",chaptersOf(ch.s)[idx+1].id,true);
  bindHeader();
  const sw=$("#langSw");if(sw)sw.onclick=()=>{state.lang=state.lang==="en"?"hi":"en";DB.set("lang",state.lang);go("chapter",ch.id,true)};
  if(tab==="notes"&&!myProg()[ch.id]?.n){
    setProg(ch.id,"n",1);addXP(10,"notes");log("NOTES_READ",ch.t);
  }
  if(tab==="cards")bindFc(ch);
  if(tab==="practice"){
    bindPractice(ch);
    const again=$("#prAgain");if(again)again.onclick=()=>{state.practice=null;go("chapter",ch.id,true)};
    const tst=$("#prTest");if(tst)tst.onclick=()=>{state.tab="test";go("chapter",ch.id,true)};
  }
}

function langPair(obj){ /* returns {show, alt} based on lang, fallback */
  if(!obj)return {show:"",alt:null};
  if(state.lang==="hi"&&obj.hi)return {show:obj.hi,alt:"en"};
  return {show:obj.en||obj.hi||"",alt:state.lang==="en"?"hi":null};
}
function notesBody(ch){
  const L=langPair(ch.notes);
  const done=myProg()[ch.id]&&myProg()[ch.id].n;
  return `<div class="card notes-body">
    <div class="q-head"><span class="badge b-info">${esc(t("studyMaterial"))}${done?" · ✅ "+esc(t("notesViewed"))+" +10 XP":""}</span>
      <button class="btn btn-g btn-s" id="langSw">${L.alt==="hi"?"🌐 "+esc(t("showHindi")):L.alt==="en"?"🌐 "+esc(t("showEnglish")):"🌐 EN / हिन्दी"}</button></div>
    ${L.show}
  </div>`;
}
function guideBody(ch){
  const list=(state.lang==="hi"&&ch.guide&&ch.guide.hi&&ch.guide.hi.length)?ch.guide.hi:(ch.guide&&ch.guide.en?ch.guide.en:[]);
  const listH=(ch.guide&&ch.guide.hi)?ch.guide.hi:[];
  return `<div class="card">
    <span class="badge b-ok">${esc(t("guidance"))} — ${esc(t("tipsTab"))}</span>
    <h4 style="margin:12px 0 10px">${esc(ch.t)} — ${esc(state.lang==="hi"?"परीक्षा रणनीति":"Exam Strategy")}</h4>
    <ul class="tip-list">${list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    ${state.lang!=="hi"&&listH.length?`<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--brand);font-weight:700">🌐 मार्गदर्शन (हिन्दी में भी उपलब्ध)</summary>
      <ul class="tip-list" style="margin-top:10px">${listH.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}
  </div>`;
}

/* ---------- practice mode ---------- */
function practiceBody(ch){
  if(!state.practice||state.practice.ch!==ch.id){
    const qs=questionsOf(ch.id);
    state.practice={ch:ch.id,i:0,score:0,answered:false,order:shuffle(qs.map(q=>q.id))};
  }
  const P=state.practice;
  if(P.i>=P.order.length)return practiceDone(P);
  const q=questionById(P.order[P.i]);
  const L=langPair({en:q.q,hi:q.qh});
  const opts=q.o.map((o,k)=>{
    let cls="";
    if(P.answered){if(k===q.a)cls="ok";else if(k===P.pick)cls="bad"}
    const ot=(state.lang==="hi"&&q.oh&&q.oh[k])?q.oh[k]:o;
    return `<div class="opt ${cls}" data-opt="${k}"><div class="k ${cls}">${"ABCD"[k]}</div><div>${ot}</div></div>`;
  }).join("");
  let fb="";
  if(P.answered){
    const okQ=P.pick===q.a;
    const el=langPair({en:q.e,hi:q.eh});
    const revd=inRev(q.id);
    fb=`<div class="fb ${okQ?"fb-ok":"fb-bad"}"><div class="fb-t">${okQ?"✅ "+esc(t("correct")):"❌ "+esc(t("wrong"))}</div>
      <div><b>${esc(t("explanation"))}:</b> ${el.show}</div></div>
      <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap">
        <button class="btn btn-g btn-s ${revd?"pin-on":""}" id="prRev">${revd?"📌 "+esc(t("marked")):"📌 "+esc(t("revision"))}</button>
        <button class="btn btn-p" id="prNext">${P.i+1>=P.order.length?esc(t("finish")):esc(t("nextQ"))} →</button></div>`;
  }
  return `<div class="card">
    <div class="q-head"><span class="q-num">${esc(t("question"))} ${P.i+1} ${esc(t("of"))} ${P.order.length} · ${esc(t("practice"))}</span>
      <span class="badge b-ok">${esc(t("correct"))}: ${P.score}</span></div>
    <div class="q-text">${L.show}</div>
    ${q.svg?`<div class="q-svg">${q.svg}</div>`:""}
    ${opts}${fb}
  </div>`;
}
function bindPractice(ch){
  document.querySelectorAll("[data-opt]").forEach(o=>o.onclick=()=>{
    const P=state.practice;if(P.answered)return;
    P.answered=true;P.pick=+o.dataset.opt;
    const q=questionById(P.order[P.i]);
    if(P.pick===q.a)P.score++;
    log("PRACTICE_ANSWER",ch.t+" — "+(P.pick===q.a?"correct":"wrong"));
    go("chapter",ch.id,true);
  });
  const rv=$("#prRev");if(rv)rv.onclick=()=>{const q=questionById(state.practice.order[state.practice.i]);toggleRev(q.id);go("chapter",ch.id,true)};
  const nx=$("#prNext");if(nx)nx.onclick=()=>{state.practice.i++;state.practice.answered=false;go("chapter",ch.id,true)};
  const sw=$("#langSw");if(sw)sw.onclick=()=>{state.lang=state.lang==="en"?"hi":"en";DB.set("lang",state.lang);go("chapter",ch.id,true)};
}
function practiceDone(P){
  const ch=chapterById(P.ch);
  if(!P.done){
    P.done=true;
    const pct=Math.round(P.score/P.order.length*100);
    const old=(myProg()[P.ch]&&myProg()[P.ch].p)||0;
    setProg(P.ch,"p",Math.max(old,pct));
    addXP(10+P.score*2,"practice");touchStreak();
    log("PRACTICE_DONE",ch.t+" — "+P.score+"/"+P.order.length);
  }
  return `<div class="card" style="text-align:center;padding:44px">
    <div style="font-size:52px">🎉</div>
    <h3 style="margin:10px 0 6px">${esc(t("practiceDone"))}</h3>
    <p style="color:var(--ink2)">${esc(t("correct"))}: <b>${P.score} / ${P.order.length}</b> · <b>${esc(t("xpEarned"))}: +${10+P.score*2} XP</b></p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap">
      <button class="btn btn-g" id="prAgain">🔁 ${esc(t("practice"))} ${esc(t("start"))}</button>
      <button class="btn btn-p" id="prTest">⏱️ ${esc(t("chapterTest"))}</button>
    </div></div>`;
}

/* ---------- results & profile ---------- */
function vResults(){
  const mine=DB.get("results",[]).filter(r=>r.uid===state.user.id).sort((a,b)=>b.ts-a.ts);
  const rows=mine.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.title)}</b><br><span style="font-size:11.5px;color:var(--muted)">${esc(subjById(r.s)?subjById(r.s).name:"")}</span></td>
    <td>${fmtDate(r.ts)}</td><td><b>${r.score}</b>/${r.max}</td><td>${r.pct}%</td>
    <td><span class="badge ${r.pct>=settings().cert?"b-ok":"b-info"}">${r.pct>=settings().cert&&!r.noCert?"🏆 "+esc(t("certEarned")):fmtMin(Math.round(r.dur/60000))}</span></td>
    <td><button class="mini" data-view="${r.id}">${esc(t("view"))}</button>
    ${r.pct>=settings().cert&&!r.noCert?`<button class="mini gn" data-cert="${r.id}">📜 ${esc(t("generateCert"))}</button>`:""}</td></tr>`).join("");
  renderShell("results",`
    <div class="sect-h"><h2>📊 ${esc(t("myResults"))}</h2></div>
    ${mine.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>${esc(t("attempt"))}</th><th>${esc(t("date"))}</th><th>${esc(t("score"))}</th><th>${esc(t("percent"))}</th><th>${esc(t("status"))}</th><th>${esc(t("actions"))}</th></tr></thead><tbody>${rows}</tbody></table></div>`
    :`<div class="card empty"><div class="e-ic">📝</div>${esc(t("noResults"))}</div>`}`);
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.result=DB.get("results",[]).find(r=>r.id===b.dataset.view);go("result")});
  document.querySelectorAll("[data-cert]").forEach(b=>b.onclick=()=>{state.result=DB.get("results",[]).find(r=>r.id===b.dataset.cert);state.view="result";openCertFlow()});
}

function vProfile(){
  const u=state.user;
  const targets=u.targets||[];
  renderShell("profile",`
  <div class="sect-h"><h2>👤 ${esc(t("profile"))}</h2></div>
  <div class="grid g2">
    <div class="card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
        <div class="avatar" style="width:56px;height:56px;font-size:24px">${esc(u.name.charAt(0).toUpperCase())}</div>
        <div><h3>${esc(u.name)}</h3><div style="color:var(--ink2);font-size:13px">${esc(u.email)}</div><span class="badge b-info">${esc(u.role)}</span></div>
      </div>
      <p style="font-size:13px;color:var(--muted)">${esc(t("registered"))}: ${fmtDate(u.created)} · ${esc(t("lastLogin"))}: ${u.lastLogin?fmtDate(u.lastLogin):"—"}</p>
      <div class="goal-chips" style="margin-top:10px">
        <span class="goal-chip">🎯 ${esc(u.exam||"—")}</span>
        <span class="goal-chip alt">${levelOf(u.xp||0)[2]} ${u.xp||0} XP</span>
        <span class="goal-chip alt">🔥 ${u.streak||0} ${esc(t("streakDays"))}</span>
      </div>
      <div style="font-size:13.5px;color:var(--ink2);margin-top:10px">🌐 ${esc(t("uilang"))}: <b>${state.lang==="en"?"English":"हिन्दी"}</b> — <button class="mini" id="pfLang">${esc(t("language"))} ${esc(t("edit"))}</button></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:4px">🎯 ${esc(t("changeExam"))}</h3>
      <p class="hint" style="margin-bottom:12px">${esc(t("xpNote"))}</p>
      <div id="pfErr"></div>
      <div class="field"><label>🎯 ${esc(t("examTarget"))}</label><select class="inp" id="pfExam">${examOptions(u.exam)}</select></div>
      <div class="field"><label>📚 ${esc(t("mySubjects"))}</label><div class="chiprow" id="pfSubs">${subjectChips(targets)}</div></div>
      <button class="btn btn-p" id="pfGoal">${esc(t("save"))}</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">🔑 ${esc(t("changePassword"))}</h3>
      <div class="field"><label>${esc(t("currentPwd"))}</label><input class="inp" type="password" id="pfOld"></div>
      <div class="field"><label>${esc(t("newPassword"))}</label><input class="inp" type="password" id="pfNew"></div>
      <button class="btn btn-p" id="pfBtn">${esc(t("save"))}</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">📌 ${esc(t("revision"))} & 🕘 ${esc(t("myActivity"))}</h3>
      <p style="font-size:13.5px;color:var(--ink2)">${esc(t("revisionEmpty"))}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button class="btn btn-g btn-s" id="pfRev">📌 ${esc(t("revision"))}${myRev().length?" ("+myRev().length+")":""}</button>
        <button class="btn btn-g btn-s" id="pfAct">🕘 ${esc(t("myActivity"))}</button>
      </div>
    </div>
  </div>`);
  $("#pfBtn").onclick=async()=>{
    const o=$("#pfOld").value,n=$("#pfNew").value;
    if(await hashPass(o)!==u.pass){$("#pfErr").innerHTML=`<div class="alert alert-err">${esc(t("wrongCreds"))}</div>`;return}
    if(n.length<6){$("#pfErr").innerHTML=`<div class="alert alert-err">Min. 6 characters</div>`;return}
    const list=users();const me=list.find(x=>x.id===u.id);me.pass=await hashPass(n);DB.set("users",list);state.user=me;
    log("PASSWORD_CHANGE","");toast(t("passwordChanged"));
    $("#pfOld").value="";$("#pfNew").value="";
  };
  $("#pfGoal").onclick=()=>{
    const ex=$("#pfExam").value;
    const tg=[...document.querySelectorAll("#pfSubs input:checked")].map(i=>i.value);
    if(!tg.length){$("#pfErr").innerHTML=`<div class="alert alert-err">${esc(t("chooseSubsH"))}</div>`;return}
    const list=users();const me=list.find(x=>x.id===u.id);
    me.exam=ex;me.targets=tg;DB.set("users",list);state.user=me;
    log("PROFILE_UPDATE","target: "+ex+" · subjects: "+tg.join(", "));
    toast(t("saved"));go("profile",null,true);
  };
  $("#pfLang").onclick=()=>{state.lang=state.lang==="en"?"hi":"en";DB.set("lang",state.lang);go("profile",null,true)};
  $("#pfRev").onclick=()=>go("revision");
  $("#pfAct").onclick=()=>go("activity");
}
</script>

<script>
/* ================= EXAM ENGINE ================= */
function testIntro(ch,qn,sub){
  const s=settings();
  const n=Math.min(15,qn);const mins=Math.max(3,Math.round(n*0.9));
  return `<div class="grid g2">
    <div class="card">
      <h3>⏱️ ${esc(t("chapterTest"))} — ${esc(ch.t)}</h3>
      <p style="color:var(--ink2);font-size:13.5px;margin:8px 0 14px">${esc(t("chapterTestInfo"))}</p>
      <div class="stat-cards" style="margin:0">
        <div class="stat"><div class="v b">${qn}</div><div class="l">${esc(t("totalQuestions"))} in chapter</div></div>
        <div class="stat"><div class="v b">${n}</div><div class="l">${esc(t("questionCount"))} in test</div></div>
        <div class="stat"><div class="v">${mins}</div><div class="l">${esc(t("duration"))} (min)</div></div>
        <div class="stat"><div class="v r">${s.neg>0?"−"+s.neg:"0"}</div><div class="l">${esc(t("negMarkNote"))}</div></div>
      </div>
      <div class="alert alert-info" style="margin-top:14px">${esc(t("graderNote").replace("{neg}",String(s.neg)))}</div>
      <button class="btn btn-p btn-block" id="chTestBtn" ${qn?"":"disabled"}>🚀 ${esc(t("begin"))} — ${n} ${esc(t("questionCount"))}</button>
    </div>
    <div class="card">
      <h3 style="margin-bottom:10px">📋 ${esc(t("instructions"))}</h3>
      <ul style="margin-left:18px;font-size:14px;color:var(--ink2);line-height:1.9">
        <li>${esc(t("beginNote"))}</li>
        <li>${esc(t("qBanner"))}</li>
        <li>${esc(t("graderNote").replace("{neg}",String(s.neg)))}</li>
        <li>${esc(t("chapterPractice"))}</li>
      </ul>
    </div></div>`;
}
function bindTestIntro(ch,qn){
  const b=$("#chTestBtn");if(!b)return;
  b.onclick=()=>startChapterTest(ch);
}
/* hooks used by chapter view */
const _origVC=vChapter;
vChapter=function(){
  const before=document.getElementById("chBody");
  _origVC();
  const ch=chapterById(state.chap);
  if(ch&&state.tab==="test")bindTestIntro(ch,questionsOf(ch.id).length);
};

function startChapterTest(ch){
  const s=settings();
  const qs=shuffle(questionsOf(ch.id).map(q=>q.id)).slice(0,Math.min(15,questionsOf(ch.id).length));
  if(!qs.length){toast("No questions in this chapter yet");return}
  const mins=Math.max(3,Math.round(qs.length*0.9));
  beginTest({title:t("chapterTest")+" — "+ch.t,sid:ch.s,cid:ch.id,qids:qs,mins:mins,neg:s.neg});
}
function startMock(sid){
  const s=settings();
  let pool,title;
  if(sid==="all"){pool=allQuestions().map(q=>q.id);title=t("grandMock")}
  else{pool=questionsOfSubject(sid).map(q=>q.id);title=t("mockTest")+" — "+(subjById(sid)?subjById(sid).name:"")}
  if(!pool.length){toast("No questions available");return}
  beginTest({title:title,sid:sid==="all"?"mix":sid,qids:shuffle(pool).slice(0,s.mockN),mins:s.mockMins,neg:s.neg});
}
function beginTest(cfg){
  state.test={qids:cfg.qids,ans:{},mark:{},cur:0,end:Date.now()+cfg.mins*60000,mins:cfg.mins,neg:cfg.neg,title:cfg.title,sid:cfg.sid,cid:cfg.cid||null,daily:cfg.daily||false,timer:null,started:Date.now()};
  log("START_TEST",cfg.title+" ("+cfg.qids.length+" Q)");
  state.view="exam";renderExam();
}
window.addEventListener("beforeunload",e=>{if(state.view==="exam"&&state.test){e.preventDefault();e.returnValue=""}});

function qText(q){return (state.lang==="hi"&&q.qh)?q.qh:q.q}
function qOpt(q,k){return (state.lang==="hi"&&q.oh&&q.oh[k])?q.oh[k]:q.o[k]}

function renderExam(){
  const T=state.test;if(!T){go("dashboard");return}
  const q=questionById(T.qids[T.cur]);
  if(!q){submitTest();return}
  const sel=T.ans[T.cur];const mk=T.mark[T.cur];
  const opts=q.o.map((o,k)=>`<div class="opt ${sel===k?"sel":""}" data-eopt="${k}"><div class="k">${"ABCD"[k]}</div><div>${esc(qOpt(q,k))}</div></div>`).join("");
  const n=T.qids.length;
  const pal=T.qids.map((_,i)=>{
    let cls=T.ans[i]!==undefined?"ans":(T.mark[i]?"mark":"");
    if(i===T.cur)cls+=" cur";
    return `<button class="pq ${cls}" data-pq="${i}">${i+1}</button>`;
  }).join("");
  const secsLeft=Math.max(0,Math.round((T.end-Date.now())/1000));
  renderShellFull("exam",`<div class="wrap">
    <div class="exam-top">
      <div><div class="exam-title">⏱️ ${esc(T.title)}</div><div style="font-size:12px;color:var(--muted)">${esc(t("graderNote").replace("{neg}",String(T.neg)))} · ${esc(t("bilingual"))}: <b id="exLang" style="cursor:pointer;color:var(--brand)">${state.lang==="en"?"EN":"हिन्दी"}</b></div></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="q-num">${T.cur+1} / ${n}</span>
        <div class="timer ${secsLeft<60?"warn":""}" id="exTimer">⏳ ${fmtMin(Math.ceil(secsLeft/60))} · ${String(Math.floor(secsLeft/60)).padStart(2,"0")}:${String(secsLeft%60).padStart(2,"0")}</div>
        <button class="btn btn-p btn-s" id="exSubmit">${esc(t("submit"))} ✓</button>
      </div></div>
    <div class="exam-layout">
      <div class="card">
        <div class="q-head"><span class="q-num">${esc(t("question"))} ${T.cur+1} ${esc(t("of"))} ${n}</span>
          <button class="mark-star ${mk?"on":""}" id="exMark">${mk?"★ "+esc(t("markReview")):"☆ "+esc(t("markReview"))}</button></div>
        <div class="q-text">${esc(qText(q))}</div>
        ${q.svg?`<div class="q-svg">${q.svg}</div>`:""}
        ${opts}
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
          <button class="btn btn-g" id="exPrev" ${T.cur===0?"disabled":""}>← ${esc(t("prev"))}</button>
          <button class="btn btn-g" id="exClear">✕ ${esc(t("clear"))}</button>
          <button class="btn btn-p" id="exNext" ${T.cur===n-1?"disabled":""}>${esc(t("next"))} →</button>
        </div></div>
      <div class="pal">
        <b style="font-size:13px">${esc(t("yourProgress"))}</b>
        <div class="pal-grid">${pal}</div>
        <div class="pal-legend">
          <span><span class="dotk" style="background:#31b573"></span>${esc(t("correct"))} / answered</span>
          <span><span class="dotk" style="background:#8b6fe8"></span>${esc(t("markReview"))}</span>
          <span><span class="dotk" style="background:#dfe8f7"></span>seen</span>
          <span><span class="dotk" style="background:#fff"></span>unseen</span>
        </div>
        <button class="btn btn-t btn-block btn-s" id="exSubmit2" style="margin-top:12px">${esc(t("submit"))} ✓</button>
      </div></div></div>`);
  clearInterval(T.timer);
  T.timer=setInterval(()=>{const el=$("#exTimer");if(!el){clearInterval(T.timer);return}
    const sLeft=Math.max(0,Math.round((T.end-Date.now())/1000));
    el.textContent="⏳ "+String(Math.floor(sLeft/60)).padStart(2,"0")+":"+String(sLeft%60).padStart(2,"0");
    if(sLeft<60)el.classList.add("warn");
    if(sLeft<=0){clearInterval(T.timer);toast("⏰ Time up!");submitTest()}
  },500);
  document.querySelectorAll("[data-eopt]").forEach(o=>o.onclick=()=>{T.ans[T.cur]=+o.dataset.eopt;renderExam()});
  document.querySelectorAll("[data-pq]").forEach(b=>b.onclick=()=>{T.cur=+b.dataset.pq;renderExam()});
  $("#exPrev").onclick=()=>{if(T.cur>0){T.cur--;renderExam()}};
  $("#exNext").onclick=()=>{if(T.cur<T.qids.length-1){T.cur++;renderExam()}};
  $("#exClear").onclick=()=>{delete T.ans[T.cur];renderExam()};
  $("#exMark").onclick=()=>{if(T.mark[T.cur])delete T.mark[T.cur];else T.mark[T.cur]=1;renderExam()};
  $("#exLang").onclick=()=>{state.lang=state.lang==="en"?"hi":"en";DB.set("lang",state.lang);renderExam()};
  $("#exSubmit").onclick=confirmSubmit;$("#exSubmit2").onclick=confirmSubmit;
}
function confirmSubmit(){
  const T=state.test;const un=T.qids.length-Object.keys(T.ans).length;
  openModal(`<h3>✅ ${esc(t("submit"))}?</h3>
    <p style="color:var(--ink2)">${Object.keys(T.ans).length} answered · ${un} unanswered · ${esc(t("negMarkNote"))}: −${T.neg}</p>
    <div class="modal-foot"><button class="btn btn-g btn-s" onclick="closeModal()">${esc(t("back"))}</button><button class="btn btn-p btn-s" id="cfmSub">${esc(t("submit"))} ✓</button></div>`);
  $("#cfmSub").onclick=()=>{closeModal();submitTest()};
}
function submitTest(){
  const T=state.test;if(!T)return;
  clearInterval(T.timer);
  let correct=0,wrong=0,skipped=0;
  T.qids.forEach((qid,i)=>{const q=questionById(qid);
    if(T.ans[i]===undefined)skipped++;
    else if(T.ans[i]===q.a)correct++;
    else wrong++;
  });
  const raw=correct-wrong*T.neg;
  const score=Math.max(0,Math.round(raw*100)/100);
  const max=T.qids.length;
  const pct=Math.round(score/max*1000)/10;
  const res={id:uid("r"),uid:state.user.id,name:state.user.name,s:T.sid,cid:T.cid,title:T.title,ts:Date.now(),
    score:score,max:max,correct:correct,wrong:wrong,skipped:skipped,pct:pct,dur:Date.now()-T.started,answers:T.qids.map((q,i)=>T.ans[i]===undefined?null:T.ans[i]),qids:T.qids,neg:T.neg,noCert:T.daily||false};
  DB.push("results",res,800);
  log("SUBMIT_TEST",T.title+" — "+score+"/"+max+" ("+pct+"%)");
  if(T.cid){
    const old=(myProg()[T.cid]&&myProg()[T.cid].t)||0;
    setProg(T.cid,"t",Math.max(old,pct));
    addXP(20+Math.round(pct/10),"test");touchStreak();
  } else { addXP(15+Math.round(pct/10),"mock");touchStreak(); }
  if(T.daily){
    DB.set("daily_"+state.user.id,{date:todayStr(),correct:correct,total:T.qids.length,pct:pct});
    log("DAILY_DONE",correct+"/"+T.qids.length);
  }
  state.test=null;state.result=res;state.view="result";
  go("result");
}

/* ---------- result view ---------- */
function vResult(){
  const r=state.result;if(!r){go("results");return}
  const s=settings();
  const eligible=r.pct>=s.cert;
  const ring=`<div class="score-ring" style="--pct:${r.pct}"><div class="rv">${r.pct}%</div></div>`;
  const review=r.qids.map((qid,i)=>{
    const q=questionById(qid);if(!q)return"";
    const pick=r.answers[i];
    const okQ=pick===q.a,skip=pick===null;
    const revd=inRev(qid);
    const badge=skip?`<span class="badge b-skip">${esc(t("notAttempted"))}</span>`:okQ?`<span class="badge b-ok">✓ ${esc(t("correct"))}</span>`:`<span class="badge b-bad">✗ ${esc(t("wrong"))}</span>`;
    const opts=q.o.map((o,k)=>{
      let cls="";let kk="";
      if(k===q.a){cls="ok";kk="ok"}
      else if(k===pick){cls="bad";kk="bad"}
      return `<div class="opt ${cls}" style="cursor:default"><div class="k ${kk}">${"ABCD"[k]}</div><div>${esc(qOpt(q,k))}</div></div>`;
    }).join("");
    const el=langPair({en:q.e,hi:q.eh});
    return `<div class="rev-item"><div class="rev-h" data-rev="${i}">
        <span>${esc(t("question"))} ${i+1} ${badge}</span>
        <span style="display:flex;gap:10px;align-items:center">
          <button class="pin ${revd?"pin-on":""}" data-pin="${qid}" title="${esc(t("revision"))}">📌</button>▾</span></div>
      <div class="rev-b">
        <div class="q-text">${esc(qText(q))}</div>
        ${q.svg?`<div class="q-svg">${q.svg}</div>`:""}
        ${opts}
        <div style="font-size:13.5px;margin-top:10px"><b>${esc(t("explanation"))}:</b> ${el.show}</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:4px">${esc(t("yourAnswer"))}: ${skip?esc(t("notAttempted")):"ABCD"[pick]} · ${esc(t("correctAnswer"))}: ${"ABCD"[q.a]}</div>
      </div></div>`;
  }).join("");
  renderShell("results",`
    <div class="sect-h"><div><div class="crumb"><b data-cgo="results">${esc(t("myResults"))}</b> › ${esc(r.title)}</div>
      <h2>📊 ${esc(t("result"))} — ${esc(r.title)}</h2></div>
      ${eligible&&!r.noCert?`<button class="btn btn-t" id="resCert">📜 ${esc(t("generateCert"))}</button>`:""}</div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">
        ${ring}
        <div style="flex:1;min-width:220px">
          <h3>${esc(r.name)}</h3>
          <div style="color:var(--ink2);font-size:13.5px">${fmtDate(r.ts)} · ${esc(t("timeTaken"))}: ${fmtMin(Math.round(r.dur/60000))} · ${esc(t("negMarkNote"))}: −${r.neg}</div>
          ${eligible&&!r.noCert?`<div class="alert alert-ok" style="margin-top:12px">🏆 ${esc(t("certEarned"))}</div>`:""}
          ${r.noCert&&r.pct>=s.cert?`<div class="alert alert-info" style="margin-top:12px">🎯 ${esc(t("keepGoing"))}</div>`:""}
        </div></div>
      <div class="stat-cards">
        <div class="stat"><div class="v b">${r.score}/${r.max}</div><div class="l">${esc(t("score"))}</div></div>
        <div class="stat"><div class="v g">${r.correct}</div><div class="l">${esc(t("correct"))}</div></div>
        <div class="stat"><div class="v r">${r.wrong}</div><div class="l">${esc(t("wrong"))}</div></div>
        <div class="stat"><div class="v o">${r.skipped}</div><div class="l">${esc(t("skipped"))}</div></div>
        <div class="stat"><div class="v">${Math.round(r.correct/r.max*100)}%</div><div class="l">${esc(t("accuracy"))}</div></div>
      </div></div>
    <h3 style="margin:22px 0 12px">📝 ${esc(t("viewSolutions"))}</h3>
    ${review}`);
  document.querySelectorAll("[data-rev]").forEach(h=>h.onclick=e=>{if(e.target.closest("[data-pin]"))return;h.parentElement.classList.toggle("open")});
  document.querySelectorAll("[data-pin]").forEach(b=>b.onclick=e=>{e.stopPropagation();const on=toggleRev(b.dataset.pin);b.classList.toggle("pin-on",on)});
  const c=$("#resCert");if(c)c.onclick=()=>openCertFlow();
}
</script>

<script>
/* ================= ADMIN PANEL (part 1) ================= */
function vAdmin(){
  if(!(state.user&&(state.user.role==="admin"||state.user.role==="teacher"))){toast(t("needAdmin"));go("dashboard");return}
  const tabs=[["overview","📈 "+t("overview")],["students","👥 "+t("students")],["chapters","📚 "+t("chaptersTab")],["questions","❓ "+t("questionsTab")],["results","🏆 "+t("resultsTab")],["logs","📜 "+t("logsTab")],["settings","⚙️ "+t("settingsTab")],["deploy","🚀 "+t("deployTab")]];
  renderShell("admin",`
    <div class="sect-h"><h2>🛠️ ${esc(t("adminPanel"))}</h2>
      <span class="badge b-info">${esc(state.user.name)} · ${esc(state.user.role)}</span></div>
    <div class="admin-nav">${tabs.map(([id,lb])=>`<button class="tab ${state.adminTab===id?"on":""}" data-atab="${id}">${lb}</button>`).join("")}</div>
    <div id="adminBody"></div>`);
  document.querySelectorAll("[data-atab]").forEach(b=>b.onclick=()=>{state.adminTab=b.dataset.atab;vAdmin()});
  const B={overview:admOverview,students:admStudents,chapters:admChapters,questions:admQuestions,results:admResults,logs:admLogs,settings:admSettings,deploy:admDeploy};
  (B[state.adminTab]||admOverview)();
}

function admOverview(){
  const res=DB.get("results",[]);const us=users().filter(u=>u.role==="student");
  const nQ=allQuestions().length;const nCh=allChapters().length;
  const avg=res.length?Math.round(res.reduce((a,r)=>a+r.pct,0)/res.length*10)/10:0;
  const perSubj=SUBJECTS.map(s=>{
    const rs=res.filter(r=>r.s===s.id);const a=rs.length?Math.round(rs.reduce((x,r)=>x+r.pct,0)/rs.length):0;
    return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700"><span>${s.icon} ${esc(s.name)}</span><span>${rs.length} ${esc(t("attempts"))} · ${a}%</span></div>
      <div style="background:#e8eefb;border-radius:99px;height:9px;margin-top:4px"><div style="width:${a}%;background:linear-gradient(90deg,${s.grad[0]},${s.grad[1]});height:9px;border-radius:99px"></div></div></div>`;
  }).join("");
  const recent=DB.get("logs",[]).slice(-8).reverse().map(l=>`<tr><td style="white-space:nowrap">${fmtDate(l.ts)}</td><td><b>${esc(l.u)}</b></td><td><span class="log-a">${esc(l.a)}</span></td><td>${esc(l.d).slice(0,60)}</td></tr>`).join("");
  renderAdminBody(`<div class="stat-cards" style="margin-top:0">
      <div class="stat"><div class="v b">${us.length}</div><div class="l">${esc(t("totalStudents"))}</div></div>
      <div class="stat"><div class="v g">${nQ}</div><div class="l">${esc(t("totalQuestions"))}</div></div>
      <div class="stat"><div class="v o">${nCh}</div><div class="l">${esc(t("chaptersTab"))}</div></div>
      <div class="stat"><div class="v">${res.length}</div><div class="l">${esc(t("totalAttempts"))}</div></div>
      <div class="stat"><div class="v g">${avg}%</div><div class="l">${esc(t("avgScore"))}</div></div>
    </div>
    <div class="grid g2">
      <div class="card"><h3 style="margin-bottom:14px">📊 ${esc(t("subjectWise"))}</h3>${perSubj}</div>
      <div class="card"><h3 style="margin-bottom:10px">🕘 ${esc(t("recentActivity"))}</h3>
        <div class="tbl-wrap"><table class="tbl" style="min-width:0"><tbody>${recent||'<tr><td>'+esc(t("noneYet"))+'</td></tr>'}</tbody></table></div></div>
    </div>`);
}

  const rows=list.map(u=>`<tr>
    <td><b>${esc(u.name)}</b><br><span style="font-size:11.5px;color:var(--muted)">${esc(u.email)}</span></td>
    <td><span class="badge ${u.role==="admin"?"b-info":"b-skip"}">${esc(u.role)}</span>${u.role==="student"&&u.xp?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${levelOf(u.xp)[2]} ${u.xp} XP</div>`:""}</td>
    <td style="font-size:12px">${u.exam?`<span class="badge b-info" style="white-space:normal;text-align:left">🎯 ${esc(u.exam)}</span>`:"—"}</td>
    <td style="font-size:11.5px">${(u.targets&&u.targets.length)?u.targets.map(id=>{const s=subjById(id);return s?`<span class="status st-sub" title="${esc(s.name)}">${s.icon} ${esc(s.name.split(" ")[0])}</span>`:""}).join(" "):"—"}</td>

    <td style="font-size:12px">${fmtDate(u.created)}</td>
    <td style="font-size:12px">${u.lastLogin?fmtDate(u.lastLogin):"—"}</td>
    <td><div class="act">
      <button class="mini ${u.status==="active"?"dz":"gn"}" data-tog="${u.id}">${u.status==="active"?esc(t("disabled")):esc(t("active"))}</button>
      <button class="mini" data-rpw="${u.id}">${esc(t("resetPwd"))}</button>
      ${u.id!==state.user.id?`<button class="mini dz" data-del="${u.id}">${esc(t("delete"))}</button>`:""}
    </div></td></tr>`).join("");
  renderAdminBody(`<div class="filters">
      <input class="inp" id="stSearch" placeholder="${esc(t("search"))}" value="${esc(window._stq||"")}">
      <button class="btn btn-p btn-s" id="stAdd">＋ ${esc(t("studentReg"))}</button>
    </div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(t("name"))}</th><th>${esc(t("role"))}</th><th>🎯 ${esc(t("examTarget"))}</th><th>📚 ${esc(t("mySubjects"))}</th><th>${esc(t("status"))}</th><th>${esc(t("registered"))}</th><th>${esc(t("lastLogin"))}</th><th>${esc(t("actions"))}</th></tr></thead><tbody>${rows||""}</tbody></table></div>
    ${list.length===0?`<div class="empty">${esc(t("noneYet"))}</div>`:""}`);
  $("#stSearch").oninput=e=>{window._stq=e.target.value;admStudents()};
  $("#stAdd").onclick=()=>{
    openModal(`<h3>＋ ${esc(t("studentReg"))}</h3><div id="adErr"></div>
      <div class="field"><label>${esc(t("fullName"))}</label><input class="inp" id="adName"></div>
      <div class="field"><label>${esc(t("email"))}</label><input class="inp" id="adEmail"></div>
      <div class="field"><label>${esc(t("password"))}</label><input class="inp" id="adPass" placeholder="min 6"></div>
      <div class="modal-foot"><button class="btn btn-g btn-s" onclick="closeModal()">${esc(t("cancel"))}</button><button class="btn btn-p btn-s" id="adSave">${esc(t("save"))}</button></div>`);
    $("#adSave").onclick=async()=>{
      const n=$("#adName").value.trim(),e=$("#adEmail").value.trim(),p=$("#adPass").value;
      if(!n||!e||p.length<6){$("#adErr").innerHTML=`<div class="alert alert-err">${esc(t("fillAll"))}</div>`;return}
      if(findUser(e)){$("#adErr").innerHTML=`<div class="alert alert-err">${esc(t("emailExists"))}</div>`;return}
      const u=await registerUser(n,e,p,"student");log("ADMIN_ADD_STUDENT",e);closeModal();toast(t("saved"));admStudents();
    };
  };
  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{
    const l=users();const u=l.find(x=>x.id===b.dataset.tog);u.status=u.status==="active"?"disabled":"active";DB.set("users",l);
    log("ADMIN_TOGGLE_USER",u.email+" → "+u.status);admStudents();
  });
  document.querySelectorAll("[data-rpw]").forEach(b=>b.onclick=async()=>{
    const l=users();const u=l.find(x=>x.id===b.dataset.rpw);
    const np="asjbc"+Math.floor(1000+Math.random()*9000);
    u.pass=await hashPass(np);DB.set("users",l);
    log("ADMIN_RESET_PWD",u.email);openModal(`<h3>🔑 ${esc(t("resetPwd"))}</h3><p>${esc(u.name)} (${esc(u.email)}) — ${esc(t("newPassword"))}:</p><p style="font-size:20px;font-weight:800;color:var(--brand);user-select:all">${np}</p><div class="modal-foot"><button class="btn btn-p btn-s" onclick="closeModal()">OK</button></div>`);
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const u=users().find(x=>x.id===b.dataset.del);
    confirmBox(u.name+" ("+u.email+")",()=>{DB.set("users",users().filter(x=>x.id!==u.id));log("ADMIN_DELETE_USER",u.email);toast(t("saved"));admStudents()});
  });

function admResults(){
  const res=DB.get("results",[]).sort((a,b)=>b.ts-a.ts);
  const rows=res.slice(0,200).map(r=>`<tr><td>${fmtDate(r.ts)}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.title)}</td><td>${r.score}/${r.max}</td><td><b>${r.pct}%</b></td><td>${r.correct}✓ ${r.wrong}✗ ${r.skipped}—</td></tr>`).join("");
  renderAdminBody(`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(t("date"))}</th><th>${esc(t("student"))}</th><th>${esc(t("attempt"))}</th><th>${esc(t("score"))}</th><th>${esc(t("percent"))}</th><th>✓✗—</th></tr></thead><tbody>${rows||""}</tbody></table></div>
  ${!res.length?`<div class="empty">${esc(t("noneYet"))}</div>`:""}`);
}

function admLogs(){
  const fq=window._lgq||"",fa=window._lga||"all";
  const logs=DB.get("logs",[]).slice().reverse();
  const actions=[...new Set(logs.map(l=>l.a))];
  const list=logs.filter(l=>(!fa||fa==="all"||l.a===fa)&&(!fq||JSON.stringify(l).toLowerCase().includes(fq.toLowerCase()))).slice(0,300);
  const csv="Date,User,Role,Action,Detail\n"+logs.map(l=>[new Date(l.ts).toISOString(),l.u,l.r,l.a,'"'+String(l.d).replace(/"/g,'""')+'"'].join(",")).join("\n");
  renderAdminBody(`<div class="filters">
      <input class="inp" id="lgSearch" placeholder="${esc(t("search"))}" value="${esc(fq)}">
      <select class="inp" id="lgAction"><option value="all">${esc(t("all"))}</option>${actions.map(a=>`<option ${a===fa?"selected":""}>${esc(a)}</option>`).join("")}</select>
      <a class="btn btn-g btn-s" download="asjbcm_activity_logs.csv" href="data:text/csv;charset=utf-8,${encodeURIComponent(csv)}">⬇ ${esc(t("exportCsv"))}</a>
      <span style="font-size:12px;color:var(--muted)">${logs.length} entries (max 2500)</span>
    </div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(t("date"))}</th><th>${esc(t("name"))}</th><th>${esc(t("role"))}</th><th>${esc(t("actions"))}</th><th>${esc(t("explanation"))}</th></tr></thead>
    <tbody>${list.map(l=>`<tr><td style="white-space:nowrap">${fmtDate(l.ts)}</td><td><b>${esc(l.u)}</b></td><td>${esc(l.r)}</td><td><span class="log-a">${esc(l.a)}</span></td><td>${esc(l.d)}</td></tr>`).join("")}</tbody></table></div>`);
  $("#lgSearch").oninput=e=>{window._lgq=e.target.value;admLogs();const s=$("#lgSearch");s.focus();s.setSelectionRange(s.value.length,s.value.length)};
  $("#lgAction").onchange=e=>{window._lga=e.target.value;admLogs()};
}

function renderAdminBody(html){$("#adminBody").innerHTML=html}
</script>

<script>
/* ================= ADMIN PANEL (part 2) ================= */
function admChapters(){
  const sid=window._chSubj||SUBJECTS[0].id;
  const chs=chaptersOf(sid);
  const rows=chs.map((c,i)=>{
    const added=DB.get("chadd",[]).some(a=>a.id===c.id);
    const qs=questionsOf(c.id).length;
    return `<tr><td><b>${c.icon||""} ${esc(c.t)}</b><br><span style="font-size:11.5px;color:var(--muted)">${esc(c.th||"")}</span></td>
      <td>${qs}</td><td><span class="badge ${added?"b-ok":"b-skip"}">${added?"added":"built-in"}</span></td>
      <td><div class="act"><button class="mini" data-ech="${c.id}">${esc(t("edit"))}</button>
      <button class="mini dz" data-dch="${c.id}">${esc(t("delete"))}</button></div></td></tr>`;
  }).join("");
  renderAdminBody(`<div class="filters">
      <select class="inp" id="chSubjSel">${SUBJECTS.map(s=>`<option value="${s.id}" ${s.id===sid?"selected":""}>${s.icon} ${esc(s.name)}</option>`).join("")}</select>
      <button class="btn btn-p btn-s" id="chAdd">＋ ${esc(t("addChapter"))}</button>
    </div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(t("chapter"))}</th><th>${esc(t("totalQuestions"))}</th><th>${esc(t("status"))}</th><th>${esc(t("actions"))}</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  $("#chSubjSel").onchange=e=>{window._chSubj=e.target.value;admChapters()};
  $("#chAdd").onclick=()=>chapterForm(null,sid);
  document.querySelectorAll("[data-ech]").forEach(b=>b.onclick=()=>chapterForm(chapterById(b.dataset.ech),sid));
  document.querySelectorAll("[data-dch]").forEach(b=>b.onclick=()=>{
    const c=chapterById(b.dataset.dch);
    confirmBox(c.t+" (+"+questionsOf(c.id).length+" "+t("questionCount")+")",()=>{
      const add=DB.get("chadd",[]);
      if(add.some(a=>a.id===c.id))DB.set("chadd",add.filter(a=>a.id!==c.id));
      else{const tb=DB.get("tomb_ch",[]);tb.push(c.id);DB.set("tomb_ch",tb)}
      const qtb=DB.get("tomb_q",[]);questionsOf(c.id).forEach(q=>{if(!qtb.includes(q.id))qtb.push(q.id)});DB.set("tomb_q",qtb);
      log("ADMIN_DELETE_CHAPTER",c.t);toast(t("saved"));admChapters();
    });
  });
}
function chapterForm(ch,sid){
  const isEdit=!!ch;
  const isAddCh=isEdit&&DB.get("chadd",[]).some(a=>a.id===ch.id);
  const val=k=>ch?esc(ch[k]||""):"";
  const notesLabel=isAddCh?"Study material (English) — plain text, blank line = new paragraph":"Study material — HTML source (editable, keep tags to preserve formatting)";
  openModal(`<h3>${isEdit?esc(t("editChapter")):esc(t("addChapter"))}</h3>
    <div class="form-row">
      <div class="field"><label>${esc(t("subject"))}</label>
        <select class="inp" id="cfSubj">${SUBJECTS.map(s=>`<option value="${s.id}" ${(ch?ch.s:sid)===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Icon (emoji)</label><input class="inp" id="cfIcon" value="${ch?esc(ch.icon||"📘"):"📘"}"></div>
    </div>
    <div class="field"><label>Title (English) *</label><input class="inp" id="cfT" value="${val("t")}"></div>
    <div class="field"><label>शीर्षक (हिन्दी)</label><input class="inp" id="cfTh" value="${val("th")}"></div>
    <div class="field"><label>${notesLabel}</label><textarea class="inp" id="cfNE" style="min-height:110px">${ch?esc(chNotesText(ch,"en",!isAddCh)):""}</textarea></div>
    <div class="field"><label>${esc(t("studyMaterial"))} (हिन्दी)${isAddCh?"":" — HTML source"}</label><textarea class="inp" id="cfNH" style="min-height:90px">${ch?esc(chNotesText(ch,"hi",!isAddCh)):""}</textarea></div>
    <div class="field"><label>${esc(t("guidance"))} tips (English) — one per line</label><textarea class="inp" id="cfGE">${ch?esc((ch.guide&&ch.guide.en||[]).join("\n")):""}</textarea></div>
    <div class="field"><label>${esc(t("guidance"))} (हिन्दी) — one per line</label><textarea class="inp" id="cfGH">${ch?esc((ch.guide&&ch.guide.hi||[]).join("\n")):""}</textarea></div>
    <div class="modal-foot"><button class="btn btn-g btn-s" onclick="closeModal()">${esc(t("cancel"))}</button><button class="btn btn-p btn-s" id="cfSave">${esc(t("save"))}</button></div>`);
  $("#cfSave").onclick=()=>{
    const sub=$("#cfSubj").value,T=$("#cfT").value.trim();
    if(!T){toast(t("fillAll"));return}
    const notesText=txt=>txt.split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,"<br>")}</p>`).join("");
    const notesEN=isAddCh?notesText($("#cfNE").value):sanitizeHTML($("#cfNE").value);
    const notesHI=isAddCh?notesText($("#cfNH").value):sanitizeHTML($("#cfNH").value);
    const data={s:$("#cfSubj").value,icon:$("#cfIcon").value.trim()||"📘",t:T,th:$("#cfTh").value.trim(),
      notes:{en:notesEN,hi:notesHI},
      guide:{en:$("#cfGE").value.split("\n").map(x=>x.trim()).filter(Boolean),hi:$("#cfGH").value.split("\n").map(x=>x.trim()).filter(Boolean)}};
    if(isEdit){
      if(DB.get("chadd",[]).some(a=>a.id===ch.id)){const add=DB.get("chadd",[]);const i=add.findIndex(a=>a.id===ch.id);add[i]=Object.assign({},ch,data);DB.set("chadd",add)}
      else{const ov=DB.get("ov_ch",{});ov[ch.id]=Object.assign({},ov[ch.id]||{},data);DB.set("ov_ch",ov)}
      log("ADMIN_EDIT_CHAPTER",T);
    }else{
      const add=DB.get("chadd",[]);add.push(Object.assign({id:uid("ch")},data));DB.set("chadd",add);
      log("ADMIN_ADD_CHAPTER",T);
    }
    closeModal();toast(t("saved"));admChapters();
  };
}
function chNotesText(ch,lang,asHTML){
  const html=(ch.notes&&ch.notes[lang])||"";
  if(asHTML)return html;
  return html.replace(/<\/p>/g,"\n\n").replace(/<br\s*\/?>/g,"\n").replace(/<li>/g,"• ").replace(/<\/li>/g,"\n").replace(/<[^>]+>/g,"").trim();
}
function sanitizeHTML(s){return String(s).replace(/<script[\s\S]*?<\/script>/gi,"").replace(/\son\w+\s*=/gi," data-")}

/* ---------- questions ---------- */
function admQuestions(){
  const sid=window._qSubj||SUBJECTS[0].id;
  const cid=window._qChap||"all";
  const srch=(window._qSearch||"").toLowerCase();
  let qs=questionsOfSubject(sid);
  if(cid!=="all")qs=qs.filter(q=>q.c===cid);
  if(srch)qs=qs.filter(q=>q.q.toLowerCase().includes(srch));
  qs=qs.slice(0,300);
  const added=DB.get("qadd",[]);
  const rows=qs.map(q=>{
    const ch=chapterById(q.c);
    const isAdd=added.some(a=>a.id===q.id);
    return `<tr><td style="max-width:380px">${esc(q.q.replace(/<[^>]+>/g,"")).slice(0,110)}${q.q.length>110?"…":""}</td>
      <td>${ch?esc(ch.t):"—"}</td><td>${q.svg?"🖼️":"—"}</td><td><span class="badge ${isAdd?"b-ok":"b-skip"}">${isAdd?"added":"built-in"}</span></td>
      <td><div class="act"><button class="mini" data-eq="${q.id}">${esc(t("edit"))}</button><button class="mini dz" data-dq="${q.id}">${esc(t("delete"))}</button></div></td></tr>`;
  }).join("");
  renderAdminBody(`<div class="filters">
      <select class="inp" id="qSubjSel">${SUBJECTS.map(s=>`<option value="${s.id}" ${s.id===sid?"selected":""}>${s.icon} ${esc(s.name)}</option>`).join("")}</select>
      <select class="inp" id="qChapSel"><option value="all">${esc(t("all"))}</option>${chaptersOf(sid).map(c=>`<option value="${c.id}" ${c.id===cid?"selected":""}>${esc(c.t)}</option>`).join("")}</select>
      <input class="inp" id="qSearch" placeholder="${esc(t("search"))}" value="${esc(window._qSearch||"")}">
      <button class="btn btn-p btn-s" id="qAdd">＋ ${esc(t("addQuestion"))}</button>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${qs.length} shown · ${questionsOfSubject(sid).length} in subject · <b>${allQuestions().length}</b> total</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(t("question"))}</th><th>${esc(t("chapter"))}</th><th>SVG</th><th>${esc(t("status"))}</th><th>${esc(t("actions"))}</th></tr></thead><tbody>${rows}</tbody></table></div>`);
  $("#qSubjSel").onchange=e=>{window._qSubj=e.target.value;window._qChap="all";admQuestions()};
  $("#qChapSel").onchange=e=>{window._qChap=e.target.value;admQuestions()};
  $("#qSearch").oninput=e=>{window._qSearch=e.target.value;admQuestions();const s=$("#qSearch");s.focus();s.setSelectionRange(s.value.length,s.value.length)};
  $("#qAdd").onclick=()=>questionForm(null,sid,cid==="all"?null:cid);
  document.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>questionForm(questionById(b.dataset.eq),sid));
  document.querySelectorAll("[data-dq]").forEach(b=>b.onclick=()=>{
    const q=questionById(b.dataset.dq);
    confirmBox(q.q.replace(/<[^>]+>/g,"").slice(0,80),()=>{
      const add=DB.get("qadd",[]);
      if(add.some(a=>a.id===q.id))DB.set("qadd",add.filter(a=>a.id!==q.id));
      else{const tb=DB.get("tomb_q",[]);tb.push(q.id);DB.set("tomb_q",tb)}
      log("ADMIN_DELETE_QUESTION",q.q.replace(/<[^>]+>/g,"").slice(0,60));toast(t("saved"));admQuestions();
    });
  });
}
function questionForm(q,sid,presetChap){
  const isEdit=!!q;
  const opts=q?q.o:["","","",""];const optsH=q?(q.oh||["","","",""]):["","","",""];
  openModal(`<h3>${isEdit?esc(t("editQuestion")):esc(t("addQuestion"))}</h3><div style="max-height:56vh;overflow:auto;padding-right:4px">
    <div class="form-row">
      <div class="field"><label>${esc(t("subject"))}</label><select class="inp" id="qfSubj">${SUBJECTS.map(s=>`<option value="${s.id}" ${(q?q.s:sid)===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
      <div class="field"><label>${esc(t("chapter"))}</label><select class="inp" id="qfChap"></select></div>
    </div>
    <div class="field"><label>${esc(t("questionText"))} *</label><textarea class="inp" id="qfQ">${q?esc(q.q):""}</textarea></div>
    <div class="field"><label>${esc(t("questionTextH"))}</label><textarea class="inp" id="qfQH">${q?esc(q.qh||""):""}</textarea></div>
    <div class="form-row">
      ${[0,1,2,3].map(k=>`<div class="field"><label>${esc(t("options"))} ${"ABCD"[k]}</label><input class="inp" id="qfO${k}" value="${esc(opts[k]||"")}"></div>`).join("")}
    </div>
    <div class="form-row">

<script>

      <button class="btn btn-g btn-s" id="lrRev">📌 ${esc(t("revision"))}${myRev().length?" ("+myRev().length+")":""}</button></div>
    <div class="alert alert-info">📘 <b>${state.lang==="hi"?"कैसे पढ़ें:":"How to learn:"}</b> ${state.lang==="hi"
      ?"प्रत्येक विषय के अध्याय क्रम से पढ़ें → नोट्स पढ़ें (+10 XP) → फ़्लैशकार्ड से दोहराएँ → अभ्यास करें → अध्याय टेस्ट पास करें। रोज़ दैनिक चैलेंज भूलें नहीं!"
      :"Follow each subject in order: read the notes (+10 XP) → revise with flashcards → practise with instant answers → clear the chapter test. Don't break your daily challenge streak!"}</div>
    <div class="grid g3">${cards}</div>`);
  document.querySelectorAll("[data-sub]").forEach(c=>c.onclick=()=>go("subject",c.dataset.sub));

/* ---------- daily challenge ---------- */
function startDaily(){
  const u=state.user;
  const daily=DB.get("daily_"+u.id,null);
  if(daily&&daily.date===todayStr()){go("daily");return}
  const tg=userTargets();
  let pool=allQuestions().filter(q=>tg.includes(q.s)).map(q=>q.id);
  if(pool.length<10)pool=allQuestions().map(q=>q.id);
  if(!pool.length){toast("No questions available");return}
  beginTest({title:t("dailyTitle"),sid:"mix",qids:shuffle(pool).slice(0,10),mins:8,neg:0,daily:true});
}
function vDaily(){
  const u=state.user;
  const daily=DB.get("daily_"+u.id,null);
  const doneToday=daily&&daily.date===todayStr();
  const week=[];
  for(let i=6;i>=0;i--){
    const d=new Date(Date.now()-i*864e5).toLocaleDateString("en-CA");
    const rec=DB.get("daily_"+u.id,null);
    week.push(`<div class="dwd ${doneToday&&i===0?"today":""}"><div class="dwc ${rec&&rec.date===d?"on":""}">${rec&&rec.date===d?"✅":""}</div><div class="dwl">${new Date(Date.now()-i*864e5).toLocaleDateString(undefined,{weekday:"narrow"})}</div></div>`);
  }
  renderShell("daily",`
    <div class="sect-h"><h2>🎯 ${esc(t("daily"))}</h2></div>
    <div class="daily-hero">
      <div class="dh-ic">🔥</div>
      <div class="dh-body">
        <h2>${u.streak||0} ${esc(t("streakDays"))}</h2>
        <p>${doneToday?esc(t("dailyDone"))+" — "+daily.correct+"/"+daily.total+" ("+daily.pct+"%)":esc(t("noDaily"))}</p>
        <p style="font-size:12.5px;opacity:.85">${esc(t("dailyCome"))}</p>
      </div>
      <button class="btn btn-w" id="dGo" ${doneToday?"disabled":""}>${doneToday?"✅ "+esc(t("dailyDone")):esc(t("startDaily"))} →</button>
    </div>
    <div class="card"><h3 style="margin-bottom:12px">📅 ${state.lang==="hi"?"इस सप्ताह":"This week"}</h3>
      <div class="dweek">${week.join("")}</div></div>
    <div class="card"><h3 style="margin-bottom:10px">🧠 ${esc(t("xpNote"))}</h3>
      <div class="xp-grid">
        <div class="xp-item">📖 ${esc(t("notesViewed"))}<b>+10 XP</b></div>
        <div class="xp-item">✍️ ${esc(t("practised"))}<b>+10–30 XP</b></div>
        <div class="xp-item">⏱️ ${esc(t("chapterTest"))}<b>+20+ XP</b></div>
        <div class="xp-item">🎯 ${esc(t("daily"))}<b>+15 XP</b></div>
      </div>
      <div class="lv-path">${LEVELS.map(l=>`<span class="lv-node ${((state.user.xp||0)>=l[0])?"on":""}">${l[2]} ${l[1]}</span>`).join("")}</div>
    </div>`);
  $("#dGo").onclick=startDaily;
}

/* ---------- flashcards ---------- */
function fcBody(ch){
  if(!state.fc||state.fc.ch!==ch.id){
    const qs=questionsOf(ch.id);
    state.fc={ch:ch.id,i:0,order:shuffle(qs.map(q=>q.id)),flip:false};
  }
  const F=state.fc;
  if(!F.order.length)return `<div class="card empty">${esc(t("noneYet"))}</div>`;
  const q=questionById(F.order[F.i]);
  const Lq=langPair({en:q.q,hi:q.qh});
  const ans=q.o[q.a];const ansH=q.oh&&q.oh[q.a]?q.oh[q.a]:ans;
  const el=langPair({en:q.e,hi:q.eh});
  const revd=inRev(q.id);
  return `<div class="card">
    <div class="q-head"><span class="q-num">🃏 ${esc(t("qFlash"))} ${F.i+1} ${esc(t("of"))} ${F.order.length}</span>
      <span style="display:flex;gap:8px">
        <button class="btn btn-g btn-s" id="fcShuffle">🔀 ${esc(t("shuffle"))}</button>
        <button class="btn btn-g btn-s ${revd?"pin-on":""}" id="fcPin">📌</button>
      </span></div>
    <p class="hint" style="margin-bottom:10px">${esc(t("flipHint"))}</p>
    <div class="fc-scene" id="fcCard"><div class="fc-inner ${F.flip?"flipped":""}">
      <div class="fc-face fc-front"><div class="fc-q">${Lq.show}</div><div class="fc-hint">👆 ${esc(t("flipHint"))}</div></div>
      <div class="fc-face fc-back"><div class="fc-a">✅ ${esc(ans)}</div><div class="fc-e">${el.show}</div></div>
    </div></div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
      <button class="btn btn-g" id="fcPrev" ${F.i===0?"disabled":""}>← ${esc(t("prev"))}</button>
      <button class="btn btn-p" id="fcNext">${F.i+1>=F.order.length?esc(t("finish")):esc(t("next"))} →</button>
    </div></div>`;
}
function bindFc(ch){
  const card=$("#fcCard");if(card)card.onclick=()=>{state.fc.flip=!state.fc.flip;card.querySelector(".fc-inner").classList.toggle("flipped",state.fc.flip)};
  const nx=$("#fcNext");if(nx)nx.onclick=()=>{if(state.fc.i<state.fc.order.length-1){state.fc.i++;state.fc.flip=false}else{state.tab="practice"};go("chapter",ch.id,true)};
  const pv=$("#fcPrev");if(pv)pv.onclick=()=>{if(state.fc.i>0){state.fc.i--;state.fc.flip=false}go("chapter",ch.id,true)};
  const sh=$("#fcShuffle");if(sh)sh.onclick=()=>{state.fc.order=shuffle(state.fc.order);state.fc.i=0;state.fc.flip=false;go("chapter",ch.id,true)};
  const pin=$("#fcPin");if(pin)pin.onclick=()=>{const q=questionById(state.fc.order[state.fc.i]);toggleRev(q.id);go("chapter",ch.id,true)};
}

  renderShell("dashboard",`

    <div class="card">${rows||`<div class="empty">${esc(t("noneYet"))}</div>`}</div>`);
}
</script>

<script>

    <div class="lb-score">${r.pct}%</div></div>`).join("");
  renderShell("leaderboard",`
    <div class="sect-h"><h2>🏅 ${esc(t("leaderboard"))} — ${esc(t("topPerformers"))}</h2></div>
    <div class="tabs">
      <button class="tab ${tab==="all"?"on":""}" data-lb="all">🌐 ${esc(t("all"))}</button>

function openCertFlow(){
  const r=state.result;if(!r)return;
  const s=settings();
  const certs=DB.get("certs",[]);
  const existing=certs.find(c=>c.rid===r.id);
  if(existing){state.view="cert";showCert(existing);return}
  const cert={id:"ASJ-"+Math.random().toString(36).slice(2,8).toUpperCase(),rid:r.id,uid:r.uid,name:r.name,s:r.s,title:r.title,score:r.score,max:r.max,pct:r.pct,date:r.ts};
  certs.push(cert);DB.set("certs",certs);
  log("CERT_GENERATED",cert.id+" — "+r.title);
  state.view="cert";showCert(cert);
}

function vCerts(){
  const u=state.user;const s=settings();
  const myRes=DB.get("results",[]).filter(r=>r.uid===u.id&&r.pct>=s.cert&&!r.noCert).sort((a,b)=>b.ts-a.ts);
  const certs=DB.get("certs",[]).filter(c=>c.uid===u.id);
  renderShell("certs",`
    <div class="sect-h"><h2>📜 ${esc(t("certificates"))}</h2>
      <button class="btn btn-g btn-s" id="verifyBtn">🔍 ${esc(t("verifyCert"))}</button></div>
    ${myRes.length?`<div class="grid g3">${myRes.map(r=>{
      const c=DB.get("certs",[]).find(x=>x.rid===r.id);
      return `<div class="card" style="display:flex;flex-direction:column;gap:10px">
        <div><b>${esc(r.title)}</b><br><span style="font-size:12.5px;color:var(--muted)">${fmtDate(r.ts)}</span></div>
        <div class="stat-cards" style="margin:0"><div class="stat" style="padding:8px"><div class="v" style="font-size:18px">${r.pct}%</div><div class="l">${esc(t("score"))}</div></div></div>
        ${c?`<button class="btn btn-t btn-s" data-show="${c.id}">📜 ${esc(t("view"))} — ${c.id}</button>`:`<button class="btn btn-p btn-s" data-gen="${r.id}">🏆 ${esc(t("generateCert"))}</button>`}
      </div>`;}).join("")}</div>`
    :`<div class="card empty"><div class="e-ic">📜</div>${esc(t("noCerts"))}</div>`}
    <div class="card" style="margin-top:18px"><p style="font-size:12.5px;color:var(--muted)">${esc(t("verifyHint"))}</p></div>`);
  document.querySelectorAll("[data-gen]").forEach(b=>b.onclick=()=>{state.result=DB.get("results",[]).find(r=>r.id===b.dataset.gen);openCertFlow()});
  document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{const c=DB.get("certs",[]).find(x=>x.id===b.dataset.show);state.view="cert";showCert(c)});
  $("#verifyBtn").onclick=verifyDialog;
}
function verifyDialog(prefill){
  openModal(`<h3>🔍 ${esc(t("verifyCert"))}</h3>
    <p class="hint" style="margin-bottom:10px">${esc(t("verifyHint"))}</p>
    <div class="field"><label>${esc(t("certId"))}</label><input class="inp" id="vCertId" placeholder="ASJ-XXXXXX" value="${esc(prefill||"")}" style="text-transform:uppercase"></div>
    <div id="vOut"></div>
    <div class="modal-foot"><button class="btn btn-g btn-s" onclick="closeModal()">${esc(t("close"))}</button><button class="btn btn-p btn-s" id="vGo">${esc(t("verifyCert"))}</button></div>`);
  $("#vGo").onclick=()=>{
    const id=$("#vCertId").value.trim().toUpperCase();
    const c=DB.get("certs",[]).find(x=>x.id===id);
    $("#vOut").innerHTML=c
      ?`<div class="alert alert-ok">✅ ${esc(t("verified"))}<br><b>${esc(c.name)}</b> — ${esc(c.title)}<br>${esc(t("score"))}: ${c.score}/${c.max} (${c.pct}%) · ${fmtDate(c.date)}<br><span style="font-size:11.5px">${esc(t("certId"))}: ${c.id}</span></div>`
      :`<div class="alert alert-err">❌ ${esc(t("notVerified"))}</div>`;
    log("CERT_VERIFY",(id)+" → "+(c?"valid":"invalid"));
  };
  $("#vCertId").onkeydown=e=>{if(e.key==="Enter")$("#vGo").click()};
}

/* ================= BOOTSTRAP ================= */
(function(){
  /* settings defaults */
  if(!DB.get("settings",null))DB.set("settings",SETTINGS_DEF);
  /* session restore */
  const sid=DB.get("session",null);
  if(sid){const u=users().find(x=>x.id===sid);if(u&&u.status==="active")state.user=u;else DB.set("session",null)}
  /* cert verification deep-link */
  const certParam=new URLSearchParams(location.search).get("cert");
  const start=()=>{
    if(!users().length){go("firstRun");return}
    if(!state.user){go("login");return}
    if(certParam){verifyDialog(certParam);state.view="dashboard";go("dashboard");return}
    go("dashboard");
  };
  if(certParam&&!state.user){ /* allow guest verify from QR */
    renderShell("",`<div style="height:40px"></div>`);
    setTimeout(()=>{verifyDialog(certParam)},50);
    /* still show normal shell after closing */
    const origClose=closeModal;
    closeModal=function(){origClose();if(state.user)go("dashboard");else if(users().length)go("login");else go("firstRun")};
    return;
  }
  start();
})();
</script>

<script>
/* ================= QR CODE GENERATOR (ISO/IEC 18004) =================
   Byte mode, ECC level M, versions 1-10, Reed-Solomon over GF(256).
   Output: SVG string for embedding in certificates. */
const QRCode=(function(){
  /* --- level M tables, versions 1..10 --- */
  const ECC_PER_BLOCK=[10,16,26,18,24,16,18,22,22,26];
  const NUM_BLOCKS   =[1,1,1,2,2,4,4,4,5,5];
  const TOTAL_CODEWORDS=[26,44,70,100,134,172,196,242,292,346];
  const ALIGN=[null,[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const FORMAT_BITS_M=[0x5412,0x5125,0x5E7C,0x5B4B,0x45F9,0x40CE,0x4F97,0x4AA0];
  const VERSION_INFO=[null,null,null,null,null,null,0x07C94,0x085BC,0x09A99,0x0A4D3]; /* index = version-1 */

  /* --- GF(256) arithmetic, modulus 0x11D --- */
  const EXP=new Array(512),LOG=new Array(256);
  (function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}
    for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
  const gmul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];

  function rsGeneratorPoly(degree){
    let poly=[1];
    for(let i=0;i<degree;i++){
      const next=new Array(poly.length+1).fill(0);
      for(let j=0;j<poly.length;j++){next[j]^=poly[j];next[j+1]^=gmul(poly[j],EXP[i]);}
      poly=next;
    }
    return poly; /* highest degree first */
  }
  function rsRemainder(data,degree){
    const gen=rsGeneratorPoly(degree);
    const res=new Array(degree).fill(0);
    for(const b of data){
      const factor=b^res[0];
      res.shift();res.push(0);
      for(let i=0;i<degree;i++)res[i]^=gmul(gen[i+1],factor);
    }
    return res;
  }

  function encodeBytes(data,forceVer,forceMask){
    /* choose version */
    let ver=forceVer||0;
    if(!ver){
      for(let v=1;v<=10;v++){
        const ccBits=v<10?8:16;
        const capBits=TOTAL_CODEWORDS[v-1]*8
          - (NUM_BLOCKS[v-1]*ECC_PER_BLOCK[v-1])*8
          - 4 - ccBits; /* mode + count */
        /* need data.length*8 + terminator(<=4) + paddingToByte */
        if(data.length*8+4<=capBits){ver=v;break}
      }
      if(!ver)throw new Error("Data too long for QR v10-M");
    } else {
      const ccBits=ver<10?8:16;
      const capBits=TOTAL_CODEWORDS[ver-1]*8-(NUM_BLOCKS[ver-1]*ECC_PER_BLOCK[ver-1])*8-4-ccBits;
      if(data.length*8+4>capBits)throw new Error("Data too long for forced version "+ver);
    }
    const total=TOTAL_CODEWORDS[ver-1];
    const blocks=NUM_BLOCKS[ver-1];
    const eccLen=ECC_PER_BLOCK[ver-1];
    const dataLen=total-blocks*eccLen;
    const shortLen=Math.floor(dataLen/blocks);
    const numShort=blocks-(dataLen%blocks);

    /* bit buffer */
    const bits=[];
    const push=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1)};
    push(4,4); /* byte mode */
    push(data.length,ver<10?8:16);
    for(const b of data)push(b,8);
    /* terminator + pad */
    const cap=total*8;
    push(0,Math.min(4,cap-bits.length));
    while(bits.length%8!==0)bits.push(0);
    const padBytes=[0xEC,0x11];let pi=0;
    while(bits.length<cap){push(padBytes[pi++%2],8)}
    /* to bytes */
    const bytes=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];bytes.push(b)}
    /* split into blocks */
    const dBlocks=[],eBlocks=[];
    for(let k=0;k<blocks;k++){
      const len=k<numShort?shortLen:shortLen+1;
      const off=dBlocks.reduce((a,db)=>a+db.length,0);
      const dblock=bytes.slice(off,off+len);
      dBlocks.push(dblock);
      eBlocks.push(rsRemainder(dblock,eccLen));
    }
    /* interleave */
    const out=[];
    const maxD=Math.max(...dBlocks.map(b=>b.length));
    for(let i=0;i<maxD;i++)for(const b of dBlocks)if(i<b.length)out.push(b[i]);
    for(let i=0;i<eccLen;i++)for(const b of eBlocks)out.push(b[i]);
    return {codewords:out,version:ver};
  }

  function genMatrix(text,forceVer,forceMask){
    const enc=new TextEncoder?new TextEncoder():null;
    let bytes;
    if(typeof TextEncoder!=="undefined")bytes=Array.from(new TextEncoder().encode(text));
    else{bytes=[];for(let i=0;i<text.length;i++){const c=text.charCodeAt(i);if(c<128)bytes.push(c);else if(c<2048){bytes.push(0xC0|(c>>6),0x80|(c&63))}else{bytes.push(0xE0|(c>>12),0x80|((c>>6)&63),0x80|(c&63))}}}
    const {codewords,version}=encodeBytes(bytes,forceVer,0);
    const size=version*4+17;
    const modules=[],isFunction=[];
    for(let i=0;i<size;i++){modules.push(new Array(size).fill(false));isFunction.push(new Array(size).fill(false))}
    const setFn=(x,y,dark)=>{modules[y][x]=dark;isFunction[y][x]=true};
    /* finder + separator */
    const drawFinder=(fx,fy)=>{for(let dy=-1;dy<=7;dy++)for(let dx=-1;dx<=7;dx++){
      const x=fx+dx,y=fy+dy;if(x<0||x>=size||y<0||y>=size)continue;
      const d=(dx>=0&&dx<=6&&dy>=0&&dy<=6)&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4));
      setFn(x,y,d);}};
    drawFinder(0,0);drawFinder(size-7,0);drawFinder(0,size-7);
    /* alignment patterns — MUST be drawn BEFORE timing (they may overlap it) */
    const pos=ALIGN[version-1];
    if(pos)for(const cy of pos)for(const cx of pos){
      if(isFunction[cy][cx])continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)
        setFn(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
    /* timing (skips function modules already set) */
    for(let i=8;i<size-8;i++){if(!isFunction[6][i])setFn(i,6,i%2===0);if(!isFunction[i][6])setFn(6,i,i%2===0)}
    /* reserve format & version areas */
    drawFormat=(mask)=>{};
    const reserveFormat=()=>{for(let i=0;i<9;i++){if(!isFunction[8][i])setFn(i,8,false);if(!isFunction[i][8])setFn(8,i,false);}
      for(let i=0;i<8;i++){if(!isFunction[size-1-i][8])setFn(8,size-1-i,false);if(!isFunction[8][size-1-i])setFn(size-1-i,8,false);}
      setFn(8,size-8,true); /* dark module */
      if(version>=7){const vi=VERSION_INFO[version-1];
        for(let i=0;i<18;i++){const bit=((vi>>>i)&1)===1;const a=size-11+i%3,b=Math.floor(i/3);
          setFn(a,b,bit);setFn(b,a,bit);}}};
    reserveFormat();
    /* place data zigzag */
    let bi=0;const totalBits=codewords.length*8;
    for(let right=size-1;right>=1;right-=2){
      if(right===6)right=5;
      for(let vert=0;vert<size;vert++){
        for(let j=0;j<2;j++){
          const x=right-j;
          const upward=((right+1)&2)===0;
          const y=upward?size-1-vert:vert;
          if(!isFunction[y][x]&&bi<totalBits){
            modules[y][x]=((codewords[bi>>>3]>>>(7-(bi&7)))&1)===1;bi++;
          }
        }}}
    /* masking */
    const maskFn=(m,i,j)=>{
      switch(m){
        case 0:return (i+j)%2===0;
        case 1:return i%2===0;
        case 2:return j%3===0;
        case 3:return (i+j)%3===0;
        case 4:return (Math.floor(i/2)+Math.floor(j/3))%2===0;
        case 5:return ((i*j)%2)+((i*j)%3)===0;
        case 6:return (((i*j)%2)+((i*j)%3))%2===0;
        default:return (((i+j)%2)+((i*j)%3))%2===0;
      }};
    const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!isFunction[y][x]&&maskFn(m,y,x))modules[y][x]=!modules[y][x]};
    const drawFormatBits=m=>{const bits=FORMAT_BITS_M[m];
      for(let i=0;i<=5;i++)setFn(8,i,((bits>>>i)&1)===1);
      setFn(8,7,((bits>>>6)&1)===1);setFn(8,8,((bits>>>7)&1)===1);setFn(7,8,((bits>>>8)&1)===1);
      for(let i=9;i<15;i++)setFn(14-i,8,((bits>>>i)&1)===1);
      for(let i=0;i<8;i++)setFn(size-1-i,8,((bits>>>i)&1)===1);
      for(let i=8;i<15;i++)setFn(8,size-15+i,((bits>>>i)&1)===1);
      setFn(8,size-8,true);};
    const penalty=()=>{
      let p=0;
      /* rule 1 */
      for(let y=0;y<size;y++){let runC=1,runR=1;let prevC=modules[y][0],prevR=modules[0][y];
        for(let x=1;x<size;x++){const c=modules[y][x],r=modules[x][y];
          if(c===prevC){runC++;if(runC===5)p+=3;else if(runC>5)p++}else{runC=1;prevC=c}
          if(r===prevR){runR++;if(runR===5)p+=3;else if(runR>5)p++}else{runR=1;prevR=r}}}
      /* rule 2 */
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=modules[y][x];
        if(c===modules[y][x+1]&&c===modules[y+1][x]&&c===modules[y+1][x+1])p+=3;}
      /* rule 3 */
      const pat1=[true,false,true,true,true,false,true,false,false,false,false];
      const pat2=[false,false,false,false,true,false,true,true,true,false,true];
      const check=(get)=>{for(let k=0;k<size;k++)for(let l=0;l<=size-11;l++){
        let m1=true,m2=true;
        for(let i2=0;i2<11;i2++){const v=get(k,l+i2);
          if(v!==pat1[i2])m1=false;if(v!==pat2[i2])m2=false;}
        if(m1)p+=40;if(m2)p+=40;}};
      check((k,l)=>modules[k][l]);check((k,l)=>modules[l][k]);
      /* rule 4 */
      let dark=0;for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(modules[y][x])dark++;
      const totalM=size*size;const pct=dark*100/totalM;
      p+=Math.floor(Math.abs(pct-50)/5)*10;
      return p;
    };
    let bestMask=forceMask!==undefined?forceMask:0,bestP=Infinity;
    const startM=forceMask!==undefined?forceMask:0;
    const endM=forceMask!==undefined?forceMask:7;
    for(let m=startM;m<=endM;m++){
      applyMask(m);drawFormatBits(m);
      if(forceMask!==undefined){bestMask=m;break}
      const p=penalty();
      if(p<bestP){bestP=p;bestMask=m}
      applyMask(m); /* unmask */
    }
    if(forceMask===undefined){applyMask(bestMask);drawFormatBits(bestMask)}
    return {modules,size,version,mask:bestMask};
  }

  function svgOf(matrix,scale,quiet){
    const q=quiet===undefined?4:quiet;
    const s=matrix.size;
    const dim=(s+q*2)*scale;
    let rects="";
    for(let y=0;y<s;y++)for(let x=0;x<s;x++)
      if(matrix.modules[y][x])rects+=`<rect x="${(x+q)*scale}" y="${(y+q)*scale}" width="${scale}" height="${scale}"/>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" width="${dim}" height="${dim}" shape-rendering="crispEdges"><rect width="${dim}" height="${dim}" fill="#fff"/><g fill="#1e2c4f">${rects}</g></svg>`;
  }
  function generateSVG(text,scale){return svgOf(genMatrix(text),scale||3)}
  return {generateSVG,genMatrix,svgOf,encodeBytes};
})();
if(typeof module!=="undefined"&&module.exports)module.exports=QRCode;
</script>
