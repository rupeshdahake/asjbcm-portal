<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASJBCM Mock Test — Papers Set by Admin · Strict Mode</title>
<style>
:root{
  --bg:#f2f6fc;--card:#ffffff;--ink:#2b3a55;--ink2:#5b6b85;--muted:#8a97ad;--line:#e3eaf4;
  --brand:#4a6fdc;--brand2:#7b9bf0;--brandsoft:#eef3fe;
  --green:#31b573;--greensoft:#e7f8ef;--red:#e35d5d;--redsoft:#fdeaea;
  --amber:#f0a63a;--ambersoft:#fdf3e3;--purple:#8b5cf6;--purplesoft:#f3ecfe;
  --shadow:0 6px 24px rgba(90,110,160,.10);--r:16px;--r2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans','Noto Sans Devanagari',Roboto,Arial,sans-serif;
  background:linear-gradient(160deg,#f4f8fd 0%,#eef3fb 45%,#f6f2fa 100%);color:var(--ink);min-height:100vh;
  font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c3d0e6;border-radius:8px;border:2px solid #eef2f9}
::-webkit-scrollbar-track{background:#eef2f9}
.noselect,.noselect *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

header.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#4a6fdc,#7b9bf0);color:#fff;
  box-shadow:0 4px 14px rgba(74,111,220,.35)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.hbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;
  padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;display:inline-block}
.hbtn:hover{background:rgba(255,255,255,.28)}
.hspacer{flex:1}
.htitle{font-weight:800;font-size:14px;letter-spacing:.3px}

.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
main{padding:20px 0 90px}
.hero{position:relative;overflow:hidden;border-radius:24px;color:#fff;padding:30px 26px;
  background:linear-gradient(120deg,#e0457b 0%,#8b5cf6 55%,#4a6fdc 100%);box-shadow:0 14px 34px rgba(139,92,246,.32)}
.hero h1{font-size:clamp(22px,4vw,36px);font-weight:800;line-height:1.15}
.hero .sub{font-size:15px;opacity:.92;margin-top:6px;font-weight:700}
.badge{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 14px;font-size:12px;font-weight:800;backdrop-filter:blur(4px)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1.25fr .85fr;gap:18px;margin-top:18px}
@media(max-width:920px){.grid2{grid-template-columns:1fr}}
h2.sect{font-size:19px;font-weight:800;margin-bottom:6px}
p.desc{color:var(--ink2);font-size:14px}

.field{margin:14px 0}
.field label{display:block;font-weight:800;font-size:13px;color:var(--ink2);margin-bottom:6px;letter-spacing:.2px}
.field input[type=text],.field input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;
  font-size:15px;font-family:inherit;color:var(--ink);background:#fbfdff}
.field input:focus{outline:none;border-color:var(--brand);background:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:#fbfdff;color:var(--ink2);border-radius:12px;padding:9px 16px;
  font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s}
.seg button:hover{border-color:var(--brand2)}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(74,111,220,.35)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:#fbfdff;border-radius:999px;padding:6px 12px;font-size:12.5px;
  font-weight:700;color:var(--ink2);cursor:pointer;user-select:none}
.chip.on{background:var(--brandsoft);border-color:var(--brand);color:var(--brand)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle .sw{width:46px;height:26px;border-radius:999px;background:#cbd5e1;position:relative;transition:.2s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.toggle.on .sw{background:var(--green)}
.toggle.on .sw::after{left:23px}
.rules{background:var(--redsoft);border:1px solid #f6cfcf;border-radius:var(--r2);padding:14px 16px;font-size:13.5px;color:#8c3a3a;margin-top:6px}
.rules b{display:block;margin-bottom:4px;color:#b03030}
.rules ul{margin:6px 0 0 18px}
.rules li{margin:3px 0}
.bigbtn{display:block;width:100%;margin-top:18px;border:none;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:800;
  cursor:pointer;font-family:inherit;color:#fff;background:linear-gradient(135deg,#e0457b,#8b5cf6);box-shadow:0 8px 22px rgba(139,92,246,.4);transition:.15s}
.bigbtn:hover{transform:translateY(-1px)}
.bigbtn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.mini{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

table.hist{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.hist th{background:var(--brandsoft);color:var(--brand);text-align:left;padding:8px 10px;font-size:12px;letter-spacing:.4px}
table.hist td{padding:8px 10px;border-top:1px solid var(--line);color:var(--ink2)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:800}
.pill.ok{background:var(--greensoft);color:var(--green)}
.pill.bad{background:var(--redsoft);color:var(--red)}
.pill.warn{background:var(--ambersoft);color:#b97a1c}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}

/* ---------- test screen ---------- */
.testbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;background:#fff;color:var(--brand);border:2px solid var(--brand);border-radius:12px;
  padding:7px 14px;font-weight:800;font-size:16px}
.timer.low{color:var(--red);border-color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.vcount{background:var(--redsoft);color:var(--red);border-radius:12px;padding:7px 12px;font-weight:800;font-size:12.5px}
.pcode{background:var(--purplesoft);color:var(--purple);border-radius:12px;padding:7px 12px;font-weight:800;font-size:12.5px}
.testgrid{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:16px;align-items:start}
@media(max-width:980px){.testgrid{grid-template-columns:1fr}}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qnum{background:var(--brand);color:#fff;border-radius:10px;padding:5px 12px;font-weight:800;font-size:13px}
.qtag{background:var(--brandsoft);color:var(--brand);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.qtext{font-size:17px;font-weight:700;line-height:1.6;margin:10px 0 18px;white-space:pre-wrap}
.qfig{margin:0 0 16px;padding:12px;background:#fff;border:1px solid #dbe4f3;border-radius:12px;overflow-x:auto;text-align:center}
.qfig svg{max-width:100%;height:auto}
.qfig table{border-collapse:collapse;margin:0 auto;font-size:12.5px}
.qfig td,.qfig th{border:1px solid #c7d2e5;padding:5px 10px;white-space:nowrap}
.qfig .note{font-size:11px;color:#64748b;margin-top:5px}
.qpass{margin:0 0 14px;padding:13px 16px;background:var(--brandsoft);border:1px solid #d8e2f7;border-radius:12px;
  font-size:14px;line-height:1.65;color:#33456b;max-height:300px;overflow-y:auto}
.qpass p{margin:0 0 9px}.qpass p:last-child{margin:0}
.qpass b{color:var(--brand)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;
  cursor:pointer;background:#fbfdff;transition:.15s;font-size:15px}
.opt:hover{border-color:var(--brand2);background:#f6f9ff}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brandsoft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.opt.sel{border-color:var(--brand);background:var(--brandsoft);box-shadow:0 3px 10px rgba(74,111,220,.18)}
.opt.sel .k{background:var(--brand);color:#fff}
.tactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:12px;padding:10px 16px;
  font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s}
.btn:hover{border-color:var(--brand2);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.warn{background:var(--ambersoft);border-color:#f2d5a8;color:#b97a1c}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.palette{position:sticky;top:76px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;margin:10px 0}
.pq{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);
  font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.pq.cur{outline:3px solid var(--brand);outline-offset:1px}
.pq.done{background:var(--green);border-color:var(--green);color:#fff}
.pq.mark{background:var(--purple);border-color:var(--purple);color:#fff}
.pq.seen{background:#f1f5f9;color:#64748b}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.prog{height:8px;border-radius:99px;background:#e8eefb;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#2fb7a5);border-radius:99px;transition:.3s}

/* ---------- modal / overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);text-align:center}
.modal h3{font-size:18px;margin-bottom:8px}
.modal p{color:var(--ink2);font-size:14px}
.modal .row{display:flex;gap:10px;margin-top:16px}
.modal .row .btn{flex:1}
.vtoast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:120;background:var(--red);color:#fff;
  border-radius:14px;padding:12px 20px;font-weight:800;font-size:14px;box-shadow:0 10px 30px rgba(227,93,93,.5);text-align:center}
.vtoast small{display:block;font-weight:600;opacity:.9;font-size:12px}

/* ---------- result ---------- */
.scorehero{border-radius:24px;color:#fff;padding:30px 26px;background:linear-gradient(120deg,#31b573,#2fb7a5 60%,#4a6fdc);box-shadow:0 14px 34px rgba(49,181,115,.3)}
.scorehero.bad{background:linear-gradient(120deg,#e0457b,#e35d5d 60%,#f0a63a);box-shadow:0 14px 34px rgba(227,93,93,.3)}
.scorehero h1{font-size:clamp(26px,5vw,44px);font-weight:800}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.3px}
table.brk{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
table.brk th{background:var(--brandsoft);color:var(--brand);text-align:left;padding:9px 10px;font-size:12px}
table.brk td{padding:9px 10px;border-top:1px solid var(--line)}
.rev{border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin-top:12px;background:#fbfdff}
.rev .rq{font-weight:700;margin-bottom:8px}
.rev .ro{padding:7px 12px;border-radius:10px;margin:4px 0;font-size:14px;border:1.5px solid transparent}
.rev .ro.correct{background:var(--greensoft);border-color:var(--green);color:#1d7a4c;font-weight:700}
.rev .ro.wrong{background:var(--redsoft);border-color:var(--red);color:#b03030}
.rev .rex{margin-top:8px;font-size:13px;color:var(--ink2);background:var(--brandsoft);border-radius:10px;padding:9px 12px}
.errbox{background:var(--redsoft);border:1px solid #f6cfcf;color:#b03030;border-radius:14px;padding:16px;margin-top:14px;font-size:14px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="hbtn" href="index.html" target="_top">🏠 Portal</a>
  <a class="hbtn" href="book.html" target="_top">📚 Book</a>
  <div class="hspacer"></div>
  <span class="htitle">🎯 MOCK TEST · ADMIN-SET PAPERS · STRICT MODE</span>
</div></header>

<div class="wrap"><main id="app"></main></div>

<div id="modalhost"></div>
<script>
/* ============ Unique Mock Test — strict CBT engine ============ */
const $=s=>document.querySelector(s);
const BANK_URL="10000.json";
const LS_KEY="asjbcm_mock_v1";
let BANK=null;
const LS_PAPERS="asjbcm_papers_v1";
const state={student:"",lang:"all",paper:[],answers:[],marked:[],visited:[],
  idx:0,timeLeft:0,totalTime:0,timer:null,violations:[],code:"",status:"",startedAt:0,testing:false,finished:false,
  spec:null,customPapers:[]};
/* Papers are set by the ADMIN only. Built-in official papers + custom papers created
   in the Admin Panel (same device) or unlocked by students via ASJP1- paper codes. */
const BUILTIN_PAPERS=[
 {id:"asj_full_1",title:"Full Mock Test — All Subjects",dur:60,neg:0.25,lang:"en",
  instr:"Full-length mixed-subject paper set by the Admin. English medium.",
  fill:{subject:"*",count:44},fig:4,essay:2},
 {id:"asj_rapid_1",title:"Rapid Revision Mock — 25 Questions",dur:25,neg:0.25,lang:"en",
  instr:"Short quick-fire paper across all subjects.",
  fill:{subject:"*",count:23},fig:1,essay:1},
 {id:"asj_visual_1",title:"Diagram · Chart · Data Special",dur:35,neg:0,lang:"en",
  instr:"Extra weight on charts, tables, diagrams and essay/passage questions.",
  fill:{subject:"*",count:14},fig:12,essay:4},
 {id:"asj_essay_1",title:"Essay & Comprehension Test",dur:30,neg:0,lang:"en",
  instr:"Essay-passage comprehension sets with mixed-subject fillers.",
  fill:{subject:"*",count:17},fig:0,essay:8},
 {id:"asj_hi_1",title:"हिंदी माध्यम मॉक टेस्ट — 25 प्रश्न",dur:30,neg:0.25,lang:"hi",
  instr:"हिंदी/मराठी माध्यम के प्रश्नों का अभ्यास पेपर।",
  fill:{subject:"*",count:25},fig:0,essay:0}
];

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function newCode(){const a=new Uint32Array(2);crypto.getRandomValues(a);
  return ("UMT-"+(a[0].toString(36)+a[1].toString(36)).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,7).padEnd(7,"X"))}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

function histAll(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){return{}}}
function histFor(st){return histAll()[st]||[]}
function saveHist(st,rec){const all=histAll();const arr=all[st]||[];arr.unshift(rec);all[st]=arr.slice(0,20);
  try{localStorage.setItem(LS_KEY,JSON.stringify(all))}catch(e){}}

/* ---------- routing ---------- */
window.addEventListener("hashchange",route);
function route(){if(!BANK){return}const h=location.hash||"#/";
  if(h==="#test"&&state.paper.length)renderTest();
  else if(h==="#result"&&state.finished)renderResult();
  else renderPapers()}

/* ---------- papers (set by admin only) ---------- */
function isAdmin(){try{let sid=localStorage.getItem("asjbc_session");if(!sid)return false;try{sid=JSON.parse(sid)}catch(e){}
  const us=JSON.parse(localStorage.getItem("asjbc_users")||"[]");const u=us.find(x=>x.id===sid);
  return !!(u&&(u.role==="admin"||u.role==="teacher"))}catch(e){return false}}
function loadCustom(){try{const l=JSON.parse(localStorage.getItem(LS_PAPERS)||"[]");state.customPapers=Array.isArray(l)?l:[]}catch(e){state.customPapers=[]}return state.customPapers}
function saveCustom(list){state.customPapers=list.slice(0,30);try{localStorage.setItem(LS_PAPERS,JSON.stringify(state.customPapers))}catch(e){}}
function allPapers(){return BUILTIN_PAPERS.concat(loadCustom())}
/* paper code: ASJP1-<b64url(json)> */
function paperToCode(p){const j=JSON.stringify({v:1,t:p.title,d:p.dur,n:p.neg,l:p.lang,i:p.instr||"",s:p.fill,c:p.fig||0,e:p.essay||0});
  const b=btoa(unescape(encodeURIComponent(j))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "ASJP1-"+b}
function codeToPaper(code){try{let s=String(code).trim();if(!s.startsWith("ASJP1-"))return null;
  let b=s.slice(6).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
  const o=JSON.parse(decodeURIComponent(escape(atob(b))));if(!o||o.v!==1||!o.t||!o.s)return null;
  return {id:"imp_"+Date.now().toString(36),title:String(o.t).slice(0,80),dur:Math.max(5,Math.min(300,+o.d||30)),
    neg:[0,0.25,0.33,0.5].includes(+o.n)?+o.n:0.25,lang:o.l==="hi"||o.l==="all"?o.l:"en",
    instr:String(o.i||"").slice(0,300),
    fill:{subject:o.s&&o.s.subject?String(o.s.subject):"*",count:Math.max(1,Math.min(150,+o.s.count||25))},
    fig:Math.max(0,Math.min(20,+o.c||0)),essay:Math.max(0,Math.min(20,+o.e||0)),imported:true,at:Date.now()}}catch(e){return null}}
function paperTotal(p){return (p.fill&&p.fill.count?p.fill.count:0)+(p.fig||0)+(p.essay||0)}

function renderPapers(){
  const hist=histFor(state.student||"__anon");
  const admin=isAdmin();
  const papers=allPapers();
  const app=$("#app");
  app.innerHTML=`
  <section class="hero">
    <span class="badge">🛡️ STRICT EXAM ENVIRONMENT</span>
    <h1>Mock Tests — Papers Set by Admin</h1>
    <div class="sub">Question papers are prepared and assigned by the Admin only. Pick your assigned paper and enter the strict exam hall.</div>
  </section>
  <div class="grid2">
    <div class="card">
      <h2 class="sect">📋 My Assigned Papers</h2>
      <p class="desc">${BUILTIN_PAPERS.length} official paper(s) + ${loadCustom().length} unlocked / admin-shared paper(s).</p>
      <div class="field"><label>STUDENT NAME</label>
        <input type="text" id="fStudent" placeholder="Enter your name" value="${esc(state.student)}"></div>
      ${admin?`<div class="desc" style="background:var(--greensoft);border:1px solid #bfe8d2;border-radius:10px;padding:10px 12px;margin-bottom:12px">
        🛠️ You are signed in as <b>Admin</b>. Set new papers from <b>Admin Panel → 📝 Mock Papers</b>, or
        <button class="btn" style="padding:6px 10px;margin-left:4px" onclick="window.open('admin.html','_blank')">Open Paper Setter ↗</button></div>`:""}
      <div class="field"><label>HAVE A PAPER CODE? — paste the Admin's ASJP1- code to unlock a paper</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <input type="text" id="fCode" placeholder="ASJP1-…" style="flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-size:14px;font-family:inherit;background:#fbfdff">
          <button class="btn primary" id="bUnlock">🔓 Unlock</button>
        </div></div>
      <div id="paperList">
      ${papers.map((p,i)=>paperCard(p,i)).join("")}
      </div>
      <div class="rules"><b>⚠️ STRICT ENVIRONMENT RULES</b>
        Every paper runs in enforced full-screen with a locked-down interface:
        <ul>
          <li>Tab switching or leaving the window is recorded as a violation</li>
          <li>Exiting full-screen is recorded as a violation</li>
          <li>Copy, cut, paste, right-click, print and developer tools are blocked</li>
          <li>The timer keeps running during warnings — it never pauses</li>
          <li><b>3 violations = automatic submission with TERMINATED status</b></li>
          <li>Auto-submit when the timer reaches 00:00</li>
        </ul></div>
    </div>
    <div class="card">
      <h2 class="sect">📊 Previous attempts ${state.student?`— ${esc(state.student)}`:""}</h2>
      ${hist.length?`<table class="hist"><tr><th>Paper</th><th>Score</th><th>Acc.</th><th>⚠</th><th>Status</th></tr>
        ${hist.slice(0,8).map(r=>`<tr><td><b>${esc(r.paper||r.code)}</b><br><small>${esc(r.code)} · ${new Date(r.date).toLocaleString()}</small></td>
        <td>${r.score}/${r.total}</td><td>${r.acc}%</td><td>${r.violations}</td>
        <td><span class="pill ${r.status==="COMPLETED"?"ok":r.status==="TERMINATED"?"bad":"warn"}">${esc(r.status)}</span></td></tr>`).join("")}</table>`
        :`<p class="empty">No attempts yet on this device. Your assigned papers are listed on the left.</p>`}
      <div class="prog" style="margin-top:16px"><i style="width:${Math.min(100,hist.length*10)}%"></i></div>
      <p class="desc" style="margin-top:8px;font-size:12.5px">Practice progress: ${hist.length} attempt(s) taken. Aim for a new personal best each time!</p>
    </div>
  </div>`;
  $("#fStudent").addEventListener("input",e=>{state.student=e.target.value.trim()});
  document.querySelectorAll("[data-start]").forEach(b=>b.addEventListener("click",()=>{
    const p=allPapers()[+b.dataset.start];if(p)startPaper(p)}));
  $("#bUnlock").addEventListener("click",()=>{
    const p=codeToPaper($("#fCode").value);
    if(!p){toast("❌ Invalid paper code","Ask the Admin for a code starting with ASJP1-");return}
    const list=loadCustom();
    if(list.some(x=>x.title===p.title&&paperTotal(x)===paperTotal(p))){toast("ℹ️ This paper is already in your list","");return}
    list.unshift(p);saveCustom(list);
    toast("✅ Paper unlocked: "+p.title,"It now appears in your assigned papers list.");
    renderPapers();
  });
}
function paperCard(p,i){
  const total=paperTotal(p);
  const flags=[p.fig?`📊 ${p.fig} diagram/chart`:"",p.essay?`📝 ${p.essay} essay/passage`:""].filter(Boolean).join(" · ");
  const langB=p.lang==="en"?"🇬🇧 English":p.lang==="hi"?"हिंदी/मराठी":"🌐 All languages";
  return `<div style="border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:#fbfdff">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><b style="font-size:15.5px">${esc(p.title)}</b>
        <div style="font-size:12.5px;color:var(--ink2);margin-top:3px">
          📝 ${total} questions · ⏱️ ${p.dur} min · ${p.neg>0?`⚠️ −${p.neg} negative`:"no negative marking"} · ${langB}${flags?`<br>${flags}`:""}</div>
        ${p.instr?`<div style="font-size:12px;color:var(--ink2);margin-top:5px;background:var(--brandsoft);border-radius:8px;padding:6px 9px">📌 ${esc(p.instr)}</div>`:""}
      </div>
      <button class="btn primary" data-start="${i}" style="flex:none">▶ Start</button>
    </div></div>`;
}

/* ---------- paper resolution (unique per attempt, seeded) ---------- */
function langOK(m){const l=m.lang||(m.q&&/[\u0900-\u097F]/.test(m.q)?"hi":"en");return state.lang==="all"||l===state.lang}
function flattenBank(){
  const out=[];
  BANK.subjects.forEach(s=>s.chapters.forEach(c=>c.mcqs.forEach(m=>out.push({m,subj:s.name,key:s.subject}))));
  return out;
}
function mkItem(src,map){const m=src.m;
  return{q:m.q,options:map.map(j=>m.options[j]),answer:map.indexOf(m.answer),
    explanation:m.explanation||"",pyq:m.pyqTag||"",subj:src.subj,fig:m.fig||"",passage:m.passage||"",
    lang:m.lang||(m.q&&/[\u0900-\u097F]/.test(m.q)?"hi":"en")};}
function sample(pool,n,rnd){const idx=shuffle([...pool.keys()],rnd).slice(0,n);return idx.map(k=>pool[k])}
function resolvePaper(spec){
  state.lang=spec.lang||"all";
  const seedArr=new Uint32Array(1);crypto.getRandomValues(seedArr);
  let code=newCode();
  const hist=histFor(state.student||"__anon");
  let guard=0;while(hist.some(r=>r.code===code)&&guard++<10)code=newCode();
  const rnd=mulberry32(seedArr[0]);
  const all=flattenBank().filter(e=>langOK(e.m));
  const used=new Set();
  const take=(pool,n)=>{if(!n)return[];const fresh=pool.filter(e=>!used.has(e.m));
    const got=sample(fresh,Math.min(n,fresh.length),rnd);got.forEach(e=>used.add(e.m));return got};
  const figs=take(all.filter(e=>e.m.fig),spec.fig||0);
  const essays=take(all.filter(e=>e.m.passage),spec.essay||0);
  const subjOK=e=>!spec.fill.subject||spec.fill.subject==="*"||e.key===spec.fill.subject;
  const plain=all.filter(e=>subjOK(e)&&!e.m.fig&&!e.m.passage);
  const restPool=plain.length>=spec.fill.count?plain:plain.concat(all.filter(e=>subjOK(e)&&(e.m.fig||e.m.passage)));
  const fill=take(restPool,spec.fill.count);
  const picked=figs.concat(essays,fill);
  if(!picked.length)return 0;
  const paper=picked.map(e=>mkItem(e,shuffle([0,1,2,3],rnd)));
  shuffle(paper,rnd);
  state.paper=paper;state.code=code;state.spec=spec;
  state.answers=new Array(paper.length).fill(null);
  state.marked=new Array(paper.length).fill(false);
  state.visited=new Array(paper.length).fill(false);
  state.idx=0;state.violations=[];state.finished=false;
  state.totalTime=(spec.dur>0?spec.dur:paper.length)*60;
  state.timeLeft=state.totalTime;state.startedAt=Date.now();
  return paper.length;
}

/* ---------- start ---------- */
async function startPaper(spec){
  state.student=($("#fStudent")?.value||"").trim();
  if(!state.student){alert("Please enter the student name to personalise your attempt.");return}
  const n=resolvePaper(spec);
  if(!n||n<5){alert("This paper could not be composed — not enough questions in the bank for its language / subject scope. Please contact the Admin.");return}
  let fsMsg="";
  try{await document.documentElement.requestFullscreen()}catch(e){fsMsg=" (Full-screen unavailable in this browser — violations may still be recorded)"}
  location.hash="#test";
  renderTest();
  if(fsMsg)setTimeout(()=>toast("ℹ️ Strict mode active"+fsMsg,""),2600);
}

/* ---------- strict proctoring ---------- */
let lastVio=0;
function vion(type,msg){
  if(!state.testing)return;
  const now=Date.now();
  if(now-lastVio<1500)return;               // coalesce blur+visibility double-fire
  lastVio=now;
  state.violations.push({t:Math.floor((now-state.startedAt)/1000),type});
  toast(`⚠️ VIOLATION ${state.violations.length}/3 — ${msg}`,"A record has been added to your test log. The timer is still running.");
  renderVioCount();
  if(state.violations.length>=3)finish("TERMINATED");
}
function onVis(){if(document.hidden)vion("TAB_SWITCH","Tab switch / window hidden detected")}
function onBlur(){vion("WINDOW_BLUR","Window focus lost — stay on the test window")}
function onFs(){if(!document.fullscreenElement)vion("FULLSCREEN_EXIT","Full-screen exited — the test must stay in full-screen")}
function onKey(e){
  const k=(e.key||"").toLowerCase();
  if(e.key==="F12"||(e.ctrlKey&&e.shiftKey&&["i","j","c"].includes(k))){e.preventDefault();vion("DEVTOOLS","Developer tools shortcut blocked");return}
  if((e.ctrlKey||e.metaKey)&&["c","x","v","p","s","u"].includes(k)){e.preventDefault();vion("CLIPBOARD","Copy / paste / print shortcut blocked");return}
  if(e.key==="PrintScreen"){vion("SCREENSHOT","Screenshot key detected")}
}
function onCtx(e){e.preventDefault();if(!matchMedia("(pointer:coarse)").matches)vion("RIGHT_CLICK","Right-click is disabled in strict mode")}
function onCopy(e){e.preventDefault();vion("COPY","Copy attempt blocked")}
function onBefore(e){e.preventDefault();e.returnValue=""}
function armStrict(on){
  const A=on?"addEventListener":"removeEventListener";
  document[A]("visibilitychange",onVis);
  window[A]("blur",onBlur);
  document[A]("fullscreenchange",onFs);
  document[A]("keydown",onKey,true);
  document[A]("contextmenu",onCtx,true);
  document[A]("copy",onCopy,true);document[A]("cut",onCopy,true);document[A]("paste",onCopy,true);
  window[A]("beforeunload",onBefore);
}

/* ---------- test screen ---------- */
function renderTest(){
  state.testing=true;
  armStrict(true);
  const app=$("#app");
  app.innerHTML=`
  <section class="card testbar noselect">
    <span class="pcode">📄 ${esc(state.code)}</span>
    <span class="qtag">📋 ${esc(state.spec?state.spec.title:"")}</span>
    <span class="qtag">👤 ${esc(state.student)}</span>
    <div class="hspacer" style="flex:1"></div>
    <span class="vcount" id="vio">⚠️ Violations: 0/3</span>
    <span class="timer" id="timer">--:--</span>
  </section>
  <div class="testgrid noselect">
    <div class="card" id="qbox"></div>
    <div class="card palette" id="pbox"></div>
  </div>`;
  renderVioCount();renderQ();renderPalette();
  state.timer=setInterval(tick,1000);tick();
}
function renderVioCount(){const el=$("#vio");if(el)el.textContent=`⚠️ Violations: ${state.violations.length}/3`}
function tick(){
  const el=$("#timer");if(!el)return;
  if(state.timeLeft<=0){finish("TIME UP");return}
  el.textContent=fmt(state.timeLeft);
  el.classList.toggle("low",state.timeLeft<300);
  state.timeLeft--;
}
function renderQ(){
  const i=state.idx,q=state.paper[i];
  state.visited[i]=true;
  $("#qbox").innerHTML=`
    <div class="qmeta"><span class="qnum">Q ${i+1} / ${state.paper.length}</span>
      <span class="qtag">${esc(q.subj)}</span>
      ${state.lang==="all"&&q.lang==="hi"?`<span class="qtag">हिंदी/मराठी</span>`:""}
      ${q.pyq?`<span class="qtag" style="background:var(--redsoft);color:var(--red)">📌 PYQ</span>`:""}
      ${q.passage?`<span class="qtag" style="background:var(--greensoft);color:var(--green)">📝 Essay / Passage</span>`:""}
      ${state.marked[i]?`<span class="qtag" style="background:var(--purplesoft);color:var(--purple)">🚩 Marked</span>`:""}</div>
    ${q.passage?`<div class="qpass">${q.passage}</div>`:""}
    <div class="qtext">${esc(q.q)}</div>
    ${q.fig?`<div class="qfig">${q.fig}</div>`:""}
    <div class="opts">${q.options.map((o,j)=>`<div class="opt ${state.answers[i]===j?"sel":""}" data-j="${j}">
      <span class="k">${"ABCD"[j]}</span><span>${esc(o)}</span></div>`).join("")}</div>
    <div class="tactions">
      <button class="btn" id="bPrev" ${i===0?"disabled":""}>← Previous</button>
      <button class="btn warn" id="bMark">${state.marked[i]?"Unmark 🚩":"Mark for review 🚩"}</button>
      <button class="btn" id="bClear">Clear response</button>
      <button class="btn primary" id="bNext">${i===state.paper.length-1?"Last question →":"Save & Next →"}</button>
    </div>`;
  $("#qbox").querySelectorAll(".opt").forEach(o=>o.addEventListener("click",()=>{
    state.answers[i]=+o.dataset.j;renderQ();renderPalette()}));
  $("#bPrev").addEventListener("click",()=>{if(state.idx>0){state.idx--;renderQ();renderPalette()}});
  $("#bNext").addEventListener("click",()=>{if(state.idx<state.paper.length-1){state.idx++;renderQ();renderPalette()}else submitAsk()});
  $("#bMark").addEventListener("click",()=>{state.marked[i]=!state.marked[i];renderQ();renderPalette()});
  $("#bClear").addEventListener("click",()=>{state.answers[i]=null;renderQ();renderPalette()});
}
function renderPalette(){
  const done=state.answers.filter(a=>a!==null).length;
  $("#pbox").innerHTML=`
    <h2 class="sect" style="font-size:15px">🗂️ Question palette</h2>
    <div class="pgrid">${state.paper.map((_,j)=>{
      const cls=state.answers[j]!==null?"done":state.marked[j]?"mark":state.visited[j]?"seen":"";
      return `<button class="pq ${cls} ${j===state.idx?"cur":""}" data-j="${j}">${j+1}</button>`}).join("")}</div>
    <div class="legend">
      <span><i style="background:var(--green)"></i>Answered (${state.answers.filter(a=>a!==null).length})</span>
      <span><i style="background:var(--purple)"></i>Marked (${state.marked.filter(Boolean).length})</span>
      <span><i style="background:#f1f5f9"></i>Seen, not answered</span>
      <span><i style="background:#fff;border:1.5px solid var(--line)"></i>Not visited</span>
    </div>
    <div class="prog"><i style="width:${Math.round(done/state.paper.length*100)}%"></i></div>
    <button class="btn danger" style="width:100%;margin-top:14px" id="bSubmit">✅ Submit Final Paper</button>`;
  $("#pbox").querySelectorAll(".pq").forEach(b=>b.addEventListener("click",()=>{
    state.idx=+b.dataset.j;renderQ();renderPalette()}));
  $("#bSubmit").addEventListener("click",submitAsk);
}
function submitAsk(){
  const a=state.answers.filter(x=>x!==null).length,u=state.paper.length-a;
  showModal(`<h3>Submit the paper?</h3>
    <p>Answered: <b>${a}</b> · Not answered: <b>${u}</b> · Marked: <b>${state.marked.filter(Boolean).length}</b><br>
    Time remaining: <b>${fmt(state.timeLeft)}</b><br>Once submitted, the paper cannot be reopened.</p>
    <div class="row"><button class="btn" id="mNo">Continue test</button>
    <button class="btn primary" id="mYes">Submit now</button></div>`);
  $("#mNo").addEventListener("click",closeModal);
  $("#mYes").addEventListener("click",()=>{closeModal();finish("SUBMITTED")});
}

/* ---------- finish & result ---------- */
function finish(status){
  if(state.finished)return;
  state.finished=true;state.testing=false;
  clearInterval(state.timer);armStrict(false);
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  state.status=status;
  const neg=state.spec?state.spec.neg:0;
  let correct=0,wrong=0;
  state.paper.forEach((q,i)=>{if(state.answers[i]===null)return;
    state.answers[i]===q.answer?correct++:wrong++});
  const unatt=state.paper.length-correct-wrong;
  const score=Math.max(0,correct-wrong*neg);
  const att=correct+wrong;
  const rec={code:state.code,paper:state.spec?state.spec.title:"",date:new Date().toISOString(),total:state.paper.length,
    score:Math.round(score*100)/100,correct,wrong,unatt,
    acc:att?Math.round(correct/att*100):0,status,
    violations:state.violations.length,dur:state.totalTime-state.timeLeft,
    student:state.student};
  saveHist(state.student||"__anon",rec);
  state._result=rec;
  location.hash="#result";
  renderResult();
}
function renderResult(){
  const r=state._result;
  const good=r.score/r.total>=0.4;
  const neg=state.spec?state.spec.neg:0;
  const per={};
  state.paper.forEach((q,i)=>{const s=q.subj;per[s]=per[s]||{c:0,w:0,u:0};
    if(state.answers[i]===null)per[s].u++;
    else state.answers[i]===q.answer?per[s].c++:per[s].w++});
  $("#app").innerHTML=`
  <section class="scorehero ${good?"":"bad"}">
    <span class="badge">${r.status==="TERMINATED"?"⛔ TERMINATED — 3 VIOLATIONS":r.status==="TIME UP"?"⏰ TIME UP — AUTO SUBMITTED":"✅ SUBMITTED"}</span>
    <h1>${Math.round(r.score*100)/100} / ${r.total} marks</h1>
    <div class="sub">${esc(state.spec?state.spec.title:"Mock Paper")} · Paper ${esc(r.code)} · ${esc(state.student)} · ${new Date(r.date).toLocaleString()}</div>
  </section>
  <div class="statgrid">
    <div class="stat"><b style="color:var(--green)">${r.correct}</b><span>CORRECT</span></div>
    <div class="stat"><b style="color:var(--red)">${r.wrong}</b><span>WRONG ${neg?`(−${Math.round(r.wrong*neg*100)/100})`:""}</span></div>
    <div class="stat"><b>${r.unatt}</b><span>UNATTEMPTED</span></div>
    <div class="stat"><b>${r.acc}%</b><span>ACCURACY</span></div>
    <div class="stat"><b>${fmt(r.dur)}</b><span>TIME USED</span></div>
    <div class="stat"><b style="color:${r.violations?"var(--red)":"var(--green)"}">${r.violations}</b><span>VIOLATIONS</span></div>
  </div>
  ${r.status==="TERMINATED"?`<div class="errbox">⛔ <b>Strict-mode termination:</b> three environment violations were recorded, so the paper was force-submitted. Violation log: ${state.violations.map(v=>`${v.type} @ ${fmt(v.t)}`).join(", ")}.</div>`:""}
  <div class="grid2">
    <div class="card">
      <h2 class="sect">📚 Subject-wise breakdown</h2>
      <table class="brk"><tr><th>Subject</th><th>✓</th><th>✗</th><th>—</th></tr>
      ${Object.entries(per).map(([s,v])=>`<tr><td>${esc(s)}</td><td>${v.c}</td><td>${v.w}</td><td>${v.u}</td></tr>`).join("")}</table>
      ${state.violations.length?`<h2 class="sect" style="margin-top:18px">⚠️ Violation log</h2>
        <table class="brk"><tr><th>Time</th><th>Type</th></tr>
        ${state.violations.map(v=>`<tr><td>${fmt(v.t)}</td><td>${esc(v.type)}</td></tr>`).join("")}</table>`:""}
      <button class="bigbtn" onclick="location.hash='#/'">📋 Back to My Assigned Papers</button>
    </div>
    <div class="card">
      <h2 class="sect">📖 Answer review</h2>
      <p class="desc">Every question with the correct answer and explanation.</p>
      ${state.paper.map((q,i)=>{
        const mine=state.answers[i];
        return `<div class="rev"><div class="rq">Q${i+1}. ${esc(q.q)}</div>
        ${q.passage?`<div class="qpass">${q.passage}</div>`:""}
        ${q.fig?`<div class="qfig">${q.fig}</div>`:""}
        ${q.options.map((o,j)=>`<div class="ro ${j===q.answer?"correct":j===mine?"wrong":""}">
          <b>${"ABCD"[j]}.</b> ${esc(o)}${j===mine&&j!==q.answer?" ← your answer":""}</div>`).join("")}
        ${mine===null?`<div class="ro" style="background:#f1f5f9">— not attempted —</div>`:""}
        <div class="rex">💡 ${esc(q.explanation)}</div></div>`}).join("")}
    </div>
  </div>`;
  window.scrollTo(0,0);
}

/* ---------- modal & toast ---------- */
function showModal(html){$("#modalhost").innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`}
function closeModal(){$("#modalhost").innerHTML=""}
let toastTimer=null;
function toast(big,small){
  const host=$("#modalhost");
  const old=host.querySelector(".vtoast");if(old)old.remove();
  const d=document.createElement("div");d.className="vtoast";
  d.innerHTML=`${esc(big)}${small?`<small>${esc(small)}</small>`:""}`;
  host.appendChild(d);
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),3400);
}

/* ---------- boot ---------- */
(async function(){
  try{
    const p=new URLSearchParams(location.search);
    state.student=(p.get("student")||"").trim();
    const res=await fetch(BANK_URL);
    if(!res.ok)throw new Error("HTTP "+res.status);
    BANK=await res.json();
    route();
  }catch(e){
    $("#app").innerHTML=`<div class="errbox">⚠️ Could not load the question bank (<code>10000.json</code>).<br>
    If you opened this file directly from disk, please serve the folder over HTTP — e.g. run <code>python -m http.server 8000</code> and open <code>http://localhost:8000/mock.html</code>.<br><small>${esc(e.message)}</small></div>`;
  }
})();
</script>
